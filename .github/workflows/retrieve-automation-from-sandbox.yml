name: Retrieve SFMC Automation from Sandbox

on:
  workflow_dispatch:
    inputs:
      automation_name:
        description: "Exact existing Automation Studio automation name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  retrieve-automation:
    name: Retrieve Existing Sandbox Automation
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SANDBOX
      # ============================================================
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox
          fetch-depth: 0


      # ============================================================
      # 2. VALIDATE CONFIG
      # ============================================================
      - name: Validate configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/lob-config.json"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: $CONFIG_FILE not found."
            exit 1
          fi

          LOB=$(jq -r '.lineOfBusiness // empty' "$CONFIG_FILE")
          ASSET_ROOT=$(jq -r '.assetRoot // empty' "$CONFIG_FILE")
          SANDBOX_MID=$(jq -r '.environments.sandbox.businessUnitMid // empty' "$CONFIG_FILE")

          AUTOMATIONS_ENABLED=$(jq -r '.assetTypes.automations.enabled // false' "$CONFIG_FILE")
          AUTOMATIONS_DIR=$(jq -r '.assetTypes.automations.directory // empty' "$CONFIG_FILE")

          if [ -z "$LOB" ]; then
            echo "ERROR: lineOfBusiness missing."
            exit 1
          fi

          if [ -z "$ASSET_ROOT" ]; then
            echo "ERROR: assetRoot missing."
            exit 1
          fi

          if [ -z "$SANDBOX_MID" ]; then
            echo "ERROR: Sandbox MID missing."
            exit 1
          fi

          if [ "$AUTOMATIONS_ENABLED" != "true" ]; then
            echo "ERROR: Automation retrieval is disabled in config."
            exit 1
          fi

          if [ -z "$AUTOMATIONS_DIR" ]; then
            echo "ERROR: Automation directory missing."
            exit 1
          fi

          echo "lob=$LOB" >> "$GITHUB_OUTPUT"
          echo "asset_root=$ASSET_ROOT" >> "$GITHUB_OUTPUT"
          echo "sandbox_mid=$SANDBOX_MID" >> "$GITHUB_OUTPUT"
          echo "automations_dir=$AUTOMATIONS_DIR" >> "$GITHUB_OUTPUT"

          echo "Configuration validated."
          echo "LOB: $LOB"
          echo "Sandbox MID: $SANDBOX_MID"


      # ============================================================
      # 3. VALIDATE INPUT
      # ============================================================
      - name: Validate input
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          if [ -z "$AUTOMATION_NAME" ]; then
            echo "ERROR: Automation name is required."
            exit 1
          fi

          echo "Automation requested:"
          echo "$AUTOMATION_NAME"


      # ============================================================
      # 4. VALIDATE SECRETS
      # ============================================================
      - name: Validate GitHub secrets
        shell: bash
        env:
          AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$AUTH_BASE_URI" ]; then
            echo "ERROR: SFMC_AUTH_BASE_URI missing."
            exit 1
          fi

          if [ -z "$CLIENT_ID" ]; then
            echo "ERROR: SFMC_CLIENT_ID missing."
            exit 1
          fi

          if [ -z "$CLIENT_SECRET" ]; then
            echo "ERROR: SFMC_CLIENT_SECRET missing."
            exit 1
          fi

          echo "Required secrets are available."


      # ============================================================
      # 5. AUTHENTICATE TO SANDBOX BU
      # ============================================================
      - name: Authenticate to SFMC Sandbox
        id: auth
        shell: bash
        env:
          AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${AUTH_BASE_URI%/}/v2/token" \
            --header "Content-Type: application/json" \
            --data "{
              \"grant_type\":\"client_credentials\",
              \"client_id\":\"${CLIENT_ID}\",
              \"client_secret\":\"${CLIENT_SECRET}\",
              \"account_id\":\"${SANDBOX_MID}\"
            }")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          SOAP_URL=$(echo "$TOKEN_RESPONSE" | jq -r '.soap_instance_url // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Access token not returned."
            exit 1
          fi

          if [ -z "$SOAP_URL" ]; then
            echo "ERROR: SOAP URL not returned."
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "soap_url=$SOAP_URL" >> "$GITHUB_OUTPUT"

          echo "SFMC Sandbox authentication successful."


      # ============================================================
      # 6. RETRIEVE EXISTING AUTOMATION METADATA
      #
      # ObjectID is NOT mandatory.
      #
      # Current live test proved:
      # - Automation Name returned
      # - CustomerKey returned
      # - Status returned
      # - ObjectID may be blank
      #
      # CustomerKey is therefore preserved as the required stable
      # SFMC identity for this retrieval phase.
      # ============================================================
      - name: Retrieve existing Automation metadata
        id: automation
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL AUTOMATION_NAME

          python3 <<'PY'
          import os
          import html
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          automation_name = os.environ["AUTOMATION_NAME"]

          def esc(value):
              return html.escape(value or "", quote=True)

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{esc(token)}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>

              <et:RetrieveRequestMsg>

                <et:RetrieveRequest>

                  <et:ObjectType>Automation</et:ObjectType>

                  <et:Properties>ObjectID</et:Properties>
                  <et:Properties>CustomerKey</et:Properties>
                  <et:Properties>Name</et:Properties>
                  <et:Properties>Description</et:Properties>
                  <et:Properties>Status</et:Properties>
                  <et:Properties>IsActive</et:Properties>
                  <et:Properties>CreatedDate</et:Properties>
                  <et:Properties>ModifiedDate</et:Properties>

                  <et:Filter xsi:type="et:SimpleFilterPart">
                    <et:Property>Name</et:Property>
                    <et:SimpleOperator>equals</et:SimpleOperator>
                    <et:Value>{esc(automation_name)}</et:Value>
                  </et:Filter>

                </et:RetrieveRequest>

              </et:RetrieveRequestMsg>

            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=UTF-8",
                  "SOAPAction": "Retrieve"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  xml_data = response.read()

          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(error_body)

              raise SystemExit(
                  f"Automation SOAP Retrieve failed "
                  f"with HTTP {exc.code}."
              )

          except Exception as exc:
              raise SystemExit(
                  f"Automation SOAP Retrieve failed: {exc}"
              )

          with open(
              "automation-response.xml",
              "wb"
          ) as f:
              f.write(xml_data)

          root = ET.fromstring(xml_data)

          overall = ""
          results = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":
                  overall = (element.text or "").strip()

              if local != "Results":
                  continue

              current = {}

              for child in list(element):
                  key = child.tag.split("}")[-1]
                  current[key] = (
                      child.text or ""
                  ).strip()

              if current.get("Name"):
                  results.append(current)

          if overall not in (
              "OK",
              "MoreDataAvailable"
          ):
              raise SystemExit(
                  "Automation Retrieve returned status: "
                  + overall
              )

          exact = [
              item
              for item in results
              if item.get("Name") == automation_name
          ]

          if not exact:
              raise SystemExit(
                  "Existing Sandbox Automation was not found."
              )

          if len(exact) > 1:
              raise SystemExit(
                  "More than one Automation matched the "
                  "exact name. Retrieval stopped to avoid "
                  "ambiguity."
              )

          automation = exact[0]

          object_id = automation.get(
              "ObjectID",
              ""
          )

          customer_key = automation.get(
              "CustomerKey",
              ""
          )

          print("")
          print("============================================")
          print("EXISTING SANDBOX AUTOMATION FOUND")
          print("============================================")
          print(
              "Name:",
              automation.get("Name", "")
          )
          print(
              "CustomerKey:",
              customer_key
          )
          print(
              "ObjectID:",
              object_id or "[not returned by SFMC]"
          )
          print(
              "Status:",
              automation.get("Status", "")
          )
          print("============================================")

          # CustomerKey is mandatory.
          if not customer_key:
              raise SystemExit(
                  "Automation was found but CustomerKey "
                  "was not returned."
              )

          # ObjectID is NOT mandatory.
          if not object_id:
              print("")
              print(
                  "INFO: SFMC did not return ObjectID "
                  "for this existing Automation."
              )
              print(
                  "Continuing with the SFMC-returned "
                  "CustomerKey."
              )

          output = os.environ["GITHUB_OUTPUT"]

          with open(
              output,
              "a"
          ) as f:
              f.write(
                  f"object_id={object_id}\n"
              )
              f.write(
                  f"customer_key={customer_key}\n"
              )

          with open(
              "automation-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  automation,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print(
              "Automation identity successfully resolved."
          )
          PY


      # ============================================================
      # 7. RETRIEVE SANDBOX QUERY DEFINITIONS
      #
      # No relationship is guessed here.
      #
      # This step independently retrieves QueryDefinitions and their
      # real SFMC metadata.
      # ============================================================
      - name: Retrieve Sandbox QueryDefinitions
        id: queries
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          properties = [
              "ObjectID",
              "CustomerKey",
              "Name",
              "Description",
              "QueryText",
              "TargetType",
              "TargetUpdateType",
              "DataExtensionTarget.ObjectID",
              "DataExtensionTarget.CustomerKey",
              "DataExtensionTarget.Name",
              "CreatedDate",
              "ModifiedDate"
          ]

          def soap_retrieve(
              continue_request=None
          ):

              if continue_request:

                  retrieve_body = f"""
                  <et:RetrieveRequest>
                    <et:ContinueRequest>{continue_request}</et:ContinueRequest>
                  </et:RetrieveRequest>
                  """

              else:

                  props = "\n".join(
                      f"<et:Properties>{p}</et:Properties>"
                      for p in properties
                  )

                  retrieve_body = f"""
                  <et:RetrieveRequest>

                    <et:ObjectType>
                      QueryDefinition
                    </et:ObjectType>

                    {props}

                  </et:RetrieveRequest>
                  """

              body = f"""<?xml version="1.0" encoding="UTF-8"?>
              <soapenv:Envelope
                xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                xmlns:et="http://exacttarget.com/wsdl/partnerAPI">

                <soapenv:Header>
                  <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
                </soapenv:Header>

                <soapenv:Body>

                  <et:RetrieveRequestMsg>

                    {retrieve_body}

                  </et:RetrieveRequestMsg>

                </soapenv:Body>

              </soapenv:Envelope>
              """

              request = urllib.request.Request(
                  soap_url + "/Service.asmx",
                  data=body.encode("utf-8"),
                  headers={
                      "Content-Type":
                          "text/xml; charset=UTF-8",
                      "SOAPAction":
                          "Retrieve"
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request
                  ) as response:
                      return response.read()

              except urllib.error.HTTPError as exc:

                  error_body = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(error_body)

                  raise SystemExit(
                      f"QueryDefinition Retrieve failed "
                      f"with HTTP {exc.code}."
                  )

          all_queries = []

          continue_request = None

          while True:

              xml_data = soap_retrieve(
                  continue_request
              )

              root = ET.fromstring(
                  xml_data
              )

              overall = ""
              request_id = ""

              for element in root.iter():

                  local = element.tag.split("}")[-1]

                  if local == "OverallStatus":
                      overall = (
                          element.text or ""
                      ).strip()

                  elif local == "RequestID":
                      request_id = (
                          element.text or ""
                      ).strip()

                  elif local == "Results":

                      current = {}

                      for child in list(element):

                          key = child.tag.split("}")[-1]

                          if key == "DataExtensionTarget":

                              target = {}

                              for nested in list(child):

                                  nested_key = (
                                      nested.tag
                                      .split("}")[-1]
                                  )

                                  target[nested_key] = (
                                      nested.text or ""
                                  ).strip()

                              current[
                                  "DataExtensionTarget"
                              ] = target

                          else:

                              current[key] = (
                                  child.text or ""
                              ).strip()

                      # Keep QueryDefinitions that have a usable
                      # SFMC identity.
                      if (
                          current.get("ObjectID")
                          or current.get("CustomerKey")
                      ):
                          all_queries.append(
                              current
                          )

              if overall not in (
                  "OK",
                  "MoreDataAvailable"
              ):
                  raise SystemExit(
                      "QueryDefinition Retrieve returned "
                      "status: "
                      + overall
                  )

              if overall != "MoreDataAvailable":
                  break

              if not request_id:
                  raise SystemExit(
                      "SFMC returned MoreDataAvailable "
                      "without RequestID."
                  )

              continue_request = request_id

          with open(
              "query-definitions.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  all_queries,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("============================================")
          print("SANDBOX QUERY DEFINITIONS RETRIEVED")
          print("============================================")
          print(
              "Count:",
              len(all_queries)
          )
          print("============================================")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  f"query_count={len(all_queries)}\n"
              )
          PY


      # ============================================================
      # 8. BUILD SAFE RETRIEVAL DEFINITION
      #
      # Important:
      # QueryDefinitions are discovered, but they are NOT attached
      # to this Automation unless SFMC gives us relationship proof.
      # ============================================================
      - name: Build Automation retrieval definition
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
          LOB: ${{ steps.config.outputs.lob }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
        run: |
          set -euo pipefail

          export AUTOMATION_NAME LOB SANDBOX_MID

          python3 <<'PY'
          import os
          import json

          with open(
              "automation-metadata.json",
              encoding="utf-8"
          ) as f:
              automation = json.load(f)

          with open(
              "query-definitions.json",
              encoding="utf-8"
          ) as f:
              queries = json.load(f)

          automation_object_id = (
              automation.get("ObjectID", "")
              or ""
          )

          automation_customer_key = (
              automation.get("CustomerKey", "")
              or ""
          )

          definition = {
              "schemaVersion": "1.0",

              "assetType": "automation",

              "environment": "sandbox",

              "businessUnitMid":
                  os.environ["SANDBOX_MID"],

              "lineOfBusiness":
                  os.environ["LOB"],

              "automation": {
                  "name":
                      automation.get(
                          "Name",
                          ""
                      ),

                  "customerKey":
                      automation_customer_key,

                  "objectId":
                      automation_object_id,

                  "description":
                      automation.get(
                          "Description",
                          ""
                      ),

                  "status":
                      automation.get(
                          "Status",
                          ""
                      ),

                  "isActive":
                      automation.get(
                          "IsActive",
                          ""
                      ),

                  "createdDate":
                      automation.get(
                          "CreatedDate",
                          ""
                      ),

                  "modifiedDate":
                      automation.get(
                          "ModifiedDate",
                          ""
                      )
              },

              "identity": {
                  "customerKeyResolved":
                      bool(
                          automation_customer_key
                      ),

                  "objectIdReturned":
                      bool(
                          automation_object_id
                      )
              },

              "relationships": {
                  "status":
                      "UNRESOLVED",

                  "reason":
                      "Automation metadata was retrieved "
                      "successfully. QueryDefinitions were "
                      "retrieved independently. No "
                      "Automation-to-Query relationship is "
                      "being guessed without SFMC-returned "
                      "relationship evidence."
              },

              "discovery": {
                  "queryDefinitionsRetrieved":
                      len(queries)
              }
          }

          with open(
              "retrieved-definition.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  definition,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("============================================")
          print("AUTOMATION RETRIEVAL RESULT")
          print("============================================")

          print(
              "Automation:",
              definition[
                  "automation"
              ]["name"]
          )

          print(
              "CustomerKey:",
              definition[
                  "automation"
              ]["customerKey"]
          )

          print(
              "ObjectID:",
              definition[
                  "automation"
              ]["objectId"]
              or "[not returned]"
          )

          print(
              "QueryDefinitions discovered:",
              len(queries)
          )

          print(
              "Relationship:",
              definition[
                  "relationships"
              ]["status"]
          )

          print("============================================")
          PY


      # ============================================================
      # 9. CREATE CONFIG-DRIVEN OUTPUT DIRECTORY
      # ============================================================
      - name: Save retrieved Automation definition
        id: save
        shell: bash
        env:
          ASSET_ROOT: ${{ steps.config.outputs.asset_root }}
          LOB: ${{ steps.config.outputs.lob }}
          AUTOMATIONS_DIR: ${{ steps.config.outputs.automations_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          SAFE_NAME=$(printf '%s' "$AUTOMATION_NAME" \
            | sed 's/[^A-Za-z0-9._-]/_/g')

          OUTPUT_DIR="${ASSET_ROOT}/${LOB}/${AUTOMATIONS_DIR}/${SAFE_NAME}"

          mkdir -p "$OUTPUT_DIR"

          cp retrieved-definition.json \
            "$OUTPUT_DIR/definition.json"

          cp automation-metadata.json \
            "$OUTPUT_DIR/automation-metadata.json"

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Retrieved Automation saved to:"
          echo "$OUTPUT_DIR"


      # ============================================================
      # 10. DISPLAY DEFINITION
      # ============================================================
      - name: Display retrieved definition
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
        run: |
          set -euo pipefail

          echo ""
          echo "============================================"
          echo "RETRIEVED AUTOMATION DEFINITION"
          echo "============================================"

          jq . "$OUTPUT_DIR/definition.json"


      # ============================================================
      # 11. COMMIT ONLY WHEN SOMETHING CHANGED
      # ============================================================
      - name: Commit retrieved Automation
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No Automation metadata changes detected."
            exit 0
          fi

          git commit \
            -m "Retrieve SFMC Automation: ${AUTOMATION_NAME}"

          git push origin HEAD:sandbox

          echo ""
          echo "Automation retrieval committed successfully."


      # ============================================================
      # 12. FINAL RESULT
      # ============================================================
      - name: Retrieval complete
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
          AUTOMATION_OBJECT_ID: ${{ steps.automation.outputs.object_id }}
          AUTOMATION_CUSTOMER_KEY: ${{ steps.automation.outputs.customer_key }}
          QUERY_COUNT: ${{ steps.queries.outputs.query_count }}
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "SFMC SANDBOX AUTOMATION RETRIEVAL COMPLETED"
          echo "=================================================="

          echo ""
          echo "Automation:"
          echo "$AUTOMATION_NAME"

          echo ""
          echo "CustomerKey:"
          echo "$AUTOMATION_CUSTOMER_KEY"

          echo ""
          echo "ObjectID:"
          if [ -n "$AUTOMATION_OBJECT_ID" ]; then
            echo "$AUTOMATION_OBJECT_ID"
          else
            echo "[not returned by SFMC]"
          fi

          echo ""
          echo "Sandbox QueryDefinitions retrieved:"
          echo "$QUERY_COUNT"

          echo ""
          echo "Automation metadata retrieval: SUCCESS"
          echo "Automation CustomerKey resolved: SUCCESS"

          if [ -n "$AUTOMATION_OBJECT_ID" ]; then
            echo "Automation ObjectID returned: YES"
          else
            echo "Automation ObjectID returned: NO"
          fi

          echo ""
          echo "Task/activity relationship:"
          echo "UNRESOLVED - no relationship guessed"

          echo ""
          echo "=================================================="
