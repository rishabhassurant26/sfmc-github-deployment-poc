      # ============================================================
      # 19. BUILD FINAL DYNAMIC DEPLOYMENT-READY DEFINITION
      #
      # No asset-specific ObjectID/CustomerKey/name is hardcoded here.
      # Relationships come only from live SFMC retrieval evidence:
      # Automation -> Program -> Task -> Activity -> QueryDefinition.
      #
      # Schedule recurrence is intentionally not versioned because SFMC
      # did not return a reliable recurrence definition in this POC.
      # Production scheduling/activation remains manual.
      # ============================================================
      - name: Build final dynamic Automation definition
        id: final_definition
        shell: bash
        env:
          LOB: ${{ steps.config.outputs.lob }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
          PROGRAM_OBJECT_ID: ${{ steps.program_discovery.outputs.program_object_id }}
        run: |
          set -euo pipefail

          export LOB SANDBOX_MID PROGRAM_OBJECT_ID

          python3 <<'PY'
          import os
          import json

          def load_json(path):
              if not os.path.exists(path):
                  raise SystemExit(f"Required retrieval evidence missing: {path}")
              with open(path, encoding="utf-8") as f:
                  return json.load(f)

          automation = load_json("automation-metadata.json")
          program = load_json("program-discovery.json")
          task_discovery = load_json("task-discovery.json")
          activity_discovery = load_json("activity-discovery.json")
          query_relationship = load_json("query-relationship.json")

          starting_source = {}
          if os.path.exists("starting-source-discovery.json"):
              starting_source = load_json("starting-source-discovery.json")

          program_object_id = (os.environ.get("PROGRAM_OBJECT_ID", "") or "").strip()
          if not program_object_id:
              raise SystemExit("Dynamic Program ObjectID was not resolved.")

          if program.get("status") != "PROGRAM_RESOLVED":
              raise SystemExit("Program relationship is not resolved.")

          tasks = task_discovery.get("tasks") or []
          activities = activity_discovery.get("activities") or []
          relationships = query_relationship.get("relationships") or []

          if not tasks:
              raise SystemExit("No dynamically retrieved Tasks are available.")
          if not activities:
              raise SystemExit("No dynamically retrieved Activities are available.")
          if not relationships:
              raise SystemExit(
                  "No exact Activity -> QueryDefinition relationship is available."
              )

          # Index exact retrieved relationships only.
          rel_by_activity = {}
          for rel in relationships:
              activity_oid = (
                  rel.get("activity", {}).get("objectId", "")
                  or rel.get("activityObjectId", "")
                  or ""
              ).strip()

              if not activity_oid:
                  # Current proven evidence stores activity identity at top level.
                  activity_oid = (
                      rel.get("activityObjectId", "")
                      or ""
                  ).strip()

              if not activity_oid:
                  # Defensive support for the proven current JSON shape.
                  definition_oid = (
                      rel.get("match", {}).get(
                          "activityDefinitionObjectId", ""
                      )
                      or ""
                  ).strip()
                  for a in activities:
                      if (
                          (a.get("Definition", {}).get("ObjectID", "") or "").strip()
                          == definition_oid
                      ):
                          activity_oid = (
                              a.get("ObjectID", "") or ""
                          ).strip()
                          break

              if activity_oid:
                  rel_by_activity[activity_oid] = rel

          def seq_value(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return 0

          normalized_tasks = []

          for task in sorted(tasks, key=lambda x: seq_value(x.get("Sequence"))):
              task_oid = (task.get("ObjectID", "") or "").strip()
              returned_program_oid = (
                  task.get("Program", {}).get("ObjectID", "")
                  or ""
              ).strip()

              if returned_program_oid != program_object_id:
                  raise SystemExit(
                      "Task Program.ObjectID does not match dynamically resolved Program."
                  )

              task_activities = []

              for activity in activities:
                  returned_task_oid = (
                      activity.get("Task", {}).get("ObjectID", "")
                      or ""
                  ).strip()

                  if returned_task_oid != task_oid:
                      continue

                  activity_oid = (activity.get("ObjectID", "") or "").strip()
                  rel = rel_by_activity.get(activity_oid)

                  if not rel:
                      raise SystemExit(
                          "An Activity has no exact QueryDefinition relationship: "
                          + activity_oid
                      )

                  query = rel.get("queryDefinition") or {}
                  definition_oid = (
                      activity.get("Definition", {}).get("ObjectID", "")
                      or ""
                  ).strip()
                  query_oid = (query.get("objectId", "") or "").strip()

                  if not definition_oid or definition_oid != query_oid:
                      raise SystemExit(
                          "Activity Definition.ObjectID does not exactly match "
                          "QueryDefinition ObjectID."
                      )

                  target_de = query.get("targetDataExtension") or {}
                  target_de_key = (
                      target_de.get("customerKey", "") or ""
                  ).strip()

                  if not target_de_key:
                      raise SystemExit(
                          "QueryDefinition target Data Extension CustomerKey "
                          "was not returned by SFMC; deployment definition "
                          "will not guess the target."
                      )

                  task_activities.append({
                      "sequence": seq_value(activity.get("Sequence")),
                      "name": activity.get("Name", ""),
                      "customerKey": activity.get("CustomerKey", ""),
                      "activityTypeId": activity.get(
                          "PartnerAPIObjectTypeID", ""
                      ),
                      "definition": {
                          "type": "QueryDefinition",
                          "name": query.get("name", ""),
                          "customerKey": query.get("customerKey", ""),
                          "description": query.get("description", ""),
                          "queryText": query.get("queryText", ""),
                          "targetType": query.get("targetType", ""),
                          "targetDataExtension": {
                              "name": target_de.get("name", ""),
                              "customerKey": target_de_key,
                              "description": target_de.get(
                                  "description", ""
                              )
                          },
                          "targetUpdateType": query.get("targetUpdateType", "")
                      }
                  })

              task_activities.sort(key=lambda x: x["sequence"])

              if not task_activities:
                  raise SystemExit(
                      "A retrieved Task has no dynamically linked Activities: "
                      + task_oid
                  )

              normalized_tasks.append({
                  "sequence": seq_value(task.get("Sequence")),
                  "name": task.get("Name", ""),
                  "description": task.get("Description", ""),
                  "activities": task_activities
              })

          # Retrieve AutomationType from the already-proven discovery artifact.
          automation_type = ""
          automation_source = {
              "automationSourceId": "",
              "automationSourceType": ""
          }

          auto_parent = (
              starting_source.get("parents", {}).get("Automation", {})
          )

          for prop in auto_parent.get("properties", []) or []:
              if prop.get("property") == "AutomationType":
                  automation_type = prop.get("value") or ""
              elif prop.get("property") == "AutomationSource.AutomationSourceID":
                  automation_source["automationSourceId"] = prop.get("value") or ""
              elif prop.get("property") == "AutomationSource.AutomationSourceType":
                  automation_source["automationSourceType"] = prop.get("value") or ""

          definition = {
              "schemaVersion": "2.0",
              "assetType": "automation",
              "environment": "sandbox",
              "businessUnitMid": os.environ["SANDBOX_MID"],
              "lineOfBusiness": os.environ["LOB"],

              "automation": {
                  "name": automation.get("Name", ""),
                  "customerKey": automation.get("CustomerKey", ""),
                  "description": automation.get("Description", ""),
                  "automationType": automation_type,
                  "source": automation_source
              },

              "program": {
                  # ObjectID is retrieval evidence only. Production deployment
                  # must resolve/create its own Production ObjectID dynamically.
                  "sourceObjectId": program_object_id
              },

              "tasks": normalized_tasks,

              "schedule": {
                  "deploymentMode": "manual",
                  "activateAfterDeployment": False,
                  "reason": (
                      "Automation structure is version-controlled and deployed "
                      "by CI/CD; Production schedule/activation is configured "
                      "manually after deployment."
                  )
              },

              "deploymentPolicy": {
                  "deployStructure": True,
                  "deploySchedule": False,
                  "activateAutomation": False,
                  "runAutomation": False
              }
          }

          if not definition["automation"]["name"]:
              raise SystemExit("Automation Name is missing.")
          if not definition["automation"]["customerKey"]:
              raise SystemExit("Automation CustomerKey is missing.")

          with open(
              "retrieved-definition.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(definition, f, indent=2, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"task_count={len(normalized_tasks)}\n")
              f.write(
                  "activity_count="
                  + str(sum(len(t["activities"]) for t in normalized_tasks))
                  + "\n"
              )

          print("")
          print("============================================")
          print("FINAL DYNAMIC AUTOMATION DEFINITION")
          print("============================================")
          print("Automation:", definition["automation"]["name"])
          print("CustomerKey:", definition["automation"]["customerKey"])
          print("AutomationType:", automation_type or "[not returned]")
          print("Program ObjectID resolved dynamically:", program_object_id)
          print("Tasks:", len(normalized_tasks))
          print(
              "Activities:",
              sum(len(t["activities"]) for t in normalized_tasks)
          )
          print("Schedule deployment: MANUAL")
          print("Auto activate/run: NO")
          print("")
          print("RESULT: DEPLOYMENT-READY DYNAMIC DEFINITION BUILT")
          print("============================================")
          PY


      # 20. SAVE RESULT
      # ============================================================
      - name: Save retrieved Automation definition
        id: save
        shell: bash
        env:
          ASSET_ROOT: ${{ steps.config.outputs.asset_root }}
          LOB: ${{ steps.config.outputs.lob }}
          AUTOMATIONS_DIR: ${{ steps.config.outputs.automations_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          SAFE_NAME=$(printf '%s' "$AUTOMATION_NAME" \
            | sed 's/[^A-Za-z0-9._-]/_/g')

          OUTPUT_DIR="${ASSET_ROOT}/${LOB}/${AUTOMATIONS_DIR}/${SAFE_NAME}"

          mkdir -p "$OUTPUT_DIR"

          cp retrieved-definition.json \
            "$OUTPUT_DIR/definition.json"

          cp automation-metadata.json \
            "$OUTPUT_DIR/automation-metadata.json"

          cp query-definitions.json \
            "$OUTPUT_DIR/query-definitions.json"

          if [ -f automation-objectid-proof.json ]; then
            cp automation-objectid-proof.json \
              "$OUTPUT_DIR/automation-objectid-proof.json"
          fi

          if [ -f program-discovery.json ]; then
            cp program-discovery.json \
              "$OUTPUT_DIR/program-discovery.json"
          fi

          if [ -f program-retrieve-response.xml ]; then
            cp program-retrieve-response.xml \
              "$OUTPUT_DIR/program-retrieve-response.xml"
          fi

          if [ -f task-describe.json ]; then
            cp task-describe.json \
              "$OUTPUT_DIR/task-describe.json"
          fi

          if [ -f task-describe-response.xml ]; then
            cp task-describe-response.xml \
              "$OUTPUT_DIR/task-describe-response.xml"
          fi

          if [ -f task-discovery.json ]; then
            cp task-discovery.json \
              "$OUTPUT_DIR/task-discovery.json"
          fi

          if [ -f task-retrieve-response.xml ]; then
            cp task-retrieve-response.xml \
              "$OUTPUT_DIR/task-retrieve-response.xml"
          fi

          if [ -f activity-describe.json ]; then
            cp activity-describe.json \
              "$OUTPUT_DIR/activity-describe.json"
          fi

          if [ -f activity-describe-response.xml ]; then
            cp activity-describe-response.xml \
              "$OUTPUT_DIR/activity-describe-response.xml"
          fi

          if [ -f activity-discovery.json ]; then
            cp activity-discovery.json \
              "$OUTPUT_DIR/activity-discovery.json"
          fi

          for RESPONSE_FILE in activity-retrieve-response-*.xml; do
            if [ -f "$RESPONSE_FILE" ]; then
              cp "$RESPONSE_FILE" \
                "$OUTPUT_DIR/$RESPONSE_FILE"
            fi
          done

          if [ -f query-relationship.json ]; then
            cp query-relationship.json \
              "$OUTPUT_DIR/query-relationship.json"
          fi

          if [ -f schedule-parent-describe.json ]; then
            cp schedule-parent-describe.json \
              "$OUTPUT_DIR/schedule-parent-describe.json"
          fi

          for RESPONSE_FILE in automation-describe-response.xml program-describe-response.xml; do
            if [ -f "$RESPONSE_FILE" ]; then
              cp "$RESPONSE_FILE" \
                "$OUTPUT_DIR/$RESPONSE_FILE"
            fi
          done

          if [ -f schedule-id-discovery.json ]; then
            cp schedule-id-discovery.json \
              "$OUTPUT_DIR/schedule-id-discovery.json"
          fi

          if [ -f program-schedule-id-response.xml ]; then
            cp program-schedule-id-response.xml \
              "$OUTPUT_DIR/program-schedule-id-response.xml"
          fi

          if [ -f nested-schedule-discovery.json ]; then
            cp nested-schedule-discovery.json \
              "$OUTPUT_DIR/nested-schedule-discovery.json"
          fi

          for RESPONSE_FILE in nested-schedule-*.xml; do
            if [ -f "$RESPONSE_FILE" ]; then
              cp "$RESPONSE_FILE" \
                "$OUTPUT_DIR/$RESPONSE_FILE"
            fi
          done

          if [ -f starting-source-discovery.json ]; then
            cp starting-source-discovery.json \
              "$OUTPUT_DIR/starting-source-discovery.json"
          fi

          for RESPONSE_FILE in starting-source-*.xml; do
            if [ -f "$RESPONSE_FILE" ]; then
              cp "$RESPONSE_FILE" \
                "$OUTPUT_DIR/$RESPONSE_FILE"
            fi
          done

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          echo "Saved to:"
          echo "$OUTPUT_DIR"


      # ============================================================
      # 21. DISPLAY RESULT
      # ============================================================
      - name: Display retrieved definition
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
        run: |
          set -euo pipefail

          echo ""
          echo "============================================"
          echo "RETRIEVED DEFINITION"
          echo "============================================"

          jq . "$OUTPUT_DIR/definition.json"

          if [ -f "$OUTPUT_DIR/automation-objectid-proof.json" ]; then

            echo ""
            echo "============================================"
            echo "AUTOMATION OBJECTID PROBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/automation-objectid-proof.json"
          fi

          if [ -f "$OUTPUT_DIR/program-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "PROGRAM DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/program-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/task-describe.json" ]; then

            echo ""
            echo "============================================"
            echo "TASK OBJECT DESCRIBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/task-describe.json"
          fi

          if [ -f "$OUTPUT_DIR/task-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "PROGRAM -> TASK DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/task-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/activity-describe.json" ]; then

            echo ""
            echo "============================================"
            echo "ACTIVITY OBJECT DESCRIBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/activity-describe.json"
          fi

          if [ -f "$OUTPUT_DIR/activity-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "TASK -> ACTIVITY DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/activity-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/query-relationship.json" ]; then

            echo ""
            echo "============================================"
            echo "ACTIVITY -> QUERYDEFINITION RELATIONSHIP"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/query-relationship.json"
          fi

          if [ -f "$OUTPUT_DIR/schedule-parent-describe.json" ]; then

            echo ""
            echo "============================================"
            echo "AUTOMATION + PROGRAM DESCRIBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/schedule-parent-describe.json"
          fi

          if [ -f "$OUTPUT_DIR/schedule-id-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "PROGRAM -> SCHEDULE.ID DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/schedule-id-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/nested-schedule-discovery.json" ]; then
            echo ""
            echo "============================================"
            echo "NESTED SCHEDULE PROPERTY DISCOVERY"
            echo "============================================"
            jq . \
              "$OUTPUT_DIR/nested-schedule-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/starting-source-discovery.json" ]; then
            echo ""
            echo "============================================"
            echo "AUTOMATION STARTING-SOURCE DISCOVERY"
            echo "============================================"
            jq . \
              "$OUTPUT_DIR/starting-source-discovery.json"
          fi


      # ============================================================
      # 22. COMMIT
      # ============================================================
      - name: Commit retrieved Automation
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No Automation changes detected."
            exit 0
          fi

          git commit \
            -m "Retrieve SFMC Automation: ${AUTOMATION_NAME}"

          git push origin HEAD:sandbox

          echo "Automation retrieval committed."


      # ============================================================
      # 23. FINAL RESULT
      # ============================================================
      - name: Retrieval complete
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
          CUSTOMER_KEY: ${{ steps.automation.outputs.customer_key }}
          OBJECT_ID: ${{ steps.automation.outputs.object_id }}

          QUERY_COUNT: ${{ steps.queries.outputs.query_count }}

          OBJECTID_PROOF: ${{ steps.objectid_proof.outputs.identity_proven }}
          KNOWN_OBJECT_ID: ${{ steps.objectid_proof.outputs.known_object_id }}
          OBJECTID_OUTCOME: ${{ steps.objectid_proof.outcome }}

          PROGRAM_OUTCOME: ${{ steps.program_discovery.outcome }}
          PROGRAM_STATUS: ${{ steps.program_discovery.outputs.discovery_status }}
          PROGRAM_COUNT: ${{ steps.program_discovery.outputs.program_count }}
          PROGRAM_OBJECT_ID: ${{ steps.program_discovery.outputs.program_object_id }}

        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "SFMC AUTOMATION RETRIEVAL CHECKPOINT"
          echo "=================================================="

          echo ""
          echo "Automation:"
          echo "$AUTOMATION_NAME"

          echo ""
          echo "CustomerKey:"
          echo "$CUSTOMER_KEY"

          echo ""
          echo "ObjectID returned by Automation Retrieve:"
          echo "${OBJECT_ID:-[not returned]}"

          echo ""
          echo "Preserved Automation NewObjectID:"
          echo "${KNOWN_OBJECT_ID:-[not available]}"

          echo ""
          echo "Preserved NewObjectID probe outcome:"
          echo "${OBJECTID_OUTCOME:-[not available]}"

          echo ""
          echo "Preserved NewObjectID identity proof:"
          echo "${OBJECTID_PROOF:-false}"

          echo ""
          echo "QueryDefinitions retrieved:"
          echo "$QUERY_COUNT"

          echo ""
          echo "Program discovery step outcome:"
          echo "${PROGRAM_OUTCOME:-[not available]}"

          echo ""
          echo "Program discovery status:"
          echo "${PROGRAM_STATUS:-[not available]}"

          echo ""
          echo "Programs returned:"
          echo "${PROGRAM_COUNT:-0}"

          echo ""
          echo "Program ObjectID:"
          echo "${PROGRAM_OBJECT_ID:-[not returned]}"

          echo ""
          echo "Task Describe status:"
          echo "${TASK_DESCRIBE_STATUS:-[not available]}"

          echo ""
          echo "Task retrievable properties:"
          echo "${TASK_PROPERTY_COUNT:-0}"

          echo ""
          echo "Task Retrieve step outcome:"
          echo "${TASK_RETRIEVE_OUTCOME:-[not available]}"

          echo ""
          echo "Program -> Task discovery status:"
          echo "${TASK_DISCOVERY_STATUS:-[not available]}"

          echo ""
          echo "Tasks returned:"
          echo "${TASK_COUNT:-0}"

          echo ""
          echo "Activity Describe status:"
          echo "${ACTIVITY_DESCRIBE_STATUS:-[not available]}"

          echo ""
          echo "Activity retrievable properties:"
          echo "${ACTIVITY_PROPERTY_COUNT:-0}"

          echo ""
          echo "Activity Retrieve step outcome:"
          echo "${ACTIVITY_RETRIEVE_OUTCOME:-[not available]}"

          echo ""
          echo "Task -> Activity discovery status:"
          echo "${ACTIVITY_DISCOVERY_STATUS:-[not available]}"

          echo ""
          echo "Activities returned:"
          echo "${ACTIVITY_COUNT:-0}"

          echo ""
          echo "Activity -> QueryDefinition step outcome:"
          echo "${QUERY_RELATIONSHIP_OUTCOME:-[not available]}"

          echo ""
          echo "Activity -> QueryDefinition status:"
          echo "${QUERY_RELATIONSHIP_STATUS:-[not available]}"

          echo ""
          echo "Query relationships resolved:"
          echo "${QUERY_RELATIONSHIP_COUNT:-0}"

          echo ""
          echo "Automation + Program Describe status:"
          echo "${SCHEDULE_PARENT_DESCRIBE_STATUS:-[not available]}"

          echo ""
          echo "Schedule/source/time-related properties discovered:"
          echo "${SCHEDULE_RELEVANT_PROPERTY_COUNT:-0}"

          echo ""
          echo "Program -> Schedule.ID status:"
          echo "${SCHEDULE_ID_STATUS:-[not available]}"

          echo ""
          echo "Resolved Schedule.ID:"
          echo "${RESOLVED_SCHEDULE_ID:-[not available]}"

          echo ""
          echo "Nested Schedule discovery status:"
          echo "${NESTED_SCHEDULE_STATUS:-[not available]}"

          echo ""
          echo "Nested Schedule supported property checks:"
          echo "${NESTED_SCHEDULE_SUPPORTED_CHECKS:-0}"

          echo ""
          echo "Nested Schedule checks returning values:"
          echo "${NESTED_SCHEDULE_RETURNED_VALUES:-0}"

          echo ""
          echo "Starting-source discovery status:"
          echo "${STARTING_SOURCE_STATUS:-[not available]}"

          echo ""
          echo "Starting-source supported property checks:"
          echo "${STARTING_SOURCE_SUPPORTED_CHECKS:-0}"

          echo ""
          echo "Starting-source checks returning values:"
          echo "${STARTING_SOURCE_RETURNED_VALUES:-0}"

          echo ""
          echo "IMPORTANT:"
          echo "Program identity and Task/Activity relationship proof are separate."
          echo "No Program -> Task -> Activity -> Query relationship has been guessed."

          echo ""
          echo "=================================================="
