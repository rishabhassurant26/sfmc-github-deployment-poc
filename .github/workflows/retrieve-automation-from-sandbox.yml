              "soapStatus": overall,
              "requestId": request_id,
              "objectType": "Task",
              "propertyCount": len(properties),
              "retrievablePropertyCount": len(retrievable),
              "retrievableProperties": retrievable
          }

          with open(
              "task-describe.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # Some successful SFMC Describe responses can return
          # retrievable properties while OverallStatus is blank.
          # Treat actual returned retrievable properties as the
          # discovery evidence; fail only when none are returned.
          if not retrievable:
              raise SystemExit(
                  "Task Describe returned no retrievable properties."
