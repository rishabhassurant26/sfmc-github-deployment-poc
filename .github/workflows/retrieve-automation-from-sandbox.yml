                      <et:Filter xsi:type="et:SimpleFilterPart">
                        <et:Property>{filter_property}</et:Property>
                        <et:SimpleOperator>equals</et:SimpleOperator>
                        <et:Value>{escape(filter_value)}</et:Value>
                      </et:Filter>
                    </et:RetrieveRequest>
                  </et:RetrieveRequestMsg>
