              )

          if (
              returned_name
              and returned_name != automation_name
          ):

              raise SystemExit(
                  "Program resolved to a different "
                  "Automation name."
              )

          result = {
              "status":
                  "PROGRAM_RESOLVED",

              "soapStatus":
                  overall,

              "automation": {
                  "name":
                      automation_name,

                  "customerKey":
                      customer_key
              },

              "program":
                  program,

              "relationshipStatus":
                  "PROGRAM_IDENTITY_ONLY",

              "relationshipReason":
