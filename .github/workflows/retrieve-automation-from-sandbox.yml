          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>
              <et:DefinitionRequestMsg>
                <et:DescribeRequests>
                  <et:ObjectDefinitionRequest>
                    <et:ObjectType>Task</et:ObjectType>
                  </et:ObjectDefinitionRequest>
                </et:DescribeRequests>
              </et:DefinitionRequestMsg>
            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=UTF-8",
                  "SOAPAction": "Describe"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  xml_data = response.read()

          except urllib.error.HTTPError as exc:
              response_text = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )
              print(response_text)
              raise SystemExit(
                  f"Task Describe HTTP {exc.code}"
              )

          with open(
              "task-describe-response.xml",
              "wb"
          ) as f:
              f.write(xml_data)

          root = ET.fromstring(xml_data)

          overall = ""
          request_id = ""
          properties = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":
                  overall = (
                      element.text or ""
                  ).strip()

              elif local == "RequestID":
                  request_id = (
                      element.text or ""
                  ).strip()

              elif local == "Properties":

                  prop = {}

                  for child in list(element):
                      key = child.tag.split("}")[-1]
                      prop[key] = (
                          child.text or ""
                      ).strip()

                  if prop.get("Name"):
                      properties.append(prop)

          retrievable = [
              prop
              for prop in properties
              if prop.get(
                  "IsRetrievable",
                  ""
              ).lower() == "true"
          ]

          print("")
          print("============================================")
          print("TASK OBJECT DESCRIBE")
          print("============================================")
