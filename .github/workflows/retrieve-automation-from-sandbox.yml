          SCHEDULE_RELEVANT_PROPERTY_COUNT: ${{ steps.schedule_parent_describe.outputs.schedule_relevant_count }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN
          export SOAP_URL
          export PROGRAM_OBJECT_ID

          python3 <<'PY'
          import os
          import json
          import html
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          program_object_id = os.environ.get(
              "PROGRAM_OBJECT_ID",
              ""
          ).strip()

          if not program_object_id:
              raise SystemExit(
                  "Program ObjectID is unavailable; Task retrieval "
                  "will not guess a Program relationship."
              )

          def esc(value):
              return html.escape(value or "", quote=True)

          properties = [
              "ObjectID",
              "Program.ObjectID",
              "Name",
              "Description",
              "Sequence"
          ]

          props = "\n".join(
              f"<et:Properties>{p}</et:Properties>"
              for p in properties
          )

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>
              <et:RetrieveRequestMsg>
                <et:RetrieveRequest>

                  <et:ObjectType>Task</et:ObjectType>

                  {props}

                  <et:Filter xsi:type="et:SimpleFilterPart">
                    <et:Property>Program.ObjectID</et:Property>
                    <et:SimpleOperator>equals</et:SimpleOperator>
                    <et:Value>{esc(program_object_id)}</et:Value>
                  </et:Filter>

                </et:RetrieveRequest>
              </et:RetrieveRequestMsg>
            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=UTF-8",
                  "SOAPAction": "Retrieve"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  xml_data = response.read()

          except urllib.error.HTTPError as exc:
              response_text = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )
              print(response_text)
              raise SystemExit(
                  f"Task Retrieve HTTP {exc.code}"
              )

          with open(
              "task-retrieve-response.xml",
              "wb"
          ) as f:
              f.write(xml_data)

          root = ET.fromstring(xml_data)

          overall = ""
          request_id = ""
          tasks = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":
                  overall = (
                      element.text or ""
                  ).strip()

              elif local == "RequestID":
                  request_id = (
                      element.text or ""
                  ).strip()

              elif local == "Results":

                  current = {}

                  for child in list(element):

                      key = child.tag.split("}")[-1]

                      if key == "Program":
                          program = {}
                          for sub in list(child):
                              subkey = sub.tag.split("}")[-1]
                              program[subkey] = (
                                  sub.text or ""
                              ).strip()
                          current["Program"] = program

                      elif len(list(child)) == 0:
                          current[key] = (
                              child.text or ""
                          ).strip()

                  if current:
                      tasks.append(current)

          print("")
          print("============================================")
          print("PROGRAM -> TASK RETRIEVE")
          print("============================================")
          print("SOAP Status:", overall)
          print("Program ObjectID:", program_object_id)
          print("Tasks returned:", len(tasks))
          print("")

          for task in tasks:
              returned_program_id = (
                  task.get("Program", {})
                  .get("ObjectID", "")
              )

              print(
                  "Task ObjectID:",
                  task.get("ObjectID", "")
              )
              print(
                  "Name:",
                  task.get("Name", "")
              )
              print(
                  "Sequence:",
                  task.get("Sequence", "")
              )
              print(
                  "Program.ObjectID:",
                  returned_program_id
              )
              print("--------------------------------------------")

          result = {
              "status": "",
              "soapStatus": overall,
              "requestId": request_id,
              "programObjectId": program_object_id,
              "tasksReturned": len(tasks),
              "tasks": tasks
          }

          if overall not in (
              "OK",
              "MoreDataAvailable"
          ):
              result["status"] = "SOAP_ERROR"

              with open(
                  "task-discovery.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:
                  f.write("discovery_status=SOAP_ERROR\n")
                  f.write("task_count=0\n")

              raise SystemExit(
                  "Task Retrieve returned status: "
                  + overall
              )

          if not tasks:
              result["status"] = "NO_TASKS_RETURNED"

              with open(
                  "task-discovery.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:
                  f.write(
                      "discovery_status=NO_TASKS_RETURNED\n"
                  )
                  f.write("task_count=0\n")

              print(
                  "SFMC accepted Task Retrieve but returned "
                  "no Tasks for this Program ObjectID."
              )
              raise SystemExit(1)

          mismatched = []

          for task in tasks:
              returned_program_id = (
                  task.get("Program", {})
                  .get("ObjectID", "")
              )

              if returned_program_id != program_object_id:
                  mismatched.append(task)

          if mismatched:
              result["status"] = "PROGRAM_CROSSCHECK_FAILED"

              with open(
                  "task-discovery.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              raise SystemExit(
                  "One or more returned Tasks did not contain "
                  "the expected Program.ObjectID."
              )

          result["status"] = "TASKS_RESOLVED"

          with open(
              "task-discovery.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write("discovery_status=TASKS_RESOLVED\n")
              f.write(
                  "task_count="
                  + str(len(tasks))
                  + "\n"
              )

          print("")
          print("RESULT: PROGRAM -> TASK RELATIONSHIP RESOLVED")
          print("============================================")
          PY


