                  task.get("ObjectID", "")
                  or ""
              ).strip()

              if object_id:
                  task_object_ids.append(object_id)

          if not task_object_ids:
              raise SystemExit(
                  "No resolved Task ObjectIDs were returned by SFMC."
              )

          def esc(value):
              return html.escape(value or "", quote=True)

          # Only properties returned as retrievable by the live
          # Activity Describe run are requested here.
          properties = [
              "ObjectID",
              "Program.ObjectID",
              "Task.ObjectID",
              "Sequence",
              "Name",
              "Description",
              "Definition.ID",
              "Definition.ObjectID",
              "PartnerAPIObjectTypeID",
              "CustomerKey",
              "IsActive"
          ]

          props = "\n".join(
              f"<et:Properties>{p}</et:Properties>"
              for p in properties
          )

          all_activities = []
          raw_responses = []
          soap_statuses = []

          for index, task_object_id in enumerate(
              task_object_ids,
              start=1
          ):

              body = f"""<?xml version="1.0" encoding="UTF-8"?>
              <soapenv:Envelope
                xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

                <soapenv:Header>
                  <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
                </soapenv:Header>

                <soapenv:Body>
                  <et:RetrieveRequestMsg>
                    <et:RetrieveRequest>

                      <et:ObjectType>Activity</et:ObjectType>

                      {props}

                      <et:Filter xsi:type="et:SimpleFilterPart">
                        <et:Property>Task.ObjectID</et:Property>
                        <et:SimpleOperator>equals</et:SimpleOperator>
                        <et:Value>{esc(task_object_id)}</et:Value>
                      </et:Filter>

                    </et:RetrieveRequest>
                  </et:RetrieveRequestMsg>
                </soapenv:Body>

              </soapenv:Envelope>
              """

              request = urllib.request.Request(
                  soap_url + "/Service.asmx",
                  data=body.encode("utf-8"),
                  headers={
                      "Content-Type": "text/xml; charset=UTF-8",
                      "SOAPAction": "Retrieve"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      xml_data = response.read()

              except urllib.error.HTTPError as exc:
                  response_text = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )
                  print(response_text)
                  raise SystemExit(
                      f"Activity Retrieve HTTP {exc.code} "
                      f"for Task {task_object_id}"
                  )

              response_file = (
                  f"activity-retrieve-response-{index}.xml"
              )

              with open(
                  response_file,
                  "wb"
              ) as f:
                  f.write(xml_data)

              raw_responses.append(response_file)

              root = ET.fromstring(xml_data)

              overall = ""
              request_id = ""
              activities = []

              for element in root.iter():

                  local = element.tag.split("}")[-1]

                  if local == "OverallStatus":
                      overall = (
                          element.text or ""
                      ).strip()

                  elif local == "RequestID":
                      request_id = (
                          element.text or ""
                      ).strip()

                  elif local == "Results":

                      current = {}

                      for child in list(element):

                          key = child.tag.split("}")[-1]

                          if key in (
                              "Program",
                              "Task",
                              "Definition"
                          ):
                              nested = {}

                              for sub in list(child):
                                  subkey = sub.tag.split("}")[-1]
                                  nested[subkey] = (
                                      sub.text or ""
                                  ).strip()

                              current[key] = nested

                          elif len(list(child)) == 0:
                              current[key] = (
                                  child.text or ""
                              ).strip()

                      if current:
                          activities.append(current)

              soap_statuses.append({
                  "taskObjectId": task_object_id,
                  "soapStatus": overall,
                  "requestId": request_id,
                  "activitiesReturned": len(activities)
              })

              print("")
              print("============================================")
              print("TASK -> ACTIVITY RETRIEVE")
              print("============================================")
              print("SOAP Status:", overall)
              print("Task ObjectID:", task_object_id)
              print("Activities returned:", len(activities))
              print("")

              if overall not in (
                  "OK",
                  "MoreDataAvailable"
              ):
                  result = {
                      "status": "SOAP_ERROR",
                      "tasksChecked": len(task_object_ids),
                      "soapResults": soap_statuses,
                      "activities": all_activities
                  }

                  with open(
                      "activity-discovery.json",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      json.dump(
                          result,
                          f,
                          indent=2,
                          ensure_ascii=False
                      )

                  with open(
                      os.environ["GITHUB_OUTPUT"],
                      "a"
                  ) as f:
                      f.write("discovery_status=SOAP_ERROR\n")
                      f.write("activity_count=0\n")

                  raise SystemExit(
                      "Activity Retrieve returned status: "
                      + overall
                  )

              for activity in activities:

                  returned_task_id = (
                      activity.get("Task", {})
                      .get("ObjectID", "")
                  )

                  print(
                      "Activity ObjectID:",
                      activity.get("ObjectID", "")
                  )
                  print(
                      "Name:",
                      activity.get("Name", "")
                  )
                  print(
                      "Sequence:",
                      activity.get("Sequence", "")
                  )
                  print(
                      "Task.ObjectID:",
                      returned_task_id
                  )
                  print(
                      "Definition.ObjectID:",
                      activity.get(
                          "Definition",
                          {}
                      ).get(
                          "ObjectID",
                          ""
                      )
                  )
                  print(
                      "CustomerKey:",
                      activity.get("CustomerKey", "")
                  )
                  print("--------------------------------------------")

                  if returned_task_id != task_object_id:
                      result = {
                          "status": "TASK_CROSSCHECK_FAILED",
                          "tasksChecked": len(task_object_ids),
                          "soapResults": soap_statuses,
                          "activities": (
                              all_activities
                              + activities
                          )
                      }

                      with open(
                          "activity-discovery.json",
                          "w",
                          encoding="utf-8"
                      ) as f:
                          json.dump(
                              result,
                              f,
                              indent=2,
                              ensure_ascii=False
                          )

                      raise SystemExit(
                          "Returned Activity Task.ObjectID does not "
                          "match the resolved source Task ObjectID."
                      )

                  activity["_sourceTaskObjectId"] = task_object_id
                  all_activities.append(activity)

          result = {
              "status": "",
              "tasksChecked": len(task_object_ids),
              "taskObjectIds": task_object_ids,
              "soapResults": soap_statuses,
              "activitiesReturned": len(all_activities),
              "activities": all_activities,
              "rawResponseFiles": raw_responses
          }

          if not all_activities:
              result["status"] = "NO_ACTIVITIES_RETURNED"

              with open(
                  "activity-discovery.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:
                  f.write(
                      "discovery_status=NO_ACTIVITIES_RETURNED\n"
                  )
                  f.write("activity_count=0\n")

              print(
                  "SFMC accepted Activity Retrieve but returned "
                  "no Activities for the resolved Task ObjectID(s)."
              )
              raise SystemExit(1)

          result["status"] = "ACTIVITIES_RESOLVED"

          with open(
              "activity-discovery.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  "discovery_status=ACTIVITIES_RESOLVED\n"
              )
              f.write(
                  "activity_count="
                  + str(len(all_activities))
                  + "\n"
              )

          print("")
          print("RESULT: TASK -> ACTIVITY RELATIONSHIP RESOLVED")
          print("============================================")
          PY


      # ============================================================
      # ============================================================
      # 14. RESOLVE ACTIVITY -> QUERYDEFINITION RELATIONSHIP
      #
      # Exact join only:
      # Activity.Definition.ObjectID == QueryDefinition.ObjectID
      # No name/CustomerKey/naming-convention guessing.
      # ============================================================
      - name: Resolve Activities to QueryDefinitions
        id: query_relationship
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json

          if not os.path.exists("activity-discovery.json"):
              raise SystemExit(
                  "activity-discovery.json is unavailable; "
                  "Query relationship will not be guessed."
              )

          if not os.path.exists("query-definitions.json"):
              raise SystemExit(
                  "query-definitions.json is unavailable."
              )

          with open("activity-discovery.json", encoding="utf-8") as f:
              activity_discovery = json.load(f)

          with open("query-definitions.json", encoding="utf-8") as f:
              queries = json.load(f)

          if activity_discovery.get("status") != "ACTIVITIES_RESOLVED":
              raise SystemExit(
                  "Task -> Activity relationship is not resolved."
              )

          activities = activity_discovery.get("activities") or []

          query_by_object_id = {}
          duplicate_ids = []

          for query in queries:
              oid = (query.get("ObjectID", "") or "").strip()
              if not oid:
                  continue
              if oid in query_by_object_id:
                  duplicate_ids.append(oid)
              query_by_object_id[oid] = query

          result = {
              "status": "",
              "activitiesChecked": len(activities),
              "queryDefinitionsAvailable": len(queries),
              "relationshipsResolved": 0,
              "relationships": [],
              "unresolvedActivities": [],
              "duplicateQueryObjectIds": sorted(set(duplicate_ids))
          }

          if duplicate_ids:
              result["status"] = "DUPLICATE_QUERY_OBJECTIDS"
              with open("query-relationship.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, indent=2, ensure_ascii=False)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("relationship_status=DUPLICATE_QUERY_OBJECTIDS\n")
                  f.write("relationship_count=0\n")
              raise SystemExit(
                  "Duplicate QueryDefinition ObjectIDs found."
              )

          print("")
          print("============================================")
          print("ACTIVITY -> QUERYDEFINITION RESOLUTION")
          print("============================================")
          print("Activities checked:", len(activities))
          print("QueryDefinitions available:", len(queries))
          print("")

          for activity in activities:
              activity_oid = (activity.get("ObjectID", "") or "").strip()
              activity_name = activity.get("Name", "") or ""
              definition_oid = (
                  activity.get("Definition", {}).get("ObjectID", "") or ""
              ).strip()

              print("Activity ObjectID:", activity_oid)
              print("Activity Name:", activity_name)
              print(
                  "Definition.ObjectID:",
                  definition_oid or "[not returned]"
              )

              if not definition_oid:
                  result["unresolvedActivities"].append({
                      "activityObjectId": activity_oid,
                      "activityName": activity_name,
                      "reason": "Activity Definition.ObjectID was not returned."
                  })
                  print("Relationship: UNRESOLVED")
                  print("--------------------------------------------")
                  continue

              query = query_by_object_id.get(definition_oid)

              if query is None:
                  result["unresolvedActivities"].append({
                      "activityObjectId": activity_oid,
                      "activityName": activity_name,
                      "definitionObjectId": definition_oid,
                      "reason": (
                          "No retrieved QueryDefinition has the same ObjectID."
                      )
                  })
                  print(
                      "Relationship: UNRESOLVED "
                      "(no exact QueryDefinition ObjectID match)"
                  )
                  print("--------------------------------------------")
                  continue

              relationship = {
                  "activity": {
                      "objectId": activity_oid,
                      "name": activity_name,
                      "customerKey": activity.get("CustomerKey", ""),
                      "sequence": activity.get("Sequence", ""),
                      "taskObjectId": (
                          activity.get("Task", {}).get("ObjectID", "")
                      ),
                      "definitionObjectId": definition_oid
                  },
                  "queryDefinition": {
                      "objectId": query.get("ObjectID", ""),
                      "customerKey": query.get("CustomerKey", ""),
                      "name": query.get("Name", ""),
                      "description": query.get("Description", ""),
                      "queryText": query.get("QueryText", ""),
                      "targetType": query.get("TargetType", ""),
                      "targetUpdateType": query.get("TargetUpdateType", ""),
                      "categoryId": query.get("CategoryID", ""),
                      "status": query.get("Status", "")
                  },
                  "proof": {
                      "matchType": "EXACT_OBJECT_ID",
                      "activityDefinitionObjectId": definition_oid,
                      "queryDefinitionObjectId": query.get("ObjectID", "")
                  }
              }

              result["relationships"].append(relationship)
              result["relationshipsResolved"] += 1

              print("Matched Query ObjectID:", query.get("ObjectID", ""))
              print("Query Name:", query.get("Name", ""))
              print("Query CustomerKey:", query.get("CustomerKey", ""))
              print("Relationship: EXACT_OBJECT_ID MATCH")
              print("--------------------------------------------")

          if result["unresolvedActivities"]:
              result["status"] = "PARTIAL_OR_UNRESOLVED"
              with open("query-relationship.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, indent=2, ensure_ascii=False)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("relationship_status=PARTIAL_OR_UNRESOLVED\n")
                  f.write(
                      "relationship_count="
                      + str(result["relationshipsResolved"])
                      + "\n"
                  )
              raise SystemExit(
                  "One or more Activities could not be resolved "
                  "to QueryDefinition by exact ObjectID."
              )

          if not result["relationships"]:
              result["status"] = "NO_QUERY_RELATIONSHIPS"
              with open("query-relationship.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, indent=2, ensure_ascii=False)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("relationship_status=NO_QUERY_RELATIONSHIPS\n")
                  f.write("relationship_count=0\n")
              raise SystemExit(
                  "No exact Activity -> QueryDefinition relationships resolved."
              )

          result["status"] = "QUERY_RELATIONSHIPS_RESOLVED"

          with open("query-relationship.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("relationship_status=QUERY_RELATIONSHIPS_RESOLVED\n")
              f.write(
                  "relationship_count="
                  + str(result["relationshipsResolved"])
                  + "\n"
              )

          print("")
          print("RESULT: ACTIVITY -> QUERYDEFINITION RELATIONSHIP RESOLVED")
          print("============================================")
          PY


      # ============================================================
      # ============================================================
      # 15. DESCRIBE AUTOMATION + PROGRAM FOR SCHEDULE PROPERTIES
      #
      # Standalone ScheduleDefinition Describe returned 0 properties
      # in the live BU, so that route is intentionally not repeated.
      #
      # Salesforce documents Automation.Schedule as ScheduleDefinition.
      # This step discovers what Automation and Program themselves expose
      # in THIS BU before any nested schedule retrieval is attempted.
      #
      # No schedule relationship is guessed here.
      # ============================================================
      - name: Describe Automation and Program schedule properties
        id: schedule_parent_describe
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN
          export SOAP_URL

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          def local_name(tag):
              return tag.split("}")[-1]

          def describe(object_type):
              body = f"""<?xml version="1.0" encoding="UTF-8"?>
              <soapenv:Envelope
                xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                xmlns:et="http://exacttarget.com/wsdl/partnerAPI">

                <soapenv:Header>
                  <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
                </soapenv:Header>

                <soapenv:Body>
                  <et:DefinitionRequestMsg>
                    <et:DescribeRequests>
                      <et:ObjectDefinitionRequest>
                        <et:ObjectType>{object_type}</et:ObjectType>
                      </et:ObjectDefinitionRequest>
                    </et:DescribeRequests>
                  </et:DefinitionRequestMsg>
                </soapenv:Body>

              </soapenv:Envelope>
              """

              request = urllib.request.Request(
                  soap_url + "/Service.asmx",
                  data=body.encode("utf-8"),
                  headers={
                      "Content-Type": "text/xml; charset=UTF-8",
                      "SOAPAction": "Describe"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      xml_data = response.read()
              except urllib.error.HTTPError as exc:
                  response_text = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )
                  print(response_text)
                  raise SystemExit(
                      f"{object_type} Describe HTTP {exc.code}"
                  )

              with open(
                  f"{object_type.lower()}-describe-response.xml",
                  "wb"
              ) as f:
                  f.write(xml_data)

              root = ET.fromstring(xml_data)

              overall = ""
              request_id = ""
              properties = []

              for element in root.iter():
                  name = local_name(element.tag)

                  if name == "OverallStatus":
                      overall = (element.text or "").strip()

                  elif name == "RequestID":
                      request_id = (element.text or "").strip()

                  elif name == "Properties":
                      prop = {}

                      for child in list(element):
                          prop[local_name(child.tag)] = (
                              child.text or ""
                          ).strip()

                      if prop.get("Name"):
                          properties.append(prop)

              retrievable = [
                  prop
                  for prop in properties
                  if prop.get(
                      "IsRetrievable",
                      ""
                  ).lower() == "true"
              ]

              # Show schedule/source/time-related properties prominently,
              # but preserve the full retrievable list in JSON evidence.
              relevant = []

              for prop in retrievable:
                  prop_name = prop.get("Name", "")
                  lowered = prop_name.lower()

                  if any(
                      token_text in lowered
                      for token_text in (
                          "schedule",
                          "source",
                          "time",
                          "recurrence",
                          "occurrence"
                      )
                  ):
                      relevant.append(prop)

              return {
                  "soapStatus": overall,
                  "requestId": request_id,
                  "objectType": object_type,
                  "propertyCount": len(properties),
                  "retrievablePropertyCount": len(retrievable),
                  "retrievableProperties": retrievable,
                  "scheduleRelevantProperties": relevant
              }

          results = {
              "Automation": describe("Automation"),
              "Program": describe("Program")
          }

          print("")
          print("============================================")
          print("AUTOMATION + PROGRAM DESCRIBE")
          print("============================================")

          total_retrievable = 0
          total_relevant = 0

          for object_type in ("Automation", "Program"):
              result = results[object_type]

              print("")
              print(object_type)
              print("--------------------------------------------")
              print("SOAP Status:", result["soapStatus"])
              print(
                  "Properties returned:",
                  result["propertyCount"]
              )
              print(
                  "Retrievable properties:",
                  result["retrievablePropertyCount"]
              )
              print("")

              total_retrievable += (
                  result["retrievablePropertyCount"]
              )

              relevant = result[
                  "scheduleRelevantProperties"
              ]

              total_relevant += len(relevant)

              if relevant:
                  print(
                      "Schedule/source/time-related "
                      "retrievable properties:"
                  )

                  for prop in relevant:
                      print(
                          prop.get("Name", ""),
                          "| Type:",
                          prop.get("DataType", ""),
                          "| Filterable:",
                          prop.get("IsFilterable", "")
                      )
              else:
                  print(
                      "No schedule/source/time-related "
                      "retrievable properties discovered."
                  )

          print("")
          print("============================================")

          with open(
              "schedule-parent-describe.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          if total_retrievable == 0:
              raise SystemExit(
                  "Automation and Program Describe returned "
                  "no retrievable properties."
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write("describe_status=SUCCESS\n")
              f.write(
                  "schedule_relevant_count="
                  + str(total_relevant)
                  + "\n"
              )

          print("")
          print(
              "RESULT: AUTOMATION + PROGRAM SCHEMA DISCOVERED"
          )
          print(
              "Schedule-relevant properties discovered:",
              total_relevant
          )
          PY


      # 16. BUILD DEFINITION
      #
      # IMPORTANT:
      # Program discovery is recorded as discovery evidence only.
      # It is NOT yet treated as Task/Activity relationship proof.
      # ============================================================
      - name: Build Automation retrieval definition
        shell: bash
        env:
          LOB: ${{ steps.config.outputs.lob }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}

          OBJECTID_STEP_OUTCOME: ${{ steps.objectid_proof.outcome }}
          OBJECTID_IDENTITY_PROVEN: ${{ steps.objectid_proof.outputs.identity_proven }}
          PRESERVED_OBJECT_ID: ${{ steps.objectid_proof.outputs.known_object_id }}

          PROGRAM_STEP_OUTCOME: ${{ steps.program_discovery.outcome }}
          PROGRAM_DISCOVERY_STATUS: ${{ steps.program_discovery.outputs.discovery_status }}
          PROGRAM_OBJECT_ID: ${{ steps.program_discovery.outputs.program_object_id }}

          TASK_DESCRIBE_STATUS: ${{ steps.task_describe.outputs.describe_status }}
          TASK_PROPERTY_COUNT: ${{ steps.task_describe.outputs.property_count }}

          TASK_RETRIEVE_OUTCOME: ${{ steps.task_retrieve.outcome }}
          TASK_DISCOVERY_STATUS: ${{ steps.task_retrieve.outputs.discovery_status }}
          TASK_COUNT: ${{ steps.task_retrieve.outputs.task_count }}
          PROGRAM_COUNT: ${{ steps.program_discovery.outputs.program_count }}

        run: |
          set -euo pipefail

          export LOB
          export SANDBOX_MID

          export OBJECTID_STEP_OUTCOME
          export OBJECTID_IDENTITY_PROVEN
          export PRESERVED_OBJECT_ID

          export PROGRAM_STEP_OUTCOME
          export PROGRAM_DISCOVERY_STATUS
          export PROGRAM_OBJECT_ID
          export PROGRAM_COUNT

          python3 <<'PY'
          import os
          import json

          with open(
              "automation-metadata.json",
              encoding="utf-8"
          ) as f:
              automation = json.load(f)

          with open(
              "query-definitions.json",
              encoding="utf-8"
          ) as f:
              queries = json.load(f)

          customer_key = (
              automation.get("CustomerKey", "")
              or ""
          )

          object_id = (
              automation.get("ObjectID", "")
              or ""
          )

          objectid_identity_proven = (
              os.environ.get(
                  "OBJECTID_IDENTITY_PROVEN",
                  ""
              ).lower() == "true"
          )

          preserved_object_id = (
              os.environ.get(
                  "PRESERVED_OBJECT_ID",
                  ""
              )
          )

          objectid_step_outcome = (
              os.environ.get(
                  "OBJECTID_STEP_OUTCOME",
                  ""
              )
          )

          program_step_outcome = (
              os.environ.get(
                  "PROGRAM_STEP_OUTCOME",
                  ""
              )
          )

          program_status = (
              os.environ.get(
                  "PROGRAM_DISCOVERY_STATUS",
                  ""
              )
          )

          program_object_id = (
              os.environ.get(
                  "PROGRAM_OBJECT_ID",
                  ""
              )
          )

          program_count_raw = (
              os.environ.get(
                  "PROGRAM_COUNT",
                  "0"
              )
          )

          try:
              program_count = int(
                  program_count_raw or "0"
              )
          except ValueError:
              program_count = 0

          program_resolved = (
              program_status == "PROGRAM_RESOLVED"
          )

          relationship_status = "UNRESOLVED"

          if program_resolved:

              relationship_reason = (
                  "SFMC returned a Program matching the "
                  "retrieved Automation CustomerKey. "
                  "Program identity is resolved, but no "
                  "Program -> Task -> Activity -> Query "
                  "relationship has yet been retrieved."
              )

          else:

              relationship_reason = (
                  "Automation and QueryDefinition metadata "
                  "were retrieved successfully, but SFMC "
                  "has not yet returned enough relationship "
                  "evidence to associate Task, Activity, "
                  "or QueryDefinition objects with this "
                  "Automation."
              )

          definition = {

              "schemaVersion":
                  "1.3",

              "assetType":
                  "automation",

              "environment":
                  "sandbox",

              "businessUnitMid":
                  os.environ["SANDBOX_MID"],

              "lineOfBusiness":
                  os.environ["LOB"],

              "automation": {

                  "name":
                      automation.get("Name", ""),

                  "customerKey":
                      customer_key,

                  "objectId":
                      object_id,

                  "description":
                      automation.get(
                          "Description",
                          ""
                      ),

                  "status":
                      automation.get(
                          "Status",
                          ""
                      ),

                  "isActive":
                      automation.get(
                          "IsActive",
                          ""
                      ),

                  "createdDate":
                      automation.get(
                          "CreatedDate",
                          ""
                      ),

                  "modifiedDate":
                      automation.get(
                          "ModifiedDate",
                          ""
                      )
              },

              "identity": {

                  "customerKeyResolved":
                      bool(customer_key),

                  "objectIdReturned":
                      bool(object_id),

                  "preservedCreateObjectId":
                      preserved_object_id,

                  "preservedObjectIdIdentityProven":
                      objectid_identity_proven,

                  "preservedObjectIdProbeOutcome":
                      objectid_step_outcome
              },

              "programDiscovery": {

                  "stepOutcome":
                      program_step_outcome,

                  "status":
                      program_status,

                  "programResolved":
                      program_resolved,

                  "programCount":
                      program_count,

                  "programObjectId":
                      program_object_id
              },

              "discovery": {

                  "queryDefinitionsRetrieved":
                      len(queries)
              },

              "relationships": {

                  "status":
                      relationship_status,

                  "reason":
                      relationship_reason
              }
          }

          with open(
              "retrieved-definition.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  definition,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("============================================")
          print("AUTOMATION RETRIEVAL RESULT")
          print("============================================")

          print(
              "Automation:",
              definition["automation"]["name"]
          )

          print(
              "CustomerKey:",
              customer_key
          )

          print(
              "ObjectID returned by Automation Retrieve:",
              object_id or "[not returned]"
          )

          print(
              "Preserved Create ObjectID:",
              preserved_object_id or "[not available]"
          )

          print(
              "Preserved ObjectID identity proven:",
              objectid_identity_proven
          )

          print(
              "Program discovery status:",
              program_status or "[no output]"
          )

          print(
              "Program ObjectID:",
              program_object_id or "[not returned]"
          )

          print(
              "QueryDefinitions:",
              len(queries)
          )

          print(
              "Relationship:",
              relationship_status
          )

          print("============================================")
          PY


      # ============================================================
      # 17. SAVE RESULT
      # ============================================================
      - name: Save retrieved Automation definition
        id: save
        shell: bash
        env:
          ASSET_ROOT: ${{ steps.config.outputs.asset_root }}
          LOB: ${{ steps.config.outputs.lob }}
          AUTOMATIONS_DIR: ${{ steps.config.outputs.automations_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          SAFE_NAME=$(printf '%s' "$AUTOMATION_NAME" \
            | sed 's/[^A-Za-z0-9._-]/_/g')

          OUTPUT_DIR="${ASSET_ROOT}/${LOB}/${AUTOMATIONS_DIR}/${SAFE_NAME}"

          mkdir -p "$OUTPUT_DIR"

          cp retrieved-definition.json \
            "$OUTPUT_DIR/definition.json"

          cp automation-metadata.json \
            "$OUTPUT_DIR/automation-metadata.json"

          cp query-definitions.json \
            "$OUTPUT_DIR/query-definitions.json"

          if [ -f automation-objectid-proof.json ]; then
            cp automation-objectid-proof.json \
              "$OUTPUT_DIR/automation-objectid-proof.json"
          fi

          if [ -f program-discovery.json ]; then
            cp program-discovery.json \
              "$OUTPUT_DIR/program-discovery.json"
          fi

          if [ -f program-retrieve-response.xml ]; then
            cp program-retrieve-response.xml \
              "$OUTPUT_DIR/program-retrieve-response.xml"
          fi

          if [ -f task-describe.json ]; then
            cp task-describe.json \
              "$OUTPUT_DIR/task-describe.json"
          fi

          if [ -f task-describe-response.xml ]; then
            cp task-describe-response.xml \
              "$OUTPUT_DIR/task-describe-response.xml"
          fi

          if [ -f task-discovery.json ]; then
            cp task-discovery.json \
              "$OUTPUT_DIR/task-discovery.json"
          fi

          if [ -f task-retrieve-response.xml ]; then
            cp task-retrieve-response.xml \
              "$OUTPUT_DIR/task-retrieve-response.xml"
          fi

          if [ -f activity-describe.json ]; then
            cp activity-describe.json \
              "$OUTPUT_DIR/activity-describe.json"
          fi

          if [ -f activity-describe-response.xml ]; then
            cp activity-describe-response.xml \
              "$OUTPUT_DIR/activity-describe-response.xml"
          fi

          if [ -f activity-discovery.json ]; then
            cp activity-discovery.json \
              "$OUTPUT_DIR/activity-discovery.json"
          fi

          for RESPONSE_FILE in activity-retrieve-response-*.xml; do
            if [ -f "$RESPONSE_FILE" ]; then
              cp "$RESPONSE_FILE" \
                "$OUTPUT_DIR/$RESPONSE_FILE"
            fi
          done

          if [ -f query-relationship.json ]; then
            cp query-relationship.json \
              "$OUTPUT_DIR/query-relationship.json"
          fi

          if [ -f schedule-parent-describe.json ]; then
            cp schedule-parent-describe.json \
              "$OUTPUT_DIR/schedule-parent-describe.json"
          fi

          for RESPONSE_FILE in automation-describe-response.xml program-describe-response.xml; do
            if [ -f "$RESPONSE_FILE" ]; then
              cp "$RESPONSE_FILE" \
                "$OUTPUT_DIR/$RESPONSE_FILE"
            fi
          done

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          echo "Saved to:"
          echo "$OUTPUT_DIR"


      # ============================================================
      # 18. DISPLAY RESULT
      # ============================================================
      - name: Display retrieved definition
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
        run: |
          set -euo pipefail

          echo ""
          echo "============================================"
          echo "RETRIEVED DEFINITION"
          echo "============================================"

          jq . "$OUTPUT_DIR/definition.json"

          if [ -f "$OUTPUT_DIR/automation-objectid-proof.json" ]; then

            echo ""
            echo "============================================"
            echo "AUTOMATION OBJECTID PROBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/automation-objectid-proof.json"
          fi

          if [ -f "$OUTPUT_DIR/program-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "PROGRAM DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/program-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/task-describe.json" ]; then

            echo ""
            echo "============================================"
            echo "TASK OBJECT DESCRIBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/task-describe.json"
          fi

          if [ -f "$OUTPUT_DIR/task-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "PROGRAM -> TASK DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/task-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/activity-describe.json" ]; then

            echo ""
            echo "============================================"
            echo "ACTIVITY OBJECT DESCRIBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/activity-describe.json"
          fi

          if [ -f "$OUTPUT_DIR/activity-discovery.json" ]; then

            echo ""
            echo "============================================"
            echo "TASK -> ACTIVITY DISCOVERY"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/activity-discovery.json"
          fi

          if [ -f "$OUTPUT_DIR/query-relationship.json" ]; then

            echo ""
            echo "============================================"
            echo "ACTIVITY -> QUERYDEFINITION RELATIONSHIP"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/query-relationship.json"
          fi

          if [ -f "$OUTPUT_DIR/schedule-parent-describe.json" ]; then

            echo ""
            echo "============================================"
            echo "AUTOMATION + PROGRAM DESCRIBE"
            echo "============================================"

            jq . \
              "$OUTPUT_DIR/schedule-parent-describe.json"
          fi


      # ============================================================
      # 19. COMMIT
      # ============================================================
      - name: Commit retrieved Automation
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No Automation changes detected."
            exit 0
          fi

          git commit \
            -m "Retrieve SFMC Automation: ${AUTOMATION_NAME}"

          git push origin HEAD:sandbox

          echo "Automation retrieval committed."


      # ============================================================
      # 20. FINAL RESULT
      # ============================================================
      - name: Retrieval complete
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
          CUSTOMER_KEY: ${{ steps.automation.outputs.customer_key }}
          OBJECT_ID: ${{ steps.automation.outputs.object_id }}

          QUERY_COUNT: ${{ steps.queries.outputs.query_count }}

          OBJECTID_PROOF: ${{ steps.objectid_proof.outputs.identity_proven }}
          KNOWN_OBJECT_ID: ${{ steps.objectid_proof.outputs.known_object_id }}
          OBJECTID_OUTCOME: ${{ steps.objectid_proof.outcome }}

          PROGRAM_OUTCOME: ${{ steps.program_discovery.outcome }}
          PROGRAM_STATUS: ${{ steps.program_discovery.outputs.discovery_status }}
          PROGRAM_COUNT: ${{ steps.program_discovery.outputs.program_count }}
          PROGRAM_OBJECT_ID: ${{ steps.program_discovery.outputs.program_object_id }}

        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "SFMC AUTOMATION RETRIEVAL CHECKPOINT"
          echo "=================================================="

          echo ""
          echo "Automation:"
          echo "$AUTOMATION_NAME"

          echo ""
          echo "CustomerKey:"
          echo "$CUSTOMER_KEY"

          echo ""
          echo "ObjectID returned by Automation Retrieve:"
          echo "${OBJECT_ID:-[not returned]}"

          echo ""
          echo "Preserved Automation NewObjectID:"
          echo "${KNOWN_OBJECT_ID:-[not available]}"

          echo ""
          echo "Preserved NewObjectID probe outcome:"
          echo "${OBJECTID_OUTCOME:-[not available]}"

          echo ""
          echo "Preserved NewObjectID identity proof:"
          echo "${OBJECTID_PROOF:-false}"

          echo ""
          echo "QueryDefinitions retrieved:"
          echo "$QUERY_COUNT"

          echo ""
          echo "Program discovery step outcome:"
          echo "${PROGRAM_OUTCOME:-[not available]}"

          echo ""
          echo "Program discovery status:"
          echo "${PROGRAM_STATUS:-[not available]}"

          echo ""
          echo "Programs returned:"
          echo "${PROGRAM_COUNT:-0}"

          echo ""
          echo "Program ObjectID:"
          echo "${PROGRAM_OBJECT_ID:-[not returned]}"

          echo ""
          echo "Task Describe status:"
          echo "${TASK_DESCRIBE_STATUS:-[not available]}"

          echo ""
          echo "Task retrievable properties:"
          echo "${TASK_PROPERTY_COUNT:-0}"

          echo ""
          echo "Task Retrieve step outcome:"
          echo "${TASK_RETRIEVE_OUTCOME:-[not available]}"

          echo ""
          echo "Program -> Task discovery status:"
          echo "${TASK_DISCOVERY_STATUS:-[not available]}"

          echo ""
          echo "Tasks returned:"
          echo "${TASK_COUNT:-0}"

          echo ""
          echo "Activity Describe status:"
          echo "${ACTIVITY_DESCRIBE_STATUS:-[not available]}"

          echo ""
          echo "Activity retrievable properties:"
          echo "${ACTIVITY_PROPERTY_COUNT:-0}"

          echo ""
          echo "Activity Retrieve step outcome:"
          echo "${ACTIVITY_RETRIEVE_OUTCOME:-[not available]}"

          echo ""
          echo "Task -> Activity discovery status:"
          echo "${ACTIVITY_DISCOVERY_STATUS:-[not available]}"

          echo ""
          echo "Activities returned:"
          echo "${ACTIVITY_COUNT:-0}"

          echo ""
          echo "Activity -> QueryDefinition step outcome:"
          echo "${QUERY_RELATIONSHIP_OUTCOME:-[not available]}"

          echo ""
          echo "Activity -> QueryDefinition status:"
          echo "${QUERY_RELATIONSHIP_STATUS:-[not available]}"

          echo ""
          echo "Query relationships resolved:"
          echo "${QUERY_RELATIONSHIP_COUNT:-0}"

          echo ""
          echo "Automation + Program Describe status:"
          echo "${SCHEDULE_PARENT_DESCRIBE_STATUS:-[not available]}"

          echo ""
          echo "Schedule/source/time-related properties discovered:"
          echo "${SCHEDULE_RELEVANT_PROPERTY_COUNT:-0}"

          echo ""
          echo "IMPORTANT:"
          echo "Program identity and Task/Activity relationship proof are separate."
          echo "No Program -> Task -> Activity -> Query relationship has been guessed."

          echo ""
          echo "=================================================="
