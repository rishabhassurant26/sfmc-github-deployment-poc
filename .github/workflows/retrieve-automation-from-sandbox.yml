name: Retrieve SFMC Automation from Sandbox

on:
  workflow_dispatch:
    inputs:
      automation_name:
        description: "Exact existing Automation Studio automation name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  retrieve-automation:
    name: Retrieve Existing Sandbox Automation
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SANDBOX
      # ============================================================
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox
          fetch-depth: 0


      # ============================================================
      # 2. VALIDATE CONFIG
      # ============================================================
      - name: Validate configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/lob-config.json"

          [ -f "$CONFIG_FILE" ] || {
            echo "ERROR: $CONFIG_FILE not found."
            exit 1
          }

          LOB=$(jq -r '.lineOfBusiness // empty' "$CONFIG_FILE")
          ASSET_ROOT=$(jq -r '.assetRoot // empty' "$CONFIG_FILE")
          SANDBOX_MID=$(jq -r '.environments.sandbox.businessUnitMid // empty' "$CONFIG_FILE")
          AUTOMATIONS_ENABLED=$(jq -r '.assetTypes.automations.enabled // false' "$CONFIG_FILE")
          AUTOMATIONS_DIR=$(jq -r '.assetTypes.automations.directory // empty' "$CONFIG_FILE")

          [ -n "$LOB" ] || {
            echo "ERROR: lineOfBusiness missing."
            exit 1
          }

          [ -n "$ASSET_ROOT" ] || {
            echo "ERROR: assetRoot missing."
            exit 1
          }

          [ -n "$SANDBOX_MID" ] || {
            echo "ERROR: Sandbox MID missing."
            exit 1
          }

          [ "$AUTOMATIONS_ENABLED" = "true" ] || {
            echo "ERROR: Automation retrieval disabled in config."
            exit 1
          }

          [ -n "$AUTOMATIONS_DIR" ] || {
            echo "ERROR: Automation directory missing."
            exit 1
          }

          echo "lob=$LOB" >> "$GITHUB_OUTPUT"
          echo "asset_root=$ASSET_ROOT" >> "$GITHUB_OUTPUT"
          echo "sandbox_mid=$SANDBOX_MID" >> "$GITHUB_OUTPUT"
          echo "automations_dir=$AUTOMATIONS_DIR" >> "$GITHUB_OUTPUT"

          echo "Configuration validated."


      # ============================================================
      # 3. VALIDATE INPUT
      # ============================================================
      - name: Validate input
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          [ -n "$AUTOMATION_NAME" ] || {
            echo "ERROR: Automation name is required."
            exit 1
          }

          echo "Automation requested:"
          echo "$AUTOMATION_NAME"


      # ============================================================
      # 4. VALIDATE SECRETS
      # ============================================================
      - name: Validate GitHub secrets
        shell: bash
        env:
          AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          [ -n "$AUTH_BASE_URI" ] || {
            echo "ERROR: SFMC_AUTH_BASE_URI missing."
            exit 1
          }

          [ -n "$CLIENT_ID" ] || {
            echo "ERROR: SFMC_CLIENT_ID missing."
            exit 1
          }

          [ -n "$CLIENT_SECRET" ] || {
            echo "ERROR: SFMC_CLIENT_SECRET missing."
            exit 1
          }

          echo "Required secrets are available."


      # ============================================================
      # 5. AUTHENTICATE
      # ============================================================
      - name: Authenticate to SFMC Sandbox
        id: auth
        shell: bash
        env:
          AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${AUTH_BASE_URI%/}/v2/token" \
            --header "Content-Type: application/json" \
            --data "{
              \"grant_type\":\"client_credentials\",
              \"client_id\":\"${CLIENT_ID}\",
              \"client_secret\":\"${CLIENT_SECRET}\",
              \"account_id\":\"${SANDBOX_MID}\"
            }")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          SOAP_URL=$(echo "$TOKEN_RESPONSE" | jq -r '.soap_instance_url // empty')

          [ -n "$ACCESS_TOKEN" ] || {
            echo "ERROR: Access token not returned."
            exit 1
          }

          [ -n "$SOAP_URL" ] || {
            echo "ERROR: SOAP URL not returned."
            exit 1
          }

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "soap_url=$SOAP_URL" >> "$GITHUB_OUTPUT"

          echo "SFMC Sandbox authentication successful."


      # ============================================================
      # 6. RETRIEVE AUTOMATION METADATA
      #    THIS IS THE ALREADY-PROVEN #5 LOGIC
      # ============================================================
      - name: Retrieve existing Automation metadata
        id: automation
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL AUTOMATION_NAME

          python3 <<'PY'
          import os
          import html
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          automation_name = os.environ["AUTOMATION_NAME"]

          def esc(value):
              return html.escape(value or "", quote=True)

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{esc(token)}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>
              <et:RetrieveRequestMsg>
                <et:RetrieveRequest>

                  <et:ObjectType>Automation</et:ObjectType>

                  <et:Properties>ObjectID</et:Properties>
                  <et:Properties>CustomerKey</et:Properties>
                  <et:Properties>Name</et:Properties>
                  <et:Properties>Description</et:Properties>
                  <et:Properties>Status</et:Properties>
                  <et:Properties>IsActive</et:Properties>
                  <et:Properties>CreatedDate</et:Properties>
                  <et:Properties>ModifiedDate</et:Properties>

                  <et:Filter xsi:type="et:SimpleFilterPart">
                    <et:Property>Name</et:Property>
                    <et:SimpleOperator>equals</et:SimpleOperator>
                    <et:Value>{esc(automation_name)}</et:Value>
                  </et:Filter>

                </et:RetrieveRequest>
              </et:RetrieveRequestMsg>
            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=UTF-8",
                  "SOAPAction": "Retrieve"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  xml_data = response.read()

          except urllib.error.HTTPError as exc:
              print(
                  exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise SystemExit(
                  f"Automation Retrieve HTTP {exc.code}"
              )

          root = ET.fromstring(xml_data)

          overall = ""
          results = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":
                  overall = (element.text or "").strip()

              elif local == "Results":

                  current = {}

                  for child in list(element):
                      key = child.tag.split("}")[-1]
                      current[key] = (
                          child.text or ""
                      ).strip()

                  if current.get("Name"):
                      results.append(current)

          if overall not in ("OK", "MoreDataAvailable"):
              raise SystemExit(
                  "Automation Retrieve returned status: "
                  + overall
              )

          exact = [
              item
              for item in results
              if item.get("Name") == automation_name
          ]

          if len(exact) != 1:
              raise SystemExit(
                  "Automation exact-name lookup did not "
                  "return exactly one result."
              )

          automation = exact[0]

          customer_key = automation.get("CustomerKey", "")
          object_id = automation.get("ObjectID", "")

          if not customer_key:
              raise SystemExit(
                  "Automation CustomerKey not returned."
              )

          with open(
              "automation-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  automation,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(f"customer_key={customer_key}\n")
              f.write(f"object_id={object_id}\n")

          print("")
          print("============================================")
          print("AUTOMATION FOUND")
          print("============================================")
          print("Name:", automation.get("Name", ""))
          print("CustomerKey:", customer_key)
          print(
              "ObjectID:",
              object_id or "[not returned]"
          )
          print("Status:", automation.get("Status", ""))
          print("============================================")
          PY


      # ============================================================
      # 7. RETRIEVE QUERY DEFINITIONS
      #    ALREADY-PROVEN #5 LOGIC
      # ============================================================
      - name: Retrieve Sandbox QueryDefinitions
        id: queries
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          properties = [
              "ObjectID",
              "CustomerKey",
              "Name",
              "Description",
              "QueryText",
              "TargetType",
              "TargetUpdateType",
              "CreatedDate",
              "ModifiedDate"
          ]

          def retrieve_page(continue_request=None):

              if continue_request:

                  request_content = f"""
                  <et:RetrieveRequest>
                    <et:ContinueRequest>{continue_request}</et:ContinueRequest>
                  </et:RetrieveRequest>
                  """

              else:

                  props = "\n".join(
                      f"<et:Properties>{p}</et:Properties>"
                      for p in properties
                  )

                  request_content = f"""
                  <et:RetrieveRequest>

                    <et:ObjectType>
                      QueryDefinition
                    </et:ObjectType>

                    {props}

                  </et:RetrieveRequest>
                  """

              body = f"""<?xml version="1.0" encoding="UTF-8"?>
              <soapenv:Envelope
                xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                xmlns:et="http://exacttarget.com/wsdl/partnerAPI">

                <soapenv:Header>
                  <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
                </soapenv:Header>

                <soapenv:Body>
                  <et:RetrieveRequestMsg>
                    {request_content}
                  </et:RetrieveRequestMsg>
                </soapenv:Body>

              </soapenv:Envelope>
              """

              request = urllib.request.Request(
                  soap_url + "/Service.asmx",
                  data=body.encode("utf-8"),
                  headers={
                      "Content-Type":
                          "text/xml; charset=UTF-8",
                      "SOAPAction":
                          "Retrieve"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request
                  ) as response:
                      return response.read()

              except urllib.error.HTTPError as exc:
                  print(
                      exc.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
                  raise SystemExit(
                      f"QueryDefinition Retrieve HTTP "
                      f"{exc.code}"
                  )

          all_queries = []
          continue_request = None

          while True:

              xml_data = retrieve_page(
                  continue_request
              )

              root = ET.fromstring(xml_data)

              overall = ""
              request_id = ""
              page_queries = []

              for element in root.iter():

                  local = element.tag.split("}")[-1]

                  if local == "OverallStatus":
                      overall = (
                          element.text or ""
                      ).strip()

                  elif local == "RequestID":
                      request_id = (
                          element.text or ""
                      ).strip()

                  elif local == "Results":

                      current = {}

                      for child in list(element):
                          key = child.tag.split("}")[-1]
                          current[key] = (
                              child.text or ""
                          ).strip()

                      if (
                          current.get("ObjectID")
                          or current.get("CustomerKey")
                      ):
                          page_queries.append(current)

              all_queries.extend(page_queries)

              if overall not in (
                  "OK",
                  "MoreDataAvailable"
              ):
                  raise SystemExit(
                      "QueryDefinition Retrieve returned: "
                      + overall
                  )

              if overall != "MoreDataAvailable":
                  break

              if not request_id:
                  raise SystemExit(
                      "MoreDataAvailable without RequestID."
                  )

              continue_request = request_id

          with open(
              "query-definitions.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  all_queries,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  f"query_count={len(all_queries)}\n"
              )

          print(
              "QueryDefinitions retrieved:",
              len(all_queries)
          )
          PY


      # ============================================================
      # 8. NEW ISOLATED RELATIONSHIP DISCOVERY
      #
      # This step does NOT derive task/query keys from naming.
      #
      # It asks SFMC for AutomationTask objects and records exactly
      # what SFMC exposes.
      #
      # Failure here does NOT alter the already-proven Automation
      # and QueryDefinition retrieval logic.
      # ============================================================
      - name: Discover AutomationTask relationship
        id: task_discovery
        continue-on-error: true
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
          AUTOMATION_CUSTOMER_KEY: ${{ steps.automation.outputs.customer_key }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL AUTOMATION_CUSTOMER_KEY

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          automation_key = os.environ["AUTOMATION_CUSTOMER_KEY"]

          # Do not infer ${automation_key}_TASK.
          # Retrieve actual AutomationTask objects exposed by SFMC.

          properties = [
              "ObjectID",
              "CustomerKey",
              "Name",
              "Sequence",
              "AutomationTaskType"
          ]

          props = "\n".join(
              f"<et:Properties>{p}</et:Properties>"
              for p in properties
          )

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>

              <et:RetrieveRequestMsg>

                <et:RetrieveRequest>

                  <et:ObjectType>
                    AutomationTask
                  </et:ObjectType>

                  {props}

                </et:RetrieveRequest>

              </et:RetrieveRequestMsg>

            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type":
                      "text/xml; charset=UTF-8",
                  "SOAPAction":
                      "Retrieve"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  request
              ) as response:
                  xml_data = response.read()

          except urllib.error.HTTPError as exc:

              response_text = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(response_text)

              raise SystemExit(
                  f"AutomationTask Retrieve HTTP "
                  f"{exc.code}"
              )

          root = ET.fromstring(xml_data)

          overall = ""
          tasks = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":
                  overall = (
                      element.text or ""
                  ).strip()

              elif local == "Results":

                  task = {}

                  for child in list(element):

                      key = child.tag.split("}")[-1]

                      task[key] = (
                          child.text or ""
                      ).strip()

                  if task:
                      tasks.append(task)

          print("")
          print("============================================")
          print("AUTOMATION TASK DISCOVERY")
          print("============================================")
          print("SOAP Status:", overall)
          print("Tasks returned:", len(tasks))
          print("============================================")

          with open(
              "automation-tasks.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  tasks,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # We deliberately do not match by generated naming pattern.
          # This phase only records what SFMC actually returns.

          status = (
              "DISCOVERED"
              if tasks
              else "NOT_RETURNED"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  f"relationship_status={status}\n"
              )
              f.write(
                  f"task_count={len(tasks)}\n"
              )

          if tasks:
              print("")
              print(
                  "AutomationTask objects were returned "
                  "by SFMC."
              )
              print(
                  "No task has been assigned to the "
                  "Automation without relationship proof."
              )
          else:
              print(
                  "SFMC returned no AutomationTask "
                  "objects."
              )
          PY


      # ============================================================
      # 9. BUILD DEFINITION
      # ============================================================
      - name: Build Automation retrieval definition
        shell: bash
        env:
          LOB: ${{ steps.config.outputs.lob }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
          TASK_STEP_OUTCOME: ${{ steps.task_discovery.outcome }}
        run: |
          set -euo pipefail

          export LOB SANDBOX_MID TASK_STEP_OUTCOME

          python3 <<'PY'
          import os
          import json

          with open(
              "automation-metadata.json",
              encoding="utf-8"
          ) as f:
              automation = json.load(f)

          with open(
              "query-definitions.json",
              encoding="utf-8"
          ) as f:
              queries = json.load(f)

          tasks = []

          if os.path.exists(
              "automation-tasks.json"
          ):
              with open(
                  "automation-tasks.json",
                  encoding="utf-8"
              ) as f:
                  tasks = json.load(f)

          customer_key = (
              automation.get("CustomerKey", "")
              or ""
          )

          object_id = (
              automation.get("ObjectID", "")
              or ""
          )

          task_discovery_outcome = (
              os.environ.get(
                  "TASK_STEP_OUTCOME",
                  ""
              )
          )

          if tasks:

              relationship_status = (
                  "TASK_OBJECTS_DISCOVERED"
              )

              relationship_reason = (
                  "SFMC returned AutomationTask objects. "
                  "No AutomationTask has yet been assigned "
                  "to this Automation without an explicit "
                  "SFMC-returned parent relationship."
              )

          else:

              relationship_status = "UNRESOLVED"

              relationship_reason = (
                  "Automation and QueryDefinition metadata "
                  "were retrieved successfully, but SFMC "
                  "did not provide enough relationship "
                  "evidence to associate a task/query with "
                  "this Automation."
              )

          definition = {

              "schemaVersion":
                  "1.1",

              "assetType":
                  "automation",

              "environment":
                  "sandbox",

              "businessUnitMid":
                  os.environ["SANDBOX_MID"],

              "lineOfBusiness":
                  os.environ["LOB"],

              "automation": {

                  "name":
                      automation.get("Name", ""),

                  "customerKey":
                      customer_key,

                  "objectId":
                      object_id,

                  "description":
                      automation.get(
                          "Description",
                          ""
                      ),

                  "status":
                      automation.get(
                          "Status",
                          ""
                      ),

                  "isActive":
                      automation.get(
                          "IsActive",
                          ""
                      ),

                  "createdDate":
                      automation.get(
                          "CreatedDate",
                          ""
                      ),

                  "modifiedDate":
                      automation.get(
                          "ModifiedDate",
                          ""
                      )
              },

              "identity": {

                  "customerKeyResolved":
                      bool(customer_key),

                  "objectIdReturned":
                      bool(object_id)
              },

              "discovery": {

                  "queryDefinitionsRetrieved":
                      len(queries),

                  "automationTasksReturned":
                      len(tasks),

                  "automationTaskDiscoveryOutcome":
                      task_discovery_outcome
              },

              "relationships": {

                  "status":
                      relationship_status,

                  "reason":
                      relationship_reason
              }
          }

          with open(
              "retrieved-definition.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  definition,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("============================================")
          print("AUTOMATION RETRIEVAL RESULT")
          print("============================================")
          print(
              "Automation:",
              definition["automation"]["name"]
          )
          print(
              "CustomerKey:",
              customer_key
          )
          print(
              "ObjectID:",
              object_id or "[not returned]"
          )
          print(
              "QueryDefinitions:",
              len(queries)
          )
          print(
              "AutomationTasks:",
              len(tasks)
          )
          print(
              "Relationship:",
              relationship_status
          )
          print("============================================")
          PY


      # ============================================================
      # 10. SAVE RESULT
      # ============================================================
      - name: Save retrieved Automation definition
        id: save
        shell: bash
        env:
          ASSET_ROOT: ${{ steps.config.outputs.asset_root }}
          LOB: ${{ steps.config.outputs.lob }}
          AUTOMATIONS_DIR: ${{ steps.config.outputs.automations_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          SAFE_NAME=$(printf '%s' "$AUTOMATION_NAME" \
            | sed 's/[^A-Za-z0-9._-]/_/g')

          OUTPUT_DIR="${ASSET_ROOT}/${LOB}/${AUTOMATIONS_DIR}/${SAFE_NAME}"

          mkdir -p "$OUTPUT_DIR"

          cp retrieved-definition.json \
            "$OUTPUT_DIR/definition.json"

          cp automation-metadata.json \
            "$OUTPUT_DIR/automation-metadata.json"

          if [ -f automation-tasks.json ]; then
            cp automation-tasks.json \
              "$OUTPUT_DIR/automation-tasks.json"
          fi

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          echo "Saved to:"
          echo "$OUTPUT_DIR"


      # ============================================================
      # 11. DISPLAY RESULT
      # ============================================================
      - name: Display retrieved definition
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
        run: |
          set -euo pipefail

          jq . "$OUTPUT_DIR/definition.json"

          if [ -f "$OUTPUT_DIR/automation-tasks.json" ]; then
            echo ""
            echo "============================================"
            echo "AUTOMATION TASK DISCOVERY"
            echo "============================================"

            jq . "$OUTPUT_DIR/automation-tasks.json"
          fi


      # ============================================================
      # 12. COMMIT
      # ============================================================
      - name: Commit retrieved Automation
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.save.outputs.output_dir }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No Automation changes detected."
            exit 0
          fi

          git commit \
            -m "Retrieve SFMC Automation: ${AUTOMATION_NAME}"

          git push origin HEAD:sandbox

          echo "Automation retrieval committed."


      # ============================================================
      # 13. FINAL RESULT
      # ============================================================
      - name: Retrieval complete
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
          CUSTOMER_KEY: ${{ steps.automation.outputs.customer_key }}
          OBJECT_ID: ${{ steps.automation.outputs.object_id }}
          QUERY_COUNT: ${{ steps.queries.outputs.query_count }}
          TASK_OUTCOME: ${{ steps.task_discovery.outcome }}
          TASK_COUNT: ${{ steps.task_discovery.outputs.task_count }}
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "SFMC AUTOMATION RETRIEVAL CHECKPOINT"
          echo "=================================================="

          echo ""
          echo "Automation:"
          echo "$AUTOMATION_NAME"

          echo ""
          echo "CustomerKey:"
          echo "$CUSTOMER_KEY"

          echo ""
          echo "ObjectID:"
          echo "${OBJECT_ID:-[not returned]}"

          echo ""
          echo "QueryDefinitions retrieved:"
          echo "$QUERY_COUNT"

          echo ""
          echo "AutomationTask discovery step:"
          echo "$TASK_OUTCOME"

          echo ""
          echo "AutomationTasks returned:"
          echo "${TASK_COUNT:-0}"

          echo ""
          echo "IMPORTANT:"
          echo "No task/query relationship has been guessed."

          echo ""
          echo "=================================================="
