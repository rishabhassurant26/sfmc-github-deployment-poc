name: Retrieve SFMC Automation from Sandbox

on:
  workflow_dispatch:
    inputs:
      automation_name:
        description: "Exact existing Automation Studio automation name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  retrieve-automation:
    name: Retrieve Existing Sandbox Automation
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SANDBOX
      # ============================================================
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox
          fetch-depth: 0


      # ============================================================
      # 2. VALIDATE CONFIG
      # ============================================================
      - name: Validate configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/lob-config.json"

          [ -f "$CONFIG_FILE" ] || {
            echo "ERROR: $CONFIG_FILE not found."
            exit 1
          }

          LOB=$(jq -r '.lineOfBusiness // empty' "$CONFIG_FILE")
          ASSET_ROOT=$(jq -r '.assetRoot // empty' "$CONFIG_FILE")
          SANDBOX_MID=$(jq -r '.environments.sandbox.businessUnitMid // empty' "$CONFIG_FILE")
          AUTOMATIONS_ENABLED=$(jq -r '.assetTypes.automations.enabled // false' "$CONFIG_FILE")
          AUTOMATIONS_DIR=$(jq -r '.assetTypes.automations.directory // empty' "$CONFIG_FILE")

          [ -n "$LOB" ] || {
            echo "ERROR: lineOfBusiness missing."
            exit 1
          }

          [ -n "$ASSET_ROOT" ] || {
            echo "ERROR: assetRoot missing."
            exit 1
          }

          [ -n "$SANDBOX_MID" ] || {
            echo "ERROR: Sandbox MID missing."
            exit 1
          }

          [ "$AUTOMATIONS_ENABLED" = "true" ] || {
            echo "ERROR: Automation retrieval disabled in config."
            exit 1
          }

          [ -n "$AUTOMATIONS_DIR" ] || {
            echo "ERROR: Automation directory missing."
            exit 1
          }

          echo "lob=$LOB" >> "$GITHUB_OUTPUT"
          echo "asset_root=$ASSET_ROOT" >> "$GITHUB_OUTPUT"
          echo "sandbox_mid=$SANDBOX_MID" >> "$GITHUB_OUTPUT"
          echo "automations_dir=$AUTOMATIONS_DIR" >> "$GITHUB_OUTPUT"

          echo "Configuration validated."


      # ============================================================
      # 3. VALIDATE INPUT
      # ============================================================
      - name: Validate input
        shell: bash
        env:
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          [ -n "$AUTOMATION_NAME" ] || {
            echo "ERROR: Automation name is required."
            exit 1
          }

          echo "Automation requested:"
          echo "$AUTOMATION_NAME"


      # ============================================================
      # 4. VALIDATE SECRETS
      # ============================================================
      - name: Validate GitHub secrets
        shell: bash
        env:
          AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          [ -n "$AUTH_BASE_URI" ] || {
            echo "ERROR: SFMC_AUTH_BASE_URI missing."
            exit 1
          }

          [ -n "$CLIENT_ID" ] || {
            echo "ERROR: SFMC_CLIENT_ID missing."
            exit 1
          }

          [ -n "$CLIENT_SECRET" ] || {
            echo "ERROR: SFMC_CLIENT_SECRET missing."
            exit 1
          }

          echo "Required secrets are available."


      # ============================================================
      # 5. AUTHENTICATE
      # ============================================================
      - name: Authenticate to SFMC Sandbox
        id: auth
        shell: bash
        env:
          AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "${AUTH_BASE_URI%/}/v2/token" \
            --header "Content-Type: application/json" \
            --data "{
              \"grant_type\":\"client_credentials\",
              \"client_id\":\"${CLIENT_ID}\",
              \"client_secret\":\"${CLIENT_SECRET}\",
              \"account_id\":\"${SANDBOX_MID}\"
            }")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          SOAP_URL=$(echo "$TOKEN_RESPONSE" | jq -r '.soap_instance_url // empty')

          [ -n "$ACCESS_TOKEN" ] || {
            echo "ERROR: Access token not returned."
            exit 1
          }

          [ -n "$SOAP_URL" ] || {
            echo "ERROR: SOAP URL not returned."
            exit 1
          }

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "soap_url=$SOAP_URL" >> "$GITHUB_OUTPUT"

          echo "SFMC Sandbox authentication successful."


      # ============================================================
      # 6. RETRIEVE AUTOMATION METADATA
      #    PROVEN BASELINE - UNCHANGED
      # ============================================================
      - name: Retrieve existing Automation metadata
        id: automation
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL AUTOMATION_NAME

          python3 <<'PY'
          import os
          import html
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          automation_name = os.environ["AUTOMATION_NAME"]

          def esc(value):
              return html.escape(value or "", quote=True)

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{esc(token)}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>
              <et:RetrieveRequestMsg>
                <et:RetrieveRequest>

                  <et:ObjectType>Automation</et:ObjectType>

                  <et:Properties>ObjectID</et:Properties>
                  <et:Properties>CustomerKey</et:Properties>
                  <et:Properties>Name</et:Properties>
                  <et:Properties>Description</et:Properties>
                  <et:Properties>Status</et:Properties>
                  <et:Properties>IsActive</et:Properties>
                  <et:Properties>CreatedDate</et:Properties>
                  <et:Properties>ModifiedDate</et:Properties>

                  <et:Filter xsi:type="et:SimpleFilterPart">
                    <et:Property>Name</et:Property>
                    <et:SimpleOperator>equals</et:SimpleOperator>
                    <et:Value>{esc(automation_name)}</et:Value>
                  </et:Filter>

                </et:RetrieveRequest>
              </et:RetrieveRequestMsg>
            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=UTF-8",
                  "SOAPAction": "Retrieve"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  xml_data = response.read()

          except urllib.error.HTTPError as exc:
              print(
                  exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise SystemExit(
                  f"Automation Retrieve HTTP {exc.code}"
              )

          root = ET.fromstring(xml_data)

          overall = ""
          results = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":
                  overall = (element.text or "").strip()

              elif local == "Results":

                  current = {}

                  for child in list(element):
                      key = child.tag.split("}")[-1]
                      current[key] = (
                          child.text or ""
                      ).strip()

                  if current.get("Name"):
                      results.append(current)

          if overall not in ("OK", "MoreDataAvailable"):
              raise SystemExit(
                  "Automation Retrieve returned status: "
                  + overall
              )

          exact = [
              item
              for item in results
              if item.get("Name") == automation_name
          ]

          if len(exact) != 1:
              raise SystemExit(
                  "Automation exact-name lookup did not "
                  "return exactly one result."
              )

          automation = exact[0]

          customer_key = automation.get("CustomerKey", "")
          object_id = automation.get("ObjectID", "")

          if not customer_key:
              raise SystemExit(
                  "Automation CustomerKey not returned."
              )

          with open(
              "automation-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  automation,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(f"customer_key={customer_key}\n")
              f.write(f"object_id={object_id}\n")

          print("")
          print("============================================")
          print("AUTOMATION FOUND")
          print("============================================")
          print("Name:", automation.get("Name", ""))
          print("CustomerKey:", customer_key)
          print(
              "ObjectID:",
              object_id or "[not returned]"
          )
          print("Status:", automation.get("Status", ""))
          print("============================================")
          PY


      # ============================================================
      # 7. RETRIEVE QUERY DEFINITIONS
      #    PROVEN BASELINE - UNCHANGED
      # ============================================================
      - name: Retrieve Sandbox QueryDefinitions
        id: queries
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          properties = [
              "ObjectID",
              "CustomerKey",
              "Name",
              "Description",
              "QueryText",
              "TargetType",
              "DataExtensionTarget.Name",
              "DataExtensionTarget.CustomerKey",
              "DataExtensionTarget.Description",
              "TargetUpdateType",
              "CreatedDate",
              "ModifiedDate"
          ]

          def retrieve_page(continue_request=None):

              if continue_request:

                  request_content = f"""
                  <et:RetrieveRequest>
                    <et:ContinueRequest>{continue_request}</et:ContinueRequest>
                  </et:RetrieveRequest>
                  """

              else:

                  props = "\n".join(
                      f"<et:Properties>{p}</et:Properties>"
                      for p in properties
                  )

                  request_content = f"""
                  <et:RetrieveRequest>

                    <et:ObjectType>
                      QueryDefinition
                    </et:ObjectType>

                    {props}

                  </et:RetrieveRequest>
                  """

              body = f"""<?xml version="1.0" encoding="UTF-8"?>
              <soapenv:Envelope
                xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                xmlns:et="http://exacttarget.com/wsdl/partnerAPI">

                <soapenv:Header>
                  <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
                </soapenv:Header>

                <soapenv:Body>
                  <et:RetrieveRequestMsg>
                    {request_content}
                  </et:RetrieveRequestMsg>
                </soapenv:Body>

              </soapenv:Envelope>
              """

              request = urllib.request.Request(
                  soap_url + "/Service.asmx",
                  data=body.encode("utf-8"),
                  headers={
                      "Content-Type":
                          "text/xml; charset=UTF-8",
                      "SOAPAction":
                          "Retrieve"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request
                  ) as response:
                      return response.read()

              except urllib.error.HTTPError as exc:
                  print(
                      exc.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
                  raise SystemExit(
                      f"QueryDefinition Retrieve HTTP "
                      f"{exc.code}"
                  )

          all_queries = []
          continue_request = None

          while True:

              xml_data = retrieve_page(
                  continue_request
              )

              root = ET.fromstring(xml_data)

              overall = ""
              request_id = ""
              page_queries = []

              for element in root.iter():

                  local = element.tag.split("}")[-1]

                  if local == "OverallStatus":
                      overall = (
                          element.text or ""
                      ).strip()

                  elif local == "RequestID":
                      request_id = (
                          element.text or ""
                      ).strip()

                  elif local == "Results":

                      current = {}

                      for child in list(element):
                          key = child.tag.split("}")[-1]

                          if key == "DataExtensionTarget":
                              target = {}
                              for sub in list(child):
                                  subkey = sub.tag.split("}")[-1]
                                  target[subkey] = (
                                      sub.text or ""
                                  ).strip()
                              current["DataExtensionTarget"] = target

                          elif len(list(child)) == 0:
                              current[key] = (
                                  child.text or ""
                              ).strip()

                      if (
                          current.get("ObjectID")
                          or current.get("CustomerKey")
                      ):
                          page_queries.append(current)

              all_queries.extend(page_queries)

              if overall not in (
                  "OK",
                  "MoreDataAvailable"
              ):
                  raise SystemExit(
                      "QueryDefinition Retrieve returned: "
                      + overall
                  )

              if overall != "MoreDataAvailable":
                  break

              if not request_id:
                  raise SystemExit(
                      "MoreDataAvailable without RequestID."
                  )

              continue_request = request_id

          with open(
              "query-definitions.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  all_queries,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  f"query_count={len(all_queries)}\n"
              )

          print(
              "QueryDefinitions retrieved:",
              len(all_queries)
          )
          PY


      # ============================================================
      # 8. DISCOVER QUERYDEFINITION TARGET-DE RETRIEVAL SCHEMA
      # Isolated diagnostic. Existing proven retrieval remains unchanged.
      # ============================================================
      - name: Discover QueryDefinition target DE schema
        id: query_target_schema
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
        run: |
          set -euo pipefail
          export ACCESS_TOKEN SOAP_URL

          python3 <<'PY'
          import os, json, html, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI">
            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{html.escape(token, quote=True)}</fueloauth>
            </soapenv:Header>
            <soapenv:Body>
              <et:DefinitionRequestMsg>
                <et:DescribeRequests>
                  <et:ObjectDefinitionRequest>
                    <et:ObjectType>QueryDefinition</et:ObjectType>
                  </et:ObjectDefinitionRequest>
                </et:DescribeRequests>
              </et:DefinitionRequestMsg>
            </soapenv:Body>
          </soapenv:Envelope>"""

          req = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=UTF-8",
                  "SOAPAction": "Describe"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  raw = response.read()
          except urllib.error.HTTPError as exc:
              print(exc.read().decode("utf-8", errors="replace"))
              raise SystemExit(f"QueryDefinition Describe HTTP {exc.code}")

          Path = __import__("pathlib").Path
          Path("querydefinition-describe-response.xml").write_bytes(raw)

          root = ET.fromstring(raw)
          local = lambda tag: tag.split("}")[-1]
          properties = []

          for node in root.iter():
              if local(node.tag) != "Properties":
                  continue
              item = {}
              for child in list(node):
                  item[local(child.tag)] = (child.text or "").strip()
              if item.get("Name"):
                  properties.append(item)

          retrievable = [
              p for p in properties
              if (p.get("IsRetrievable") or "").lower() == "true"
          ]
          target_related = [
              p for p in retrievable
              if "target" in (p.get("Name") or "").lower()
              or "dataextension" in (p.get("Name") or "").lower()
          ]

          evidence = {
              "objectType": "QueryDefinition",
              "propertiesReturned": len(properties),
              "retrievableProperties": len(retrievable),
              "targetRelatedRetrievableProperties": target_related
          }
          Path("querydefinition-target-schema.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("")
          print("============================================")
          print("QUERYDEFINITION TARGET-DE SCHEMA")
          print("============================================")
          print("Properties returned:", len(properties))
          print("Retrievable properties:", len(retrievable))
          print("Target-related retrievable properties:")

          for p in target_related:
              print(
                  p.get("Name", ""),
                  "| Type:", p.get("DataType", ""),
                  "| Filterable:", p.get("IsFilterable", "")
              )

          if not target_related:
              raise SystemExit(
                  "SFMC Describe returned no retrievable target-related "
                  "QueryDefinition properties."
              )

          print("")
          print("RESULT: QUERYDEFINITION TARGET-DE SCHEMA DISCOVERED")
          print("============================================")
          PY


      # ============================================================
      # 9. PROGRAM DISCOVERY
      #
      # Official Installed Package SOAP access documentation:
      # Program = automation definition.
      #
      # This is an isolated discovery probe.
      # No Task/Activity relationship is inferred yet.
      # ============================================================
      - name: Discover Automation definition through Program
        id: program_discovery
        continue-on-error: true
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
          AUTOMATION_CUSTOMER_KEY: ${{ steps.automation.outputs.customer_key }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}

        run: |
          set -euo pipefail

          export ACCESS_TOKEN
          export SOAP_URL
          export AUTOMATION_CUSTOMER_KEY
          export AUTOMATION_NAME

          python3 <<'PY'
          import os
          import json
          import html
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          customer_key = os.environ["AUTOMATION_CUSTOMER_KEY"]
          automation_name = os.environ["AUTOMATION_NAME"]

          def esc(value):
              return html.escape(value or "", quote=True)

          properties = [
              "ObjectID",
              "CustomerKey",
              "Name",
              "Description",
              "Status",
              "IsActive",
              "CreatedDate",
              "ModifiedDate"
          ]

          props = "\n".join(
              f"<et:Properties>{p}</et:Properties>"
              for p in properties
          )

          body = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>

            <soapenv:Body>
              <et:RetrieveRequestMsg>
                <et:RetrieveRequest>

                  <et:ObjectType>Program</et:ObjectType>

                  {props}

                  <et:Filter xsi:type="et:SimpleFilterPart">
                    <et:Property>CustomerKey</et:Property>
                    <et:SimpleOperator>equals</et:SimpleOperator>
                    <et:Value>{esc(customer_key)}</et:Value>
                  </et:Filter>

                </et:RetrieveRequest>
              </et:RetrieveRequestMsg>
            </soapenv:Body>

          </soapenv:Envelope>
          """

          request = urllib.request.Request(
              soap_url + "/Service.asmx",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type":
                      "text/xml; charset=UTF-8",
                  "SOAPAction":
                      "Retrieve"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  request
              ) as response:

                  xml_data = response.read()

          except urllib.error.HTTPError as exc:

              response_text = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(response_text)

              raise SystemExit(
                  f"Program Retrieve HTTP {exc.code}"
              )

          with open(
              "program-retrieve-response.xml",
              "wb"
          ) as f:
              f.write(xml_data)

          root = ET.fromstring(xml_data)

          overall = ""
          request_id = ""
          results = []

          for element in root.iter():

              local = element.tag.split("}")[-1]

              if local == "OverallStatus":

                  overall = (
                      element.text or ""
                  ).strip()

              elif local == "RequestID":

                  request_id = (
                      element.text or ""
                  ).strip()

              elif local == "Results":

                  current = {}

                  for child in list(element):

                      key = child.tag.split("}")[-1]

                      if len(list(child)) == 0:

                          current[key] = (
                              child.text or ""
                          ).strip()

                  if current:
                      results.append(current)

          print("")
          print("============================================")
          print("PROGRAM DISCOVERY")
          print("============================================")
          print("SOAP Status:", overall)
          print("CustomerKey:", customer_key)
          print("Results returned:", len(results))
          print("============================================")

          if overall not in (
              "OK",
              "MoreDataAvailable"
          ):

              result = {
                  "status":
                      "SOAP_ERROR",

                  "soapStatus":
                      overall,

                  "customerKey":
                      customer_key,

                  "requestId":
                      request_id,

                  "results":
                      results
              }

              with open(
                  "program-discovery.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:

                  f.write(
                      "discovery_status=SOAP_ERROR\n"
                  )

                  f.write(
                      "program_count=0\n"
                  )

              print("")
              print(
                  "Program Retrieve was not accepted "
                  "successfully by SFMC."
              )

              raise SystemExit(1)

          exact = [
              item
              for item in results
              if item.get("CustomerKey") == customer_key
          ]

          if len(exact) == 0:

              result = {
                  "status":
                      "NOT_RETURNED",

                  "soapStatus":
                      overall,

                  "customerKey":
                      customer_key,

                  "requestId":
                      request_id,

                  "results":
                      results
              }

              with open(
                  "program-discovery.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a"
              ) as f:

                  f.write(
                      "discovery_status=NOT_RETURNED\n"
                  )

                  f.write(
                      "program_count=0\n"
                  )

              print("")
              print(
                  "SFMC accepted Program Retrieve, "
                  "but no matching Program was returned."
              )

              raise SystemExit(1)

          if len(exact) > 1:

              raise SystemExit(
                  "More than one Program returned for "
                  "the Automation CustomerKey."
              )

          program = exact[0]

          returned_name = program.get(
              "Name",
              ""
          )

          returned_key = program.get(
              "CustomerKey",
              ""
          )

          returned_object_id = program.get(
              "ObjectID",
              ""
          )

          print("")
          print("PROGRAM FOUND")
          print("Name:", returned_name)
          print("CustomerKey:", returned_key)
