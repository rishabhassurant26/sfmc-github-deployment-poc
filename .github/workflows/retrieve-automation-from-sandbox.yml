      # ============================================================
      - name: Retrieve Activities for resolved Tasks
        id: activity_retrieve
        continue-on-error: true
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN
          export SOAP_URL

          python3 <<'PY'
          import os
          import json
          import html
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")

          if not os.path.exists("task-discovery.json"):
              raise SystemExit(
                  "task-discovery.json is unavailable; "
                  "Activity retrieval will not guess a Task."
              )

          with open(
              "task-discovery.json",
              encoding="utf-8"
          ) as f:
