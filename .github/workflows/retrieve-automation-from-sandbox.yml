      # ============================================================
      # 17. DISCOVER NESTED SCHEDULE DETAILS THROUGH PARENTS
      #
      # Schedule.ID is live-proven on Program. Its returned value for
      # the current Automation is 0; this code does not interpret 0.
      #
      # Standalone ScheduleDefinition Describe is NOT repeated.
      # Candidate nested properties are tested independently through
      # Program and Automation so one unsupported property cannot hide
      # evidence from the other checks.
      # ============================================================
      - name: Discover nested Schedule details through parent objects
        id: nested_schedule
        continue-on-error: true
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_URL: ${{ steps.auth.outputs.soap_url }}
          PROGRAM_OBJECT_ID: ${{ steps.program_discovery.outputs.program_object_id }}
          AUTOMATION_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          export ACCESS_TOKEN SOAP_URL PROGRAM_OBJECT_ID AUTOMATION_NAME

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          token = os.environ["ACCESS_TOKEN"]
          soap_url = os.environ["SOAP_URL"].rstrip("/")
          program_object_id = (os.environ.get("PROGRAM_OBJECT_ID", "") or "").strip()
          automation_name = (os.environ.get("AUTOMATION_NAME", "") or "").strip()

          if not program_object_id:
              raise SystemExit("Resolved Program ObjectID is unavailable.")
          if not automation_name:
              raise SystemExit("Automation name is unavailable.")

          candidates = [
              "Schedule.ID",
              "Schedule.StartDateTime",
              "Schedule.EndDateTime",
              "Schedule.RecurrenceType",
              "Schedule.RecurrenceRangeType",
              "Schedule.Occurrences",
              "Schedule.TimeZone",
              "Schedule.Recurrence"
          ]

          xsi_ns = "http://www.w3.org/2001/XMLSchema-instance"

          def local_name(tag):
              return tag.split("}")[-1]

          def retrieve(object_type, filter_property, filter_value, property_name):
              body = f"""<?xml version="1.0" encoding="UTF-8"?>
              <soapenv:Envelope
                xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                xmlns:et="http://exacttarget.com/wsdl/partnerAPI"
                xmlns:xsi="{xsi_ns}">
                <soapenv:Header>
                  <fueloauth xmlns="http://exacttarget.com">{escape(token)}</fueloauth>
                </soapenv:Header>
                <soapenv:Body>
                  <et:RetrieveRequestMsg>
                    <et:RetrieveRequest>
                      <et:ObjectType>{object_type}</et:ObjectType>
                      <et:Properties>ObjectID</et:Properties>
                      <et:Properties>{property_name}</et:Properties>
                      <et:Filter xsi:type="et:SimpleFilterPart">
                        <et:Property>{filter_property}</et:Property>
                        <et:SimpleOperator>equals</et:SimpleOperator>
                        <et:Value>{escape(filter_value)}</et:Value>
                      </et:Filter>
                    </et:RetrieveRequest>
                  </et:RetrieveRequestMsg>
                </soapenv:Body>
              </soapenv:Envelope>
              """

              req = urllib.request.Request(
                  soap_url + "/Service.asmx",
                  data=body.encode("utf-8"),
                  headers={
                      "Content-Type": "text/xml; charset=UTF-8",
                      "SOAPAction": "Retrieve"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      raw = response.read()
                  http_status = 200
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  http_status = exc.code

              root = ET.fromstring(raw)
              overall = ""
              error_message = ""
              results = []

              for element in root.iter():
                  lname = local_name(element.tag)

                  if lname == "OverallStatus":
                      overall = (element.text or "").strip()
                  elif lname in ("StatusMessage", "ErrorMessage"):
                      value = (element.text or "").strip()
                      if value:
                          error_message = value
                  elif lname == "Results":
                      item = {"ObjectID": "", "Schedule": {}}

                      for child in list(element):
                          cname = local_name(child.tag)

                          if cname == "ObjectID":
                              item["ObjectID"] = (child.text or "").strip()
                          elif cname == "Schedule":
                              for nested in list(child):
                                  nname = local_name(nested.tag)
                                  if list(nested):
                                      item["Schedule"][nname] = {
                                          local_name(grand.tag):
                                              (grand.text or "").strip()
                                          for grand in list(nested)
                                      }
                                  else:
                                      item["Schedule"][nname] = (
                                          nested.text or ""
                                      ).strip()

                      if item["ObjectID"] or item["Schedule"]:
                          results.append(item)

              return {
                  "httpStatus": http_status,
                  "soapStatus": overall,
                  "errorMessage": error_message,
                  "results": results,
                  "raw": raw
              }

          parents = [
              ("Program", "ObjectID", program_object_id),
              ("Automation", "Name", automation_name)
          ]

          evidence = {
              "status": "",
              "programObjectId": program_object_id,
              "automationName": automation_name,
              "parents": {}
          }

          supported_checks = 0
          value_checks = 0

          print("")
          print("============================================")
          print("NESTED SCHEDULE PROPERTY DISCOVERY")
          print("============================================")

          for object_type, filter_property, filter_value in parents:
              print("")
              print(object_type)
              print("--------------------------------------------")

              entries = []

              for index, property_name in enumerate(candidates, start=1):
                  result = retrieve(
                      object_type,
                      filter_property,
                      filter_value,
                      property_name
                  )

                  raw_name = (
                      f"nested-schedule-{object_type.lower()}-{index}.xml"
                  )
                  with open(raw_name, "wb") as f:
                      f.write(result["raw"])

                  supported = (
                      result["httpStatus"] == 200
                      and result["soapStatus"] in ("OK", "MoreDataAvailable")
                  )

                  returned_schedule = {}
                  if result["results"]:
                      returned_schedule = (
                          result["results"][0].get("Schedule", {}) or {}
                      )

                  leaf = property_name.split(".", 1)[1]
                  value = returned_schedule.get(leaf)

                  if supported:
                      supported_checks += 1
                  if value not in (None, "", {}):
                      value_checks += 1

                  entries.append({
                      "property": property_name,
                      "supported": supported,
                      "httpStatus": result["httpStatus"],
                      "soapStatus": result["soapStatus"],
                      "errorMessage": result["errorMessage"],
                      "returnedSchedule": returned_schedule
                  })

                  print(
                      property_name,
                      "| Supported:", supported,
                      "| SOAP:", result["soapStatus"] or "[blank]",
                      "| Value:",
                      value if value not in (None, "") else "[not returned]"
                  )

                  if result["errorMessage"]:
                      print("  Error:", result["errorMessage"])

              evidence["parents"][object_type] = {
                  "filterProperty": filter_property,
                  "properties": entries
              }

          evidence["supportedPropertyChecks"] = supported_checks
          evidence["returnedValueChecks"] = value_checks
          evidence["status"] = "NESTED_SCHEDULE_DISCOVERY_COMPLETE"

          with open(
              "nested-schedule-discovery.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(evidence, f, indent=2, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("discovery_status=NESTED_SCHEDULE_DISCOVERY_COMPLETE\n")
              f.write(f"supported_checks={supported_checks}\n")
              f.write(f"returned_value_checks={value_checks}\n")

          print("")
          print("RESULT: NESTED SCHEDULE PROPERTY DISCOVERY COMPLETE")
          print("Supported property checks:", supported_checks)
          print("Checks returning a non-empty value:", value_checks)
          print("============================================")
          PY


