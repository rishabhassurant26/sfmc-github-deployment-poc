              f.write(
                  "discovery_status=PROGRAM_RESOLVED\n"
              )

              f.write(
                  "program_count=1\n"
              )

              f.write(
                  "program_object_id="
                  + returned_object_id
                  + "\n"
              )

          print("")
          print("RESULT: PROGRAM RESOLVED")
          print(
              "Automation CustomerKey -> Program "
              "cross-check passed."
          )
          print(
              "No Task or Activity relationship "
              "has been guessed."
          )
          print("============================================")

          PY


      # ============================================================
