name: Retrieve SFMC Assets from Sandbox

on:
  push:
    branches: [sandbox]
    paths:
      - "sfmc-assets/**"
      - "config/lob-config.json"
      - ".github/workflows/retrieve-from-sandbox.yml"
  workflow_dispatch:
    inputs:
      customer_key:
        description: "SFMC Data Extension Customer Key"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sfmc-sandbox-retrieval
  cancel-in-progress: false

jobs:
  validate-sandbox-push:
    name: Validate Sandbox Metadata on Push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pushed Sandbox commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Sandbox configuration and all tracked DE definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYVALIDATE'
          import json
          import pathlib
          import sys

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          try:
              config = json.loads(pathlib.Path('config/lob-config.json').read_text())
          except (OSError, ValueError) as exc:
              fail(f'Cannot read valid configuration: {exc}')

          def safe_part(value, label):
              if not isinstance(value, str) or not value or value in ('.', '..') or '/' in value or chr(92) in value or '..' in value:
                  fail(f'Invalid {label}: {value!r}')
              return value

          lob = safe_part(config.get('lineOfBusiness'), 'lineOfBusiness')
          root = safe_part(config.get('assetRoot'), 'assetRoot')
          de_cfg = config.get('assetTypes', {}).get('dataExtensions', {})
          if de_cfg.get('enabled') is not True:
              fail('Data Extension asset type is disabled')
          directory = safe_part(de_cfg.get('directory'), 'dataExtensions.directory')
          mid = config.get('environments', {}).get('sandbox', {}).get('businessUnitMid')
          if not str(mid or '').isdigit():
              fail('Sandbox MID missing or invalid')
          base = pathlib.Path(root, lob, directory)
          if not base.is_dir():
              fail(f'Data Extension asset directory not found: {base}')

          definitions = sorted(base.glob('*/definition.json'))
          if not definitions:
              fail(f'No approved Data Extension definitions found in {base}')

          for path in definitions:
              if path.is_symlink() or path.parent.is_symlink():
                  fail(f'Symlink is not permitted: {path}')
              try:
                  asset = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError) as exc:
                  fail(f'Invalid JSON {path}: {exc}')
              if asset.get('assetType') != 'DataExtension':
                  fail(f'Invalid assetType: {path}')
              if not isinstance(asset.get('customerKey'), str) or asset['customerKey'] != path.parent.name:
                  fail(f'CustomerKey does not match asset directory: {path}')
              if not isinstance(asset.get('name'), str) or not asset['name'].strip():
                  fail(f'Data Extension name missing: {path}')
              fields = asset.get('fields')
              if not isinstance(fields, list) or not fields:
                  fail(f'Fields must be a nonempty array: {path}')
              seen = set()
              for field in fields:
                  if not isinstance(field, dict) or not isinstance(field.get('name'), str) or not field['name'].strip():
                      fail(f'Field name missing: {path}')
                  if field['name'].lower() in seen:
                      fail(f'Duplicate field name {field["name"]}: {path}')
                  seen.add(field['name'].lower())
                  if not isinstance(field.get('fieldType'), str) or not field['fieldType']:
                      fail(f'FieldType missing for {field["name"]}: {path}')
                  for flag in ('isPrimaryKey', 'isRequired'):
                      if not isinstance(field.get(flag), bool):
                          fail(f'{flag} must be boolean for {field["name"]}: {path}')
              print(f'PASS {asset["customerKey"]} ({len(fields)} fields)')
          print(f'Validated {len(definitions)} Sandbox DE definition(s).')
          PYVALIDATE

  verify-sandbox-sync:
    name: Verify GitHub metadata matches SFMC Sandbox
    needs: [validate-sandbox-push]
    if: github.event_name == 'push' && needs.validate-sandbox-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout validated sandbox commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare all approved DE definitions with live Sandbox (read-only)
        shell: bash
        env:
          SFMC_AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 <<'PYSYNC'
          import html
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def fail(message):
              print(f'::error::{message}')
              sys.exit(1)

          config = json.loads(Path('config/lob-config.json').read_text())
          root = Path(config['assetRoot'], config['lineOfBusiness'],
                      config['assetTypes']['dataExtensions']['directory'])
          mid = str(config['environments']['sandbox']['businessUnitMid'])
          definitions = sorted(root.glob('*/definition.json'))
          if not definitions:
              fail('No approved DE definitions available to verify')
          for key in ('SFMC_AUTH_BASE_URI', 'SFMC_CLIENT_ID', 'SFMC_CLIENT_SECRET'):
              if not os.getenv(key):
                  fail(f'Missing GitHub secret: {key}')
          base = os.environ['SFMC_AUTH_BASE_URI'].rstrip('/')
          if not base.startswith('https://'):
              fail('SFMC_AUTH_BASE_URI must use HTTPS')
          body = json.dumps({'grant_type':'client_credentials',
                             'client_id':os.environ['SFMC_CLIENT_ID'],
                             'client_secret':os.environ['SFMC_CLIENT_SECRET'],
                             'account_id':int(mid)}).encode()
          request = urllib.request.Request(base + '/v2/token', body,
                      {'Content-Type':'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  auth = json.load(response)
          except (urllib.error.URLError, ValueError) as exc:
              fail(f'Sandbox authentication failed ({type(exc).__name__}); check credentials and API access')
          token = auth.get('access_token')
          soap_base = auth.get('soap_instance_url', '').rstrip('/')
          if not token or not soap_base.startswith('https://'):
              fail('SFMC OAuth response lacks valid token or SOAP endpoint')
          print('::add-mask::' + token)
          API = 'http://exacttarget.com/wsdl/partnerAPI'
          SOAP = 'http://schemas.xmlsoap.org/soap/envelope/'
          XSI = 'http://www.w3.org/2001/XMLSchema-instance'
          def esc(value):
              return html.escape(str(value), quote=True)
          def soap(action, content):
              envelope = (f'<soap:Envelope xmlns:soap="{SOAP}" xmlns:xsi="{XSI}">'
                          f'<soap:Header><fueloauth xmlns="{API}">{esc(token)}</fueloauth></soap:Header>'
                          f'<soap:Body>{content}</soap:Body></soap:Envelope>').encode()
              request = urllib.request.Request(soap_base + '/Service.asmx', envelope,
                  {'Content-Type':'text/xml; charset=UTF-8', 'SOAPAction':f'"{action}"'}, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = ET.fromstring(response.read())
              except (urllib.error.URLError, ET.ParseError) as exc:
                  raise RuntimeError(f'SFMC SOAP {action} failed ({type(exc).__name__})') from exc
              if any(node.tag.split('}')[-1] == 'Fault' for node in result.iter()):
                  raise RuntimeError(f'SFMC SOAP {action} returned a fault')
              status = next((n.text for n in result.iter() if n.tag.split('}')[-1]=='OverallStatus'), None)
              if status != 'OK':
                  raise RuntimeError(f'SFMC SOAP {action} unexpected status: {status}')
              return result
          def value(node, name):
              return next((n.text for n in node if n.tag.split('}')[-1]==name), None)
          def results(root):
              return [n for n in root.iter() if n.tag.split('}')[-1]=='Results']
          def retrieve(obj, props, filter_property, key):
              xmlprops = ''.join(f'<Properties>{esc(p)}</Properties>' for p in props)
              content = (f'<RetrieveRequestMsg xmlns="{API}"><RetrieveRequest>'
                         f'<ObjectType>{obj}</ObjectType>{xmlprops}'
                         f'<Filter xsi:type="SimpleFilterPart"><Property>{filter_property}</Property>'
                         f'<SimpleOperator>equals</SimpleOperator><Value>{esc(key)}</Value>'
                         f'</Filter></RetrieveRequest></RetrieveRequestMsg>')
              return results(soap('Retrieve', content))
          desired_props = ['ObjectID','Name','FieldType','MaxLength','IsPrimaryKey',
                           'IsRequired','DefaultValue','Ordinal','Precision','Scale']
          describe = soap('Describe', f'<DefinitionRequestMsg xmlns="{API}"><DescribeRequests>'
                                  '<ObjectDefinitionRequest><ObjectType>DataExtensionField</ObjectType>'
                                  '</ObjectDefinitionRequest></DescribeRequests></DefinitionRequestMsg>')
          supported = set()
          for node in describe.iter():
              if node.tag.split('}')[-1]=='Properties':
                  if (value(node,'IsRetrievable') or '').lower()=='true':
                      supported.add(value(node,'Name'))
          required = {'ObjectID','Name','FieldType','IsPrimaryKey','IsRequired','Ordinal'}
          if not required <= supported:
              fail('Sandbox API does not expose required DE field properties: ' + ', '.join(sorted(required-supported)))
          props = [p for p in desired_props if p in supported]
          def boolean(v): return (v or '').lower()=='true'
          def integer(v): return None if v in (None,'') else int(v)
          def normalize_field(f):
              return {k:f.get(k) for k in ('name','fieldType','maxLength','isPrimaryKey',
                                            'isRequired','defaultValue','ordinal','precision','scale')}
          mismatches = []
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Sandbox metadata synchronization verification (read-only)\n\n')
              summary.write(f'Sandbox BU MID: `{mid}`\n\n| Customer Key | Result |\n|---|---|\n')
              for path in definitions:
                  desired = json.loads(path.read_text())
                  key = desired['customerKey']
                  try:
                      found = retrieve('DataExtension', ['ObjectID','CustomerKey','Name','Description',
                                      'IsSendable','IsTestable'], 'CustomerKey', key)
                      found = [r for r in found if value(r,'CustomerKey')==key]
                      if len(found)!=1:
                          raise RuntimeError('Missing or ambiguous DE in Sandbox')
                      de = found[0]
                      fields = retrieve('DataExtensionField', props, 'DataExtension.CustomerKey', key)
                      actual_fields = []
                      for f in fields:
                          actual_fields.append({'name':value(f,'Name'), 'fieldType':value(f,'FieldType'),
                              'maxLength':integer(value(f,'MaxLength')),
                              'isPrimaryKey':boolean(value(f,'IsPrimaryKey')),
                              'isRequired':boolean(value(f,'IsRequired')),
                              'defaultValue':value(f,'DefaultValue'),
                              'ordinal':integer(value(f,'Ordinal')),
                              'precision':integer(value(f,'Precision')),
                              'scale':integer(value(f,'Scale'))})
                      def sort_fields(items):
                          return sorted(items, key=lambda f:(f['ordinal'] is None,
                                          f['ordinal'] if f['ordinal'] is not None else 0,f['name']))
                      expected_fields = []
                      for i, f in enumerate(desired['fields']):
                          field = normalize_field(f)
                          field['ordinal'] = f.get('ordinal',i)
                          field['isPrimaryKey'] = bool(f.get('isPrimaryKey',False))
                          field['isRequired'] = bool(f.get('isRequired',False))
                          expected_fields.append(field)
                      expected = {'name':desired['name'], 'description':desired.get('description') or '',
                                  'isSendable':bool(desired.get('isSendable',False)),
                                  'isTestable':bool(desired.get('isTestable',False)),
                                  'fields':sort_fields(expected_fields)}
                      actual = {'name':value(de,'Name'), 'description':value(de,'Description') or '',
                                'isSendable':boolean(value(de,'IsSendable')),
                                'isTestable':boolean(value(de,'IsTestable')),
                                'fields':sort_fields(actual_fields)}
                      if actual != expected:
                          raise RuntimeError('Metadata differs from GitHub sandbox definition')
                      print(f'PASS: {key} matches Sandbox')
                      summary.write(f'| `{key}` | PASS |\n')
                  except Exception as exc:
                      mismatches.append(key)
                      print(f'::error::{key}: {exc}')
                      summary.write(f'| `{key}` | FAIL: {str(exc).replace("|","/")} |\n')
              summary.write('\nNo Sandbox assets or GitHub definitions were modified.\n')
          if mismatches:
              fail(f'{len(mismatches)} DE(s) differ from Sandbox or could not be verified. Review before merging to main.')
          print(f'All {len(definitions)} tracked DEs match SFMC Sandbox')
          PYSYNC

  retrieve-from-sandbox:
    if: github.event_name == 'workflow_dispatch' 
    name: Retrieve Sandbox Asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sandbox branch
        uses: actions/checkout@v6
        with:
          ref: sandbox
          fetch-depth: 0

      - name: Validate configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="config/lob-config.json"

          [ -f "$CONFIG_FILE" ] || {
            echo "::error::Configuration file not found: $CONFIG_FILE"
            exit 1
          }

          LOB="$(jq -r '.lineOfBusiness // empty' "$CONFIG_FILE")"
          ASSET_ROOT="$(jq -r '.assetRoot // empty' "$CONFIG_FILE")"
          SANDBOX_MID="$(jq -r '.environments.sandbox.businessUnitMid // empty' "$CONFIG_FILE")"
          DE_ENABLED="$(jq -r '.assetTypes.dataExtensions.enabled // false' "$CONFIG_FILE")"
          DE_DIRECTORY="$(jq -r '.assetTypes.dataExtensions.directory // empty' "$CONFIG_FILE")"

          [ -n "$LOB" ] || {
            echo "::error::lineOfBusiness is missing."
            exit 1
          }

          [ -n "$ASSET_ROOT" ] || {
            echo "::error::assetRoot is missing."
            exit 1
          }

          [ -n "$SANDBOX_MID" ] || {
            echo "::error::Sandbox Business Unit MID is missing."
            exit 1
          }

          [[ "$SANDBOX_MID" =~ ^[0-9]+$ ]] || {
            echo "::error::Sandbox Business Unit MID must be numeric."
            exit 1
          }

          [ "$DE_ENABLED" = "true" ] || {
            echo "::error::Data Extension retrieval is disabled."
            exit 1
          }

          [ -n "$DE_DIRECTORY" ] || {
            echo "::error::Data Extension directory is missing."
            exit 1
          }

          for VALUE in "$LOB" "$ASSET_ROOT" "$DE_DIRECTORY"; do
            if [[ "$VALUE" == /* || "$VALUE" == *".."* || "$VALUE" == *"\\"* ]]; then
              echo "::error::Unsafe repository path value: $VALUE"
              exit 1
            fi
          done

          echo "lob=$LOB" >> "$GITHUB_OUTPUT"
          echo "asset_root=$ASSET_ROOT" >> "$GITHUB_OUTPUT"
          echo "sandbox_mid=$SANDBOX_MID" >> "$GITHUB_OUTPUT"
          echo "de_directory=$DE_DIRECTORY" >> "$GITHUB_OUTPUT"

          echo "Configuration validated."

      - name: Validate workflow input
        id: input
        shell: bash
        env:
          RAW_CUSTOMER_KEY: ${{ inputs.customer_key }}
        run: |
          set -euo pipefail

          CUSTOMER_KEY="$(printf '%s' "$RAW_CUSTOMER_KEY" | xargs)"

          [ -n "$CUSTOMER_KEY" ] || {
            echo "::error::Customer Key cannot be empty."
            exit 1
          }

          if [[ "$CUSTOMER_KEY" == *"/"* || "$CUSTOMER_KEY" == *"\\"* ]]; then
            echo "::error::Customer Key cannot contain path separators."
            exit 1
          fi

          if [[ "$CUSTOMER_KEY" == "." || "$CUSTOMER_KEY" == ".." ]]; then
            echo "::error::Invalid Customer Key."
            exit 1
          fi

          if [[ "$CUSTOMER_KEY" =~ [[:cntrl:]] ]]; then
            echo "::error::Customer Key contains control characters."
            exit 1
          fi

          echo "customer_key=$CUSTOMER_KEY" >> "$GITHUB_OUTPUT"

          echo "Customer Key validated."

      - name: Validate GitHub secrets
        shell: bash
        env:
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SFMC_AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
        run: |
          set -euo pipefail

          [ -n "$SFMC_CLIENT_ID" ] || {
            echo "::error::SFMC_CLIENT_ID is missing."
            exit 1
          }

          [ -n "$SFMC_CLIENT_SECRET" ] || {
            echo "::error::SFMC_CLIENT_SECRET is missing."
            exit 1
          }

          [ -n "$SFMC_AUTH_BASE_URI" ] || {
            echo "::error::SFMC_AUTH_BASE_URI is missing."
            exit 1
          }

          case "$SFMC_AUTH_BASE_URI" in
            https://*) ;;
            *)
              echo "::error::SFMC_AUTH_BASE_URI must use HTTPS."
              exit 1
              ;;
          esac

          echo "Required GitHub secrets validated."

      - name: Authenticate to SFMC Sandbox
        id: auth
        shell: bash
        env:
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SFMC_AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
        run: |
          set -euo pipefail

          AUTH_BASE_URI="${SFMC_AUTH_BASE_URI%/}"
          TOKEN_ENDPOINT="${AUTH_BASE_URI}/v2/token"

          REQUEST_BODY="$(
            jq -n \
              --arg client_id "$SFMC_CLIENT_ID" \
              --arg client_secret "$SFMC_CLIENT_SECRET" \
              --argjson account_id "$SANDBOX_MID" \
              '{
                grant_type: "client_credentials",
                client_id: $client_id,
                client_secret: $client_secret,
                account_id: $account_id
              }'
          )"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output token-response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$REQUEST_BODY" \
              "$TOKEN_ENDPOINT"
          )"

          if [ "$HTTP_STATUS" != "200" ]; then
            ERROR_MESSAGE="$(
              jq -r \
                '.message // .error_description // .error // "Unknown authentication error"' \
                token-response.json 2>/dev/null || true
            )"

            echo "::error::SFMC authentication failed. HTTP $HTTP_STATUS"
            echo "::error::$ERROR_MESSAGE"

            rm -f token-response.json
            exit 1
          fi

          ACCESS_TOKEN="$(jq -r '.access_token // empty' token-response.json)"
          REST_INSTANCE_URL="$(jq -r '.rest_instance_url // empty' token-response.json)"
          SOAP_INSTANCE_URL="$(jq -r '.soap_instance_url // empty' token-response.json)"
          EXPIRES_IN="$(jq -r '.expires_in // empty' token-response.json)"

          [ -n "$ACCESS_TOKEN" ] || {
            echo "::error::access_token missing from SFMC response."
            rm -f token-response.json
            exit 1
          }

          [ -n "$SOAP_INSTANCE_URL" ] || {
            echo "::error::soap_instance_url missing from SFMC response."
            rm -f token-response.json
            exit 1
          }

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REST_INSTANCE_URL"
          echo "::add-mask::$SOAP_INSTANCE_URL"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "rest_instance_url=$REST_INSTANCE_URL" >> "$GITHUB_OUTPUT"
          echo "soap_instance_url=$SOAP_INSTANCE_URL" >> "$GITHUB_OUTPUT"
          echo "expires_in=$EXPIRES_IN" >> "$GITHUB_OUTPUT"

          rm -f token-response.json

          echo "SFMC Sandbox authentication successful."

      - name: Retrieve Data Extension metadata
        id: metadata
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_INSTANCE_URL: ${{ steps.auth.outputs.soap_instance_url }}
          CUSTOMER_KEY: ${{ steps.input.outputs.customer_key }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import os

          token = html.escape(os.environ["ACCESS_TOKEN"])
          key = html.escape(os.environ["CUSTOMER_KEY"])

          envelope = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>
            <soapenv:Body>
              <RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">
                <RetrieveRequest>
                  <ObjectType>DataExtension</ObjectType>
                  <Properties>ObjectID</Properties>
                  <Properties>CustomerKey</Properties>
                  <Properties>Name</Properties>
                  <Properties>Description</Properties>
                  <Properties>IsSendable</Properties>
                  <Properties>IsTestable</Properties>
                  <Properties>CategoryID</Properties>
                  <Filter xsi:type="SimpleFilterPart">
                    <Property>CustomerKey</Property>
                    <SimpleOperator>equals</SimpleOperator>
                    <Value>{key}</Value>
                  </Filter>
                </RetrieveRequest>
              </RetrieveRequestMsg>
            </soapenv:Body>
          </soapenv:Envelope>
          """

          with open("de-metadata-request.xml", "w", encoding="utf-8") as f:
              f.write(envelope)
          PY

          SOAP_ENDPOINT="${SOAP_INSTANCE_URL%/}/Service.asmx"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output de-metadata-response.xml \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: text/xml; charset=UTF-8" \
              --header 'SOAPAction: "Retrieve"' \
              --data-binary @de-metadata-request.xml \
              "$SOAP_ENDPOINT"
          )"

          rm -f de-metadata-request.xml

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Data Extension metadata retrieval failed. HTTP $HTTP_STATUS"
            rm -f de-metadata-response.xml
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET

          ns = {
              "soap": "http://schemas.xmlsoap.org/soap/envelope/",
              "et": "http://exacttarget.com/wsdl/partnerAPI",
          }

          try:
              root = ET.parse("de-metadata-response.xml").getroot()
          except ET.ParseError as exc:
              print(f"::error::Invalid metadata SOAP response: {exc}")
              sys.exit(1)

          fault = root.find(".//soap:Fault", ns)
          if fault is not None:
              fault_string = fault.find("faultstring")
              message = (
                  fault_string.text
                  if fault_string is not None and fault_string.text
                  else "Unknown SOAP fault"
              )
              print(f"::error::SFMC SOAP fault: {message}")
              sys.exit(1)

          status = root.find(".//et:OverallStatus", ns)
          if status is not None and status.text not in (
              "OK",
              "MoreDataAvailable",
              "Has More Rows",
          ):
              print(f"::error::SFMC retrieve status: {status.text}")
              sys.exit(1)

          results = root.findall(".//et:Results", ns)
          requested_key = os.environ["CUSTOMER_KEY"]

          if len(results) == 0:
              print(
                  "::error::No Data Extension found in Sandbox "
                  f"with Customer Key '{requested_key}'."
              )
              sys.exit(1)

          if len(results) > 1:
              print(
                  "::error::Multiple Data Extensions returned for "
                  f"Customer Key '{requested_key}'."
              )
              sys.exit(1)

          result = results[0]

          def value(name):
              node = result.find(f"et:{name}", ns)
              return node.text if node is not None and node.text is not None else None

          returned_key = value("CustomerKey")

          if returned_key != requested_key:
              print(
                  "::error::Returned CustomerKey doesn't match "
                  "requested CustomerKey."
              )
              sys.exit(1)

          metadata = {
              "objectId": value("ObjectID"),
              "customerKey": returned_key,
              "name": value("Name"),
              "description": value("Description") or "",
              "isSendable": (value("IsSendable") or "").lower() == "true",
              "isTestable": (value("IsTestable") or "").lower() == "true",
          }

          if not metadata["objectId"] or not metadata["name"]:
              print("::error::Incomplete Data Extension metadata returned.")
              sys.exit(1)

          with open("de-metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2, ensure_ascii=False)

          print(
              f"Found Data Extension: {metadata['name']} "
              f"({metadata['customerKey']})"
          )
          PY

          rm -f de-metadata-response.xml

      - name: Describe DataExtensionField
        id: describe_fields
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_INSTANCE_URL: ${{ steps.auth.outputs.soap_instance_url }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import os

          token = html.escape(os.environ["ACCESS_TOKEN"])

          envelope = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/">
            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>
            <soapenv:Body>
              <DefinitionRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">
                <DescribeRequests>
                  <ObjectDefinitionRequest>
                    <ObjectType>DataExtensionField</ObjectType>
                  </ObjectDefinitionRequest>
                </DescribeRequests>
              </DefinitionRequestMsg>
            </soapenv:Body>
          </soapenv:Envelope>
          """

          with open("describe-fields-request.xml", "w", encoding="utf-8") as f:
              f.write(envelope)
          PY

          SOAP_ENDPOINT="${SOAP_INSTANCE_URL%/}/Service.asmx"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output describe-fields-response.xml \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: text/xml; charset=UTF-8" \
              --header 'SOAPAction: "Describe"' \
              --data-binary @describe-fields-request.xml \
              "$SOAP_ENDPOINT"
          )"

          rm -f describe-fields-request.xml

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::DataExtensionField Describe failed. HTTP $HTTP_STATUS"
            rm -f describe-fields-response.xml
            exit 1
          fi

          python3 <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET

          ns = {
              "soap": "http://schemas.xmlsoap.org/soap/envelope/",
              "et": "http://exacttarget.com/wsdl/partnerAPI",
          }

          try:
              root = ET.parse("describe-fields-response.xml").getroot()
          except ET.ParseError as exc:
              print(f"::error::Invalid Describe SOAP response: {exc}")
              sys.exit(1)

          fault = root.find(".//soap:Fault", ns)

          if fault is not None:
              fault_string = fault.find("faultstring")
              message = (
                  fault_string.text
                  if fault_string is not None and fault_string.text
                  else "Unknown SOAP fault"
              )
              print(f"::error::SFMC Describe SOAP fault: {message}")
              sys.exit(1)

          property_nodes = root.findall(".//et:Properties", ns)

          if not property_nodes:
              print(
                  "::error::Describe returned no property definitions "
                  "for DataExtensionField."
              )
              sys.exit(1)

          retrievable = set()

          for prop in property_nodes:
              name_node = prop.find("et:Name", ns)
              retrievable_node = prop.find("et:IsRetrievable", ns)

              name = (
                  name_node.text
                  if name_node is not None and name_node.text
                  else None
              )

              is_retrievable = (
                  retrievable_node is not None
                  and (retrievable_node.text or "").lower() == "true"
              )

              if name and is_retrievable:
                  retrievable.add(name)

          if not retrievable:
              print(
                  "::error::Describe did not return any "
                  "IsRetrievable=true properties."
              )
              sys.exit(1)

          # These are the schema properties useful for the DE definition.
          # Only properties confirmed by Describe are used.
          candidates = [
              "ObjectID",
              "CustomerKey",
              "Name",
              "FieldType",
              "MaxLength",
              "IsPrimaryKey",
              "IsRequired",
              "DefaultValue",
              "Ordinal",
              "Precision",
              "Scale",
          ]

          selected = [
              property_name
              for property_name in candidates
              if property_name in retrievable
          ]

          # These are required for a deployable, ordered schema definition.
          required = [
              "Name",
              "FieldType",
              "IsPrimaryKey",
              "IsRequired",
              "Ordinal",
          ]

          missing_required = [
              property_name
              for property_name in required
              if property_name not in selected
          ]

          if missing_required:
              print(
                  "::error::Tenant Describe response does not mark "
                  "required DataExtensionField properties as retrievable: "
                  + ", ".join(missing_required)
              )
              sys.exit(1)

          with open(
              "retrievable-field-properties.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(selected, f, indent=2)

          print(
              "Tenant-supported DataExtensionField properties: "
              + ", ".join(selected)
          )
          PY

          rm -f describe-fields-response.xml

      - name: Retrieve Data Extension fields
        id: fields
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SOAP_INSTANCE_URL: ${{ steps.auth.outputs.soap_instance_url }}
          CUSTOMER_KEY: ${{ steps.input.outputs.customer_key }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import json
          import os

          with open(
              "retrievable-field-properties.json",
              encoding="utf-8",
          ) as f:
              properties = json.load(f)

          property_xml = "\n".join(
              f"<Properties>{html.escape(prop)}</Properties>"
              for prop in properties
          )

          token = html.escape(os.environ["ACCESS_TOKEN"])
          key = html.escape(os.environ["CUSTOMER_KEY"])

          envelope = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope
            xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{token}</fueloauth>
            </soapenv:Header>
            <soapenv:Body>
              <RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">
                <RetrieveRequest>
                  <ObjectType>DataExtensionField</ObjectType>
                  {property_xml}
                  <Filter xsi:type="SimpleFilterPart">
                    <Property>DataExtension.CustomerKey</Property>
                    <SimpleOperator>equals</SimpleOperator>
                    <Value>{key}</Value>
                  </Filter>
                </RetrieveRequest>
              </RetrieveRequestMsg>
            </soapenv:Body>
          </soapenv:Envelope>
          """

          with open("de-fields-request.xml", "w", encoding="utf-8") as f:
              f.write(envelope)
          PY

          SOAP_ENDPOINT="${SOAP_INSTANCE_URL%/}/Service.asmx"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output de-fields-response.xml \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: text/xml; charset=UTF-8" \
              --header 'SOAPAction: "Retrieve"' \
              --data-binary @de-fields-request.xml \
              "$SOAP_ENDPOINT"
          )"

          rm -f de-fields-request.xml

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Data Extension field retrieval failed. HTTP $HTTP_STATUS"
            rm -f de-fields-response.xml
            exit 1
          fi

          python3 <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET

          ns = {
              "soap": "http://schemas.xmlsoap.org/soap/envelope/",
              "et": "http://exacttarget.com/wsdl/partnerAPI",
          }

          try:
              root = ET.parse("de-fields-response.xml").getroot()
          except ET.ParseError as exc:
              print(f"::error::Invalid fields SOAP response: {exc}")
              sys.exit(1)

          fault = root.find(".//soap:Fault", ns)

          if fault is not None:
              fault_string = fault.find("faultstring")
              message = (
                  fault_string.text
                  if fault_string is not None and fault_string.text
                  else "Unknown SOAP fault"
              )
              print(f"::error::SFMC SOAP fault: {message}")
              sys.exit(1)

          status = root.find(".//et:OverallStatus", ns)

          if status is not None and status.text not in (
              "OK",
              "MoreDataAvailable",
              "Has More Rows",
          ):
              print(f"::error::SFMC field retrieve status: {status.text}")
              sys.exit(1)

          results = root.findall(".//et:Results", ns)

          if not results:
              print("::error::No fields returned for the Data Extension.")
              sys.exit(1)

          def text(result, name):
              node = result.find(f"et:{name}", ns)
              return node.text if node is not None and node.text is not None else None

          def boolean(value):
              return (value or "").lower() == "true"

          def integer(value):
              if value is None or value == "":
                  return None
              try:
                  return int(value)
              except ValueError:
                  return None

          fields = []

          for result in results:
              field = {
                  "name": text(result, "Name"),
                  "fieldType": text(result, "FieldType"),
                  "maxLength": integer(text(result, "MaxLength")),
                  "isPrimaryKey": boolean(text(result, "IsPrimaryKey")),
                  "isRequired": boolean(text(result, "IsRequired")),
                  "defaultValue": text(result, "DefaultValue"),
                  "ordinal": integer(text(result, "Ordinal")),
                  "precision": integer(text(result, "Precision")),
                  "scale": integer(text(result, "Scale")),
              }

              if not field["name"]:
                  print("::error::SFMC returned a field without Name.")
                  sys.exit(1)

              if not field["fieldType"]:
                  print(
                      f"::error::SFMC returned field '{field['name']}' "
                      "without FieldType."
                  )
                  sys.exit(1)

              fields.append(field)

          fields.sort(
              key=lambda field: (
                  field["ordinal"]
                  if field["ordinal"] is not None
                  else 999999,
                  field["name"],
              )
          )

          with open("de-fields.json", "w", encoding="utf-8") as f:
              json.dump(fields, f, indent=2, ensure_ascii=False)

          print(f"Retrieved {len(fields)} Data Extension field(s).")
          PY

          rm -f de-fields-response.xml
          rm -f retrievable-field-properties.json

      - name: Build normalized definition
        id: definition
        shell: bash
        env:
          LOB: ${{ steps.config.outputs.lob }}
          ASSET_ROOT: ${{ steps.config.outputs.asset_root }}
          DE_DIRECTORY: ${{ steps.config.outputs.de_directory }}
          CUSTOMER_KEY: ${{ steps.input.outputs.customer_key }}
        run: |
          set -euo pipefail

          TARGET_DIRECTORY="${ASSET_ROOT}/${LOB}/${DE_DIRECTORY}/${CUSTOMER_KEY}"
          TARGET_FILE="${TARGET_DIRECTORY}/definition.json"

          mkdir -p "$TARGET_DIRECTORY"

          python3 <<'PY'
          import json
          import os
          import sys

          with open("de-metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          with open("de-fields.json", encoding="utf-8") as f:
              fields = json.load(f)

          requested_key = os.environ["CUSTOMER_KEY"]

          if metadata.get("customerKey") != requested_key:
              print("::error::Metadata CustomerKey validation failed.")
              sys.exit(1)

          if not metadata.get("name"):
              print("::error::Data Extension Name is missing.")
              sys.exit(1)

          if not fields:
              print("::error::Data Extension contains no retrieved fields.")
              sys.exit(1)

          definition = {
              "assetType": "DataExtension",
              "name": metadata["name"],
              "customerKey": metadata["customerKey"],
              "description": metadata.get("description", ""),
              "isSendable": metadata.get("isSendable", False),
              "isTestable": metadata.get("isTestable", False),
              "fields": fields,
          }

          target_file = os.path.join(
              os.environ["ASSET_ROOT"],
              os.environ["LOB"],
              os.environ["DE_DIRECTORY"],
              requested_key,
              "definition.json",
          )

          with open(target_file, "w", encoding="utf-8") as f:
              json.dump(
                  definition,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")

          print(f"Normalized definition created: {target_file}")
          PY

          rm -f de-metadata.json
          rm -f de-fields.json

          echo "target_directory=$TARGET_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "target_file=$TARGET_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate generated definition
        shell: bash
        env:
          TARGET_FILE: ${{ steps.definition.outputs.target_file }}
          CUSTOMER_KEY: ${{ steps.input.outputs.customer_key }}
        run: |
          set -euo pipefail

          [ -f "$TARGET_FILE" ] || {
            echo "::error::Generated definition does not exist."
            exit 1
          }

          jq empty "$TARGET_FILE"

          GENERATED_TYPE="$(jq -r '.assetType // empty' "$TARGET_FILE")"
          GENERATED_KEY="$(jq -r '.customerKey // empty' "$TARGET_FILE")"
          GENERATED_NAME="$(jq -r '.name // empty' "$TARGET_FILE")"
          FIELD_COUNT="$(jq '.fields | length' "$TARGET_FILE")"

          [ "$GENERATED_TYPE" = "DataExtension" ] || {
            echo "::error::Invalid assetType in generated definition."
            exit 1
          }

          [ "$GENERATED_KEY" = "$CUSTOMER_KEY" ] || {
            echo "::error::Generated CustomerKey doesn't match requested CustomerKey."
            exit 1
          }

          [ -n "$GENERATED_NAME" ] || {
            echo "::error::Generated definition has no Data Extension name."
            exit 1
          }

          [ "$FIELD_COUNT" -gt 0 ] || {
            echo "::error::Generated definition contains no fields."
            exit 1
          }

          echo "Generated definition validation successful."

      - name: Detect repository changes
        id: changes
        shell: bash
        env:
          TARGET_DIRECTORY: ${{ steps.definition.outputs.target_directory }}
        run: |
          set -euo pipefail

          git add -- "$TARGET_DIRECTORY"

          if git diff --cached --quiet -- "$TARGET_DIRECTORY"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No asset changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Asset changes detected."
          fi

      - name: Commit retrieved asset to sandbox
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          CUSTOMER_KEY: ${{ steps.input.outputs.customer_key }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Sync SFMC Sandbox Data Extension: ${CUSTOMER_KEY}"

          git push origin HEAD:sandbox

          echo "Retrieved asset committed to sandbox."

      - name: Retrieval summary
        if: success()
        shell: bash
        env:
          LOB: ${{ steps.config.outputs.lob }}
          SANDBOX_MID: ${{ steps.config.outputs.sandbox_mid }}
          CUSTOMER_KEY: ${{ steps.input.outputs.customer_key }}
          TARGET_FILE: ${{ steps.definition.outputs.target_file }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          set -euo pipefail

          NAME="$(jq -r '.name' "$TARGET_FILE")"
          FIELD_COUNT="$(jq '.fields | length' "$TARGET_FILE")"

          if [ "$CHANGED" = "true" ]; then
            REPOSITORY_RESULT="Committed to sandbox"
          else
            REPOSITORY_RESULT="No change required"
          fi

          {
            echo "## SFMC Sandbox Retrieval"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | Sandbox |"
            echo "| Line of Business | \`$LOB\` |"
            echo "| Business Unit MID | \`$SANDBOX_MID\` |"
            echo "| Asset Type | Data Extension |"
            echo "| Customer Key | \`$CUSTOMER_KEY\` |"
            echo "| Data Extension | \`$NAME\` |"
            echo "| Fields Retrieved | $FIELD_COUNT |"
            echo "| Definition | \`$TARGET_FILE\` |"
            echo "| Repository Result | $REPOSITORY_RESULT |"
            echo "| Workflow Result | SUCCESS |"
          } >> "$GITHUB_STEP_SUMMARY"
