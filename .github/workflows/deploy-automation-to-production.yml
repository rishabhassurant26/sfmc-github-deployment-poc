name: Deploy SFMC Automation to Production

on:
  workflow_dispatch:
    inputs:
      automation_name:
        description: "Exact approved Automation directory/name from main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sfmc-production-automation-poc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate config and select definition
        id: config
        shell: bash
        env:
          INPUT_NAME: ${{ inputs.automation_name }}
        run: |
          set -euo pipefail

          CONFIG="config/lob-config.json"
          jq -e . "$CONFIG" >/dev/null

          LOB=$(jq -r '.lineOfBusiness // empty' "$CONFIG")
          ROOT=$(jq -r '.assetRoot // empty' "$CONFIG")
          MID=$(jq -r '.environments.production.businessUnitMid // empty' "$CONFIG")
          ENABLED=$(jq -r '.assetTypes.automations.enabled // false' "$CONFIG")
          DIR=$(jq -r '.assetTypes.automations.directory // empty' "$CONFIG")

          [ -n "$LOB" ] || { echo "::error::lineOfBusiness missing"; exit 1; }
          [ -n "$ROOT" ] || { echo "::error::assetRoot missing"; exit 1; }
          [[ "$MID" =~ ^[0-9]+$ ]] || { echo "::error::Production MID invalid"; exit 1; }
          [ "$ENABLED" = "true" ] || { echo "::error::Automations disabled in config"; exit 1; }
          [ -n "$DIR" ] || { echo "::error::Automation directory missing"; exit 1; }

          NAME="${INPUT_NAME}"
          if [ -z "$NAME" ] || [ "$NAME" = "." ] || [ "$NAME" = ".." ] || [[ "$NAME" == *"/"* ]] || [[ "$NAME" == *"\\"* ]]; then
            echo "::error::Invalid Automation name"
            exit 1
          fi

          AUTOMATION_ROOT="${ROOT}/${LOB}/${DIR}"
          [ -d "$AUTOMATION_ROOT" ] || {
            echo "::error::Automation root not found: $AUTOMATION_ROOT"
            exit 1
          }

          export AUTOMATION_ROOT NAME

          FILE=$(python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["AUTOMATION_ROOT"])
          requested_name = os.environ["NAME"]

          matches = []

          for definition in sorted(root.glob("*/definition.json")):
              try:
                  data = json.loads(definition.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(
                      f"Invalid JSON in {definition}: {exc}"
                  )

              automation = data.get("automation") or {}

              if automation.get("name") == requested_name:
                  matches.append(definition)

          if not matches:
              raise SystemExit(
                  "No approved Automation definition on main has exact "
                  f"automation.name={requested_name!r}"
              )

          if len(matches) > 1:
              raise SystemExit(
                  "Multiple approved Automation definitions have exact "
                  f"automation.name={requested_name!r}: "
                  + ", ".join(str(path) for path in matches)
              )

          print(matches[0])
          PY
          )

          [ -f "$FILE" ] || {
            echo "::error::Resolved definition not found: $FILE"
            exit 1
          }

          echo "Resolved approved Automation definition: $FILE"
          DE_DIR=$(jq -r '.assetTypes.dataExtensions.directory // empty' "$CONFIG")
          DE_ENABLED=$(jq -r '.assetTypes.dataExtensions.enabled // false' "$CONFIG")
          [ "$DE_ENABLED" = "true" ] || { echo "::error::Data Extensions disabled in config"; exit 1; }
          [ -n "$DE_DIR" ] || { echo "::error::Data Extension directory missing"; exit 1; }
          DE_ROOT="${ROOT}/${LOB}/${DE_DIR}"
          [ -d "$DE_ROOT" ] || { echo "::error::Data Extension root not found: $DE_ROOT"; exit 1; }

          echo "definition=$FILE" >> "$GITHUB_OUTPUT"
          echo "production_mid=$MID" >> "$GITHUB_OUTPUT"
          echo "de_root=$DE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate deployment policy and SQL structure
        shell: bash
        env:
          FILE: ${{ steps.config.outputs.definition }}
        run: |
          set -euo pipefail

          jq -e '
            .schemaVersion == "2.0" and
            .assetType == "automation" and
            .deploymentPolicy.deployStructure == true and
            .deploymentPolicy.deploySchedule == false and
            .deploymentPolicy.activateAutomation == false and
            .deploymentPolicy.runAutomation == false and
            (.automation.name | type == "string" and length > 0) and
            (.automation.customerKey | type == "string" and length > 0) and
            (.tasks | type == "array" and length > 0)
          ' "$FILE" >/dev/null || {
            echo "::error::Definition/policy validation failed."
            exit 1
          }

          python3 <<'PY'
          import json, os
          d=json.load(open(os.environ["FILE"],encoding="utf-8"))
          for task in d["tasks"]:
              acts=task.get("activities") or []
              if not acts:
                  raise SystemExit("Task contains no activities.")
              for a in acts:
                  q=a.get("definition") or {}
                  if q.get("type") != "QueryDefinition":
                      raise SystemExit("POC supports QueryDefinition activities only.")
                  for k in ("name","customerKey","queryText","targetType","targetUpdateType"):
                      if not str(q.get(k,"")).strip():
                          raise SystemExit(f"QueryDefinition missing {k}.")
                  target=q.get("targetDataExtension") or {}
                  if not str(target.get("customerKey","")).strip():
                      raise SystemExit("QueryDefinition target DE CustomerKey missing.")
          print("Definition validated.")
          print("Schedule deployment: blocked")
          print("Activation: blocked")
          print("Execution: blocked")
          PY

      - name: Select and validate Automation Data Extension dependencies
        id: dependencies
        shell: bash
        env:
          FILE: ${{ steps.config.outputs.definition }}
          DE_ROOT: ${{ steps.config.outputs.de_root }}
        run: |
          set -euo pipefail
          python3 <<'PYDESELECT'
          import json, os
          from pathlib import Path
          definition=Path(os.environ['FILE'])
          data=json.loads(definition.read_text(encoding='utf-8'))
          deps=data.get('dataExtensionDependencies')
          if not isinstance(deps,list) or not deps:
              raise SystemExit('Automation definition has no dataExtensionDependencies. Retrieve the Automation with the dependency-aware Sandbox workflow first.')
          root=Path(os.environ['DE_ROOT']).resolve()
          selected=[]
          for dep in deps:
              key=str(dep.get('customerKey') or '').strip()
              repo=str(dep.get('repositoryDefinition') or '').strip()
              roles=dep.get('roles') or []
              if not key or not repo:
                  raise SystemExit('Invalid Data Extension dependency entry: '+repr(dep))
              p=Path(repo).resolve()
              expected=(root/key/'definition.json').resolve()
              if p != expected:
                  raise SystemExit(f'Dependency path mismatch for {key}: {p} != {expected}')
              if not p.is_file():
                  raise SystemExit(f'Approved dependency definition missing: {p}')
              asset=json.loads(p.read_text(encoding='utf-8'))
              if asset.get('assetType')!='DataExtension' or asset.get('customerKey')!=key:
                  raise SystemExit(f'Invalid approved DE definition for dependency {key}')
              fields=asset.get('fields')
              if not isinstance(fields,list) or not fields:
                  raise SystemExit(f'Dependency {key} has no fields')
              selected.append((key,p,roles))
          with open('/tmp/de-definitions.txt','w',encoding='utf-8') as f:
              for _,p,_ in selected: f.write(str(p)+'\n')
          print('Automation DE dependencies selected:',len(selected))
          for key,p,roles in selected:
              print(key,'| roles='+','.join(roles),'|',p)
          print('Data rows deployed: NO')
          PYDESELECT

      - name: Authenticate Production BU for dependency deployment
        shell: bash
        env:
          SFMC_AUTH_BASE_URI: ${{ secrets.SFMC_AUTH_BASE_URI }}
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          PRODUCTION_MID: ${{ steps.config.outputs.production_mid }}
        run: |
          set -euo pipefail
          AUTH_BASE_URI="${SFMC_AUTH_BASE_URI%/}"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/token-response.json --write-out "%{http_code}" --request POST "${AUTH_BASE_URI}/v2/token" --header "Content-Type: application/json" --data "$(jq -n --arg client_id "$SFMC_CLIENT_ID" --arg client_secret "$SFMC_CLIENT_SECRET" --arg account_id "$PRODUCTION_MID" '{grant_type:"client_credentials",client_id:$client_id,client_secret:$client_secret,account_id:($account_id|tonumber)}')")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then echo "::error::SFMC authentication failed with HTTP $HTTP_CODE"; exit 1; fi
          ACCESS_TOKEN=$(jq -r '.access_token // empty' /tmp/token-response.json)
          SOAP_INSTANCE_URL=$(jq -r '.soap_instance_url // empty' /tmp/token-response.json)
          [ -n "$ACCESS_TOKEN" ] && [ -n "$SOAP_INSTANCE_URL" ] || { echo "::error::OAuth response incomplete"; exit 1; }
          echo "::add-mask::$ACCESS_TOKEN"
          printf '%s' "$ACCESS_TOKEN" > /tmp/sfmc-access-token
          printf '%s' "${SOAP_INSTANCE_URL%/}" > /tmp/sfmc-soap-url
          echo "Dependency deployment authentication successful."

      - name: Deploy Automation Data Extension dependencies
        shell: bash
        env:
          PRODUCTION_MID: ${{ steps.config.outputs.production_mid }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import html
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          import time
          from pathlib import Path

          ACCESS_TOKEN = Path("/tmp/sfmc-access-token").read_text().strip()
          SOAP_URL = Path("/tmp/sfmc-soap-url").read_text().strip() + "/Service.asmx"
          DEFINITION_FILES = [
              Path(line.strip())
              for line in Path("/tmp/de-definitions.txt").read_text().splitlines()
              if line.strip()
          ]

          SOAP_NS = "http://schemas.xmlsoap.org/soap/envelope/"
          API_NS = "http://exacttarget.com/wsdl/partnerAPI"
          XSI_NS = "http://www.w3.org/2001/XMLSchema-instance"

          ET.register_namespace("soap", SOAP_NS)
          ET.register_namespace("xsi", XSI_NS)

          def esc(value):
              return html.escape(str(value), quote=True)

          def bool_text(value):
              return "true" if bool(value) else "false"

          def soap_call(action, body):
              envelope = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soap:Envelope xmlns:soap="{SOAP_NS}"
                         xmlns:xsi="{XSI_NS}"
                         xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <soap:Header>
              <fueloauth xmlns="{API_NS}">{esc(ACCESS_TOKEN)}</fueloauth>
            </soap:Header>
            <soap:Body>
              {body}
            </soap:Body>
          </soap:Envelope>"""

              request = urllib.request.Request(
                  SOAP_URL,
                  data=envelope.encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "text/xml; charset=UTF-8",
                      "SOAPAction": f'"{action}"',
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = response.read()
              except urllib.error.HTTPError as exc:
                  payload = exc.read()
                  raise RuntimeError(
                      f"SOAP {action} failed with HTTP {exc.code}: "
                      f"{payload.decode('utf-8', errors='replace')}"
                  ) from exc

              root = ET.fromstring(payload)

              fault = root.find(f".//{{{SOAP_NS}}}Fault")
              if fault is not None:
                  fault_string = fault.findtext("faultstring") or "Unknown SOAP fault"
                  raise RuntimeError(f"SOAP {action} fault: {fault_string}")

              return root

          def text_of(parent, local_name):
              if parent is None:
                  return None

              for child in parent.iter():
                  if child.tag.split("}")[-1] == local_name:
                      return child.text
              return None

          def nested_name(parent, container_local_name):
              if parent is None:
                  return None
              for node in parent.iter():
                  if node.tag.split("}")[-1] == container_local_name:
                      return text_of(node, "Name")
              return None

          def retrieve_de(customer_key):
              body = f"""
          <RetrieveRequestMsg xmlns="{API_NS}">
            <RetrieveRequest>
              <ObjectType>DataExtension</ObjectType>
              <Properties>ObjectID</Properties>
              <Properties>CustomerKey</Properties>
              <Properties>Name</Properties>
              <Properties>Description</Properties>
              <Properties>IsSendable</Properties>
              <Properties>IsTestable</Properties>
              <Properties>SendableDataExtensionField.Name</Properties>
              <Properties>SendableSubscriberField.Name</Properties>
              <Filter xsi:type="SimpleFilterPart">
                <Property>CustomerKey</Property>
                <SimpleOperator>equals</SimpleOperator>
                <Value>{esc(customer_key)}</Value>
              </Filter>
            </RetrieveRequest>
          </RetrieveRequestMsg>
          """

              root = soap_call("Retrieve", body)

              status = text_of(root, "OverallStatus") or ""
              if status not in ("OK", "Has More Rows"):
                  raise RuntimeError(
                      f"{customer_key}: DataExtension retrieve failed: {status}"
                  )

              results = [
                  node for node in root.iter()
                  if node.tag.split("}")[-1] == "Results"
              ]

              matching = []
              for result in results:
                  result_key = text_of(result, "CustomerKey")
                  if result_key == customer_key:
                      matching.append(result)

              if not matching:
                  return None

              if len(matching) > 1:
                  raise RuntimeError(
                      f"{customer_key}: multiple DataExtensions returned for one CustomerKey."
                  )

              result = matching[0]

              return {
                  "objectId": text_of(result, "ObjectID"),
                  "customerKey": text_of(result, "CustomerKey"),
                  "name": text_of(result, "Name"),
                  "description": text_of(result, "Description") or "",
                  "isSendable": (text_of(result, "IsSendable") or "").lower() == "true",
                  "isTestable": (text_of(result, "IsTestable") or "").lower() == "true",
                  "sendableDataExtensionField": (
                      {"name": nested_name(result, "SendableDataExtensionField")}
                      if nested_name(result, "SendableDataExtensionField")
                      else None
                  ),
                  "sendableSubscriberField": (
                      {"name": nested_name(result, "SendableSubscriberField")}
                      if nested_name(result, "SendableSubscriberField")
                      else None
                  ),
              }

          def describe_de_fields():
              body = f"""
          <DefinitionRequestMsg xmlns="{API_NS}">
            <DescribeRequests>
              <ObjectDefinitionRequest>
                <ObjectType>DataExtensionField</ObjectType>
              </ObjectDefinitionRequest>
            </DescribeRequests>
          </DefinitionRequestMsg>
          """

              root = soap_call("Describe", body)

              desired = [
                  "ObjectID",
                  "CustomerKey",
                  "Name",
                  "FieldType",
                  "MaxLength",
                  "IsPrimaryKey",
                  "IsRequired",
                  "DefaultValue",
                  "Ordinal",
                  "Precision",
                  "Scale",
              ]

              retrievable = set()

              for prop in root.iter():
                  if prop.tag.split("}")[-1] != "Properties":
                      continue

                  name = text_of(prop, "Name")
                  is_retrievable = (
                      text_of(prop, "IsRetrievable") or ""
                  ).lower() == "true"

                  if name and is_retrievable:
                      retrievable.add(name)

              required = {
                  "ObjectID",
                  "Name",
                  "FieldType",
                  "IsPrimaryKey",
                  "IsRequired",
                  "Ordinal",
              }

              missing = sorted(required - retrievable)
              if missing:
                  raise RuntimeError(
                      "DataExtensionField Describe does not expose required "
                      f"retrievable properties: {', '.join(missing)}"
                  )

              return [name for name in desired if name in retrievable]

          FIELD_PROPERTIES = describe_de_fields()

          def retrieve_fields(customer_key):
              properties_xml = "\n".join(
                  f"<Properties>{esc(prop)}</Properties>"
                  for prop in FIELD_PROPERTIES
              )

              body = f"""
          <RetrieveRequestMsg xmlns="{API_NS}">
            <RetrieveRequest>
              <ObjectType>DataExtensionField</ObjectType>
              {properties_xml}
              <Filter xsi:type="SimpleFilterPart">
                <Property>DataExtension.CustomerKey</Property>
                <SimpleOperator>equals</SimpleOperator>
                <Value>{esc(customer_key)}</Value>
              </Filter>
            </RetrieveRequest>
          </RetrieveRequestMsg>
          """

              root = soap_call("Retrieve", body)

              status = text_of(root, "OverallStatus") or ""
              if status not in ("OK", "Has More Rows"):
                  raise RuntimeError(
                      f"{customer_key}: DataExtensionField retrieve failed: {status}"
                  )

              fields = []

              for result in root.iter():
                  if result.tag.split("}")[-1] != "Results":
                      continue

                  name = text_of(result, "Name")
                  field_type = text_of(result, "FieldType")

                  if not name or not field_type:
                      continue

                  def int_or_none(value):
                      if value is None or value == "":
                          return None
                      return int(value)

                  fields.append({
                      "objectId": text_of(result, "ObjectID"),
                      "name": name,
                      "fieldType": field_type,
                      "maxLength": int_or_none(text_of(result, "MaxLength")),
                      "isPrimaryKey": (
                          text_of(result, "IsPrimaryKey") or ""
                      ).lower() == "true",
                      "isRequired": (
                          text_of(result, "IsRequired") or ""
                      ).lower() == "true",
                      "defaultValue": text_of(result, "DefaultValue"),
                      "ordinal": int_or_none(text_of(result, "Ordinal")),
                      "precision": int_or_none(text_of(result, "Precision")),
                      "scale": int_or_none(text_of(result, "Scale")),
                  })

              fields.sort(
                  key=lambda field: (
                      field["ordinal"] is None,
                      field["ordinal"] if field["ordinal"] is not None else 0,
                      field["name"],
                  )
              )

              return fields

          def normalized_desired(definition):
              fields = []

              for index, field in enumerate(definition["fields"]):
                  fields.append({
                      "name": field["name"],
                      "fieldType": field["fieldType"],
                      "maxLength": field.get("maxLength"),
                      "isPrimaryKey": bool(field.get("isPrimaryKey", False)),
                      "isRequired": bool(field.get("isRequired", False)),
                      "defaultValue": field.get("defaultValue"),
                      "ordinal": field.get("ordinal", index),
                      "precision": field.get("precision"),
                      "scale": field.get("scale"),
                  })

              fields.sort(
                  key=lambda field: (
                      field["ordinal"] is None,
                      field["ordinal"] if field["ordinal"] is not None else 0,
                      field["name"],
                  )
              )

              normalized = {
                  "name": definition["name"],
                  "customerKey": definition["customerKey"],
                  "description": definition.get("description") or "",
                  "isSendable": bool(definition.get("isSendable", False)),
                  "isTestable": bool(definition.get("isTestable", False)),
                  "sendableDataExtensionField": definition.get("sendableDataExtensionField"),
                  "sendableSubscriberField": definition.get("sendableSubscriberField"),
                  "fields": fields,
              }

              if normalized["isSendable"]:
                  de_field_name = (
                      (normalized.get("sendableDataExtensionField") or {}).get("name")
                  )
                  subscriber_field_name = (
                      (normalized.get("sendableSubscriberField") or {}).get("name")
                  )

                  if not de_field_name or not subscriber_field_name:
                      raise RuntimeError(
                          f"{normalized['customerKey']}: sendable relationship metadata is incomplete."
                      )

                  if de_field_name.lower() not in {
                      field["name"].lower() for field in normalized["fields"]
                  }:
                      raise RuntimeError(
                          f"{normalized['customerKey']}: sendableDataExtensionField "
                          f"{de_field_name!r} is not present in the DE fields."
                      )

              return normalized

          def normalized_actual(de, fields):
              return {
                  "name": de["name"],
                  "customerKey": de["customerKey"],
                  "description": de.get("description") or "",
                  "isSendable": bool(de.get("isSendable", False)),
                  "isTestable": bool(de.get("isTestable", False)),
                  "sendableDataExtensionField": de.get("sendableDataExtensionField"),
                  "sendableSubscriberField": de.get("sendableSubscriberField"),
                  "fields": [
                      {
                          key: field.get(key)
                          for key in (
                              "name",
                              "fieldType",
                              "maxLength",
                              "isPrimaryKey",
                              "isRequired",
                              "defaultValue",
                              "ordinal",
                              "precision",
                              "scale",
                          )
                      }
                      for field in fields
                  ],
              }

          def comparable_definition(definition):
              # Ordinal is retained for CREATE/add-field payloads, but excluded
              # from existing-DE reconciliation because SFMC can retain its own
              # ordinal sequence after delete + add operations.
              comparable = {
                  "name": definition["name"],
                  "customerKey": definition["customerKey"],
                  "description": definition.get("description") or "",
                  "isSendable": bool(definition.get("isSendable", False)),
                  "isTestable": bool(definition.get("isTestable", False)),
                  "fields": [],
              }

              if comparable["isSendable"]:
                  comparable["sendableDataExtensionField"] = definition.get(
                      "sendableDataExtensionField"
                  )
                  comparable["sendableSubscriberField"] = definition.get(
                      "sendableSubscriberField"
                  )

              for field in definition["fields"]:
                  comparable["fields"].append({
                      key: field.get(key)
                      for key in (
                          "name",
                          "fieldType",
                          "maxLength",
                          "isPrimaryKey",
                          "isRequired",
                          "defaultValue",
                          "precision",
                          "scale",
                      )
                  })

              comparable["fields"].sort(key=lambda field: field["name"])
              return comparable

          def field_xml(field, include_object_id=False):
              parts = ["<Fields>"]

              if include_object_id:
                  object_id = field.get("objectId")
                  if not object_id:
                      raise RuntimeError(
                          f"Missing ObjectID for existing field {field['name']}."
                      )
                  parts.append(f"<ObjectID>{esc(object_id)}</ObjectID>")

              parts.append(f"<Name>{esc(field['name'])}</Name>")
              parts.append(f"<FieldType>{esc(field['fieldType'])}</FieldType>")

              if field.get("maxLength") is not None:
                  parts.append(f"<MaxLength>{int(field['maxLength'])}</MaxLength>")

              parts.append(
                  f"<IsPrimaryKey>{bool_text(field.get('isPrimaryKey', False))}</IsPrimaryKey>"
              )
              parts.append(
                  f"<IsRequired>{bool_text(field.get('isRequired', False))}</IsRequired>"
              )

              if field.get("defaultValue") is not None:
                  parts.append(
                      f"<DefaultValue>{esc(field['defaultValue'])}</DefaultValue>"
                  )

              if field.get("ordinal") is not None:
                  parts.append(f"<Ordinal>{int(field['ordinal'])}</Ordinal>")

              if field.get("precision") is not None:
                  parts.append(f"<Precision>{int(field['precision'])}</Precision>")

              if field.get("scale") is not None:
                  parts.append(f"<Scale>{int(field['scale'])}</Scale>")

              parts.append("</Fields>")
              return "".join(parts)

          def check_update_safety(desired, actual_fields):
              desired_by_name = {
                  field["name"]: field
                  for field in desired["fields"]
              }
              actual_by_name = {
                  field["name"]: field
                  for field in actual_fields
              }

              removed = sorted(set(actual_by_name) - set(desired_by_name))
              for name in removed:
                  field = actual_by_name[name]
                  if bool(field.get("isPrimaryKey")):
                      return False, (
                          f"Field {name}: automatic deletion of a primary-key field is blocked."
                      )
                  if not field.get("objectId"):
                      return False, (
                          f"Field {name}: automatic deletion requires the Production field ObjectID."
                      )

              for name in sorted(set(actual_by_name) & set(desired_by_name)):
                  old = actual_by_name[name]
                  new = desired_by_name[name]

                  if old["fieldType"] != new["fieldType"]:
                      return False, (
                          f"Field {name}: fieldType change "
                          f"{old['fieldType']} -> {new['fieldType']} is blocked."
                      )

                  if bool(old["isPrimaryKey"]) != bool(new["isPrimaryKey"]):
                      return False, (
                          f"Field {name}: primary-key change is blocked."
                      )

                  old_length = old.get("maxLength")
                  new_length = new.get("maxLength")

                  if (
                      old_length is not None
                      and new_length is not None
                      and new_length < old_length
                  ):
                      return False, (
                          f"Field {name}: MaxLength reduction "
                          f"{old_length} -> {new_length} is blocked."
                      )

                  if (
                      not bool(old["isRequired"])
                      and bool(new["isRequired"])
                  ):
                      return False, (
                          f"Field {name}: optional -> required change is blocked."
                      )

              new_fields = sorted(set(desired_by_name) - set(actual_by_name))

              for name in new_fields:
                  field = desired_by_name[name]

                  if bool(field.get("isPrimaryKey")):
                      return False, (
                          f"New field {name}: adding a new primary-key field "
                          "to an existing DE is blocked."
                      )

                  if (
                      bool(field.get("isRequired"))
                      and field.get("defaultValue") in (None, "")
                  ):
                      return False, (
                          f"New field {name}: required field without a default "
                          "value is blocked for an existing DE."
                      )

              return True, ""

          def sendable_relationship_xml(desired):
              if not desired.get("isSendable", False):
                  return ""

              de_field_name = (
                  (desired.get("sendableDataExtensionField") or {}).get("name")
              )
              subscriber_field_name = (
                  (desired.get("sendableSubscriberField") or {}).get("name")
              )

              if not de_field_name or not subscriber_field_name:
                  raise RuntimeError(
                      f"{desired['customerKey']}: sendable relationship metadata is incomplete."
                  )

              return (
                  "<SendableDataExtensionField>"
                  f"<Name>{esc(de_field_name)}</Name>"
                  "</SendableDataExtensionField>"
                  "<SendableSubscriberField>"
                  f"<Name>{esc(subscriber_field_name)}</Name>"
                  "</SendableSubscriberField>"
              )

          def create_de(desired):
              # CREATE requires one Fields collection containing Field children.
              # Keep field_xml unchanged because UPDATE already uses it.
              fields = "<Fields>" + "".join(
                  field_xml(field)
                      .replace("<Fields>", "<Field>", 1)
                      .replace("</Fields>", "</Field>", 1)
                  for field in desired["fields"]
              ) + "</Fields>"
              relationship = sendable_relationship_xml(desired)

              body = f"""
          <CreateRequest xmlns="{API_NS}">
            <Options />
            <Objects xsi:type="DataExtension">
              <CustomerKey>{esc(desired['customerKey'])}</CustomerKey>
              <Name>{esc(desired['name'])}</Name>
              <Description>{esc(desired['description'])}</Description>
              <IsSendable>{bool_text(desired['isSendable'])}</IsSendable>
              <IsTestable>{bool_text(desired['isTestable'])}</IsTestable>
              {relationship}
              {fields}
            </Objects>
          </CreateRequest>
          """

              root = soap_call("Create", body)

              status = text_of(root, "OverallStatus") or "UNKNOWN"
              results = [
                  node for node in root.iter()
                  if node.tag.split("}")[-1] == "Results"
              ]
              details = []
              for result in results:
                  result_status = text_of(result, "StatusCode") or "UNKNOWN"
                  result_message = text_of(result, "StatusMessage") or ""
                  error_code = text_of(result, "ErrorCode") or ""
                  details.append(
                      f"StatusCode={result_status}; "
                      f"ErrorCode={error_code}; "
                      f"StatusMessage={result_message}"
                  )

              if (
                  status != "OK"
                  or len(results) != 1
                  or (results and (text_of(results[0], "StatusCode") or "") != "OK")
              ):
                  raise RuntimeError(
                      f"{desired['customerKey']}: Salesforce CREATE failed. "
                      f"OverallStatus={status}; "
                      f"ResultCount={len(results)}; "
                      + " | ".join(details)
                  )

          def require_update_ok(root, customer_key, operation):
              overall = text_of(root, "OverallStatus") or "MISSING"
              results = [n for n in root.iter() if n.tag.split("}")[-1] == "Results"]
              messages = []
              for result in results:
                  messages.append(
                      f"StatusCode={text_of(result, 'StatusCode') or 'MISSING'}; "
                      f"ErrorCode={text_of(result, 'ErrorCode') or 'N/A'}; "
                      f"StatusMessage={text_of(result, 'StatusMessage') or 'N/A'}"
                  )
              if overall != "OK" or len(results) != 1 or (text_of(results[0], "StatusCode") or "") != "OK":
                  raise RuntimeError(
                      f"{customer_key}: {operation} rejected: OverallStatus={overall}; "
                      f"ResultCount={len(results)}; " + " | ".join(messages)
                  )

          def delete_removed_fields(desired, actual_de, actual_fields):
              customer_key = desired["customerKey"]
              desired_names = {field["name"] for field in desired["fields"]}
              removed_names = sorted(
                  field["name"]
                  for field in actual_fields
                  if field["name"] not in desired_names
              )

              for field_name in removed_names:
                  # Re-read immediately before every destructive operation so that
                  # the ObjectID and primary-key status come from live Production.
                  live_fields = retrieve_fields(customer_key)
                  live_by_name = {field["name"]: field for field in live_fields}
                  live_field = live_by_name.get(field_name)

                  if live_field is None:
                      print(f"Production field already absent: {field_name}")
                      continue

                  if bool(live_field.get("isPrimaryKey")):
                      raise RuntimeError(
                          f"{customer_key}: automatic deletion of primary-key field "
                          f"{field_name} is blocked."
                      )

                  field_object_id = live_field.get("objectId")
                  if not field_object_id:
                      raise RuntimeError(
                          f"{customer_key}: cannot delete field {field_name}; "
                          "Production ObjectID is missing."
                      )

                  # Delete the child DataExtension field through the parent
                  # DataExtension. The field ObjectID identifies the exact column.
                  body = f"""
          <DeleteRequest xmlns="{API_NS}">
            <Options />
            <Objects xsi:type="DataExtension">
              <PartnerKey xsi:nil="true" />
              <ObjectID xsi:nil="true" />
              <CustomerKey>{esc(customer_key)}</CustomerKey>
              <Fields>
                <Field>
                  <ObjectID>{esc(field_object_id)}</ObjectID>
                </Field>
              </Fields>
            </Objects>
          </DeleteRequest>
          """

                  require_update_ok(
                      soap_call("Delete", body),
                      customer_key,
                      f"delete field {field_name}",
                  )

                  # SFMC can accept the field deletion before the schema change
                  # becomes visible to a subsequent Retrieve. Poll the live schema
                  # instead of treating the first immediate Retrieve as failure.
                  deletion_confirmed = False
                  max_attempts = 60
                  poll_seconds = 5

                  for attempt in range(1, max_attempts + 1):
                      confirmed = retrieve_fields(customer_key)
                      if field_name not in {field["name"] for field in confirmed}:
                          deletion_confirmed = True
                          print(
                              f"Confirmed Production field deletion: {field_name} "
                              f"(verification attempt {attempt})"
                          )
                          break

                      if attempt < max_attempts:
                          print(
                              f"Waiting for SFMC to finalize field deletion: "
                              f"{field_name} (attempt {attempt}/{max_attempts})"
                          )
                          time.sleep(poll_seconds)

                  if not deletion_confirmed:
                      raise RuntimeError(
                          f"{customer_key}: Salesforce accepted deletion of "
                          f"{field_name}, but the field was still present after "
                          f"{max_attempts * poll_seconds} seconds of verification."
                      )


          def update_de(desired, actual_de, actual_fields):
              customer_key = desired["customerKey"]
              actual_by_name = {f["name"]: f for f in actual_fields}
              missing = [f for f in desired["fields"] if f["name"] not in actual_by_name]

              # Add ONLY genuinely new fields. Never resend existing field datatypes.
              for field in missing:
                  live = retrieve_fields(customer_key)
                  if field["name"] in {f["name"] for f in live}:
                      continue

                  parts = [
                      f"<Name>{esc(field['name'])}</Name>",
                      f"<FieldType>{esc(field['fieldType'])}</FieldType>",
                  ]
                  if field.get("maxLength") is not None:
                      parts.append(f"<MaxLength>{int(field['maxLength'])}</MaxLength>")
                  parts.append(f"<IsRequired>{bool_text(field.get('isRequired', False))}</IsRequired>")
                  if field.get("defaultValue") is not None:
                      parts.append(f"<DefaultValue>{esc(field['defaultValue'])}</DefaultValue>")
                  if field.get("precision") is not None:
                      parts.append(f"<Precision>{int(field['precision'])}</Precision>")
                  if field.get("scale") is not None:
                      parts.append(f"<Scale>{int(field['scale'])}</Scale>")

                  body = f"""
          <UpdateRequest xmlns="{API_NS}">
            <Options />
            <Objects xsi:type="DataExtension">
              <ObjectID>{esc(actual_de['objectId'])}</ObjectID>
              <CustomerKey>{esc(customer_key)}</CustomerKey>
              <Fields><Field>{''.join(parts)}</Field></Fields>
            </Objects>
          </UpdateRequest>
          """
                  require_update_ok(
                      soap_call("Update", body),
                      customer_key,
                      f"add field {field['name']}",
                  )

                  confirmed = retrieve_fields(customer_key)
                  if field["name"] not in {f["name"] for f in confirmed}:
                      raise RuntimeError(
                          f"{customer_key}: API accepted add field {field['name']} "
                          "but subsequent retrieve did not find it"
                      )
                  print(f"Confirmed new Production field: {field['name']}")

              # Re-read after field additions.
              current_de = retrieve_de(customer_key)
              if current_de is None:
                  raise RuntimeError(
                      f"{customer_key}: Data Extension not found after field update."
                  )

              # Parent metadata must be updated separately from Fields.
              # This prevents SFMC from interpreting unchanged FieldType values
              # as attempts to change immutable existing field datatypes.
              parent_changed = (
                  current_de["name"] != desired["name"]
                  or (current_de.get("description") or "") != (desired.get("description") or "")
                  or bool(current_de.get("isSendable", False)) != bool(desired.get("isSendable", False))
                  or bool(current_de.get("isTestable", False)) != bool(desired.get("isTestable", False))
                  or (
                      bool(desired.get("isSendable", False))
                      and (
                          current_de.get("sendableDataExtensionField")
                          != desired.get("sendableDataExtensionField")
                          or current_de.get("sendableSubscriberField")
                          != desired.get("sendableSubscriberField")
                      )
                  )
              )

              if parent_changed:
                  relationship = sendable_relationship_xml(desired)
                  body = f"""
          <UpdateRequest xmlns="{API_NS}">
            <Options />
            <Objects xsi:type="DataExtension">
              <ObjectID>{esc(current_de['objectId'])}</ObjectID>
              <CustomerKey>{esc(customer_key)}</CustomerKey>
              <Name>{esc(desired['name'])}</Name>
              <Description>{esc(desired['description'])}</Description>
              <IsSendable>{bool_text(desired['isSendable'])}</IsSendable>
              <IsTestable>{bool_text(desired['isTestable'])}</IsTestable>
              {relationship}
            </Objects>
          </UpdateRequest>
          """
                  require_update_ok(
                      soap_call("Update", body),
                      customer_key,
                      "update Data Extension parent metadata",
                  )
                  print(f"Confirmed Production parent metadata update: {customer_key}")

              # Final reconciliation inside the update operation.
              final_de = retrieve_de(customer_key)
              if final_de is None:
                  raise RuntimeError(
                      f"{customer_key}: Data Extension not found after update."
                  )
              final_fields = retrieve_fields(customer_key)
              final_actual = normalized_actual(final_de, final_fields)

              if comparable_definition(final_actual) != comparable_definition(desired):
                  raise RuntimeError(
                      f"{customer_key}: Production definition still differs from GitHub main after safe update. "
                      + "Expected=" + json.dumps(comparable_definition(desired), sort_keys=True)
                      + "; Actual=" + json.dumps(comparable_definition(final_actual), sort_keys=True)
                  )

              print(f"Production Data Extension reconciled successfully: {customer_key}")

          results = []
          failed = False

          for definition_file in DEFINITION_FILES:
              definition = json.loads(definition_file.read_text())
              desired = normalized_desired(definition)
              customer_key = desired["customerKey"]

              action = None
              verification = "NOT RUN"
              detail = ""

              try:
                  existing = retrieve_de(customer_key)

                  if existing is None:
                      create_de(desired)
                      action = "CREATE"

                  else:
                      production_fields = retrieve_fields(customer_key)
                      actual = normalized_actual(existing, production_fields)

                      if comparable_definition(actual) == comparable_definition(desired):
                          action = "SKIP"
                      else:
                          safe, reason = check_update_safety(
                              desired,
                              production_fields,
                          )

                          if not safe:
                              raise RuntimeError(reason)

                          delete_removed_fields(
                              desired,
                              existing,
                              production_fields,
                          )

                          production_fields = retrieve_fields(customer_key)

                          update_de(
                              desired,
                              existing,
                              production_fields,
                          )
                          action = "UPDATE"

                  verified_de = retrieve_de(customer_key)

                  if verified_de is None:
                      raise RuntimeError(
                          "Post-deployment verification could not find the DE."
                      )

                  verified_fields = retrieve_fields(customer_key)
                  verified = normalized_actual(
                      verified_de,
                      verified_fields,
                  )

                  if comparable_definition(verified) != comparable_definition(desired):
                      raise RuntimeError(
                          "Post-deployment Production definition differs from GitHub main. "
                          + "Expected=" + json.dumps(comparable_definition(desired), sort_keys=True)
                          + "; Actual=" + json.dumps(comparable_definition(verified), sort_keys=True)
                      )

                  verification = "PASS"

              except Exception as exc:
                  action = action or "FAIL"
                  verification = "FAIL"
                  detail = str(exc)
                  failed = True

              results.append({
                  "customerKey": customer_key,
                  "action": action,
                  "verification": verification,
                  "detail": detail,
              })

          Path("/tmp/deployment-results.json").write_text(
              json.dumps(results, indent=2)
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# SFMC Production Deployment Summary\n\n")
              summary.write(
                  f"**POC production target BU MID:** "
                  f"`{os.environ['PRODUCTION_MID']}`\n\n"
              )
              summary.write("| Customer Key | Action | Verification | Details |\n")
              summary.write("|---|---|---|---|\n")

              for result in results:
                  detail = result["detail"].replace("|", "\\|").replace("\n", " ")
                  summary.write(
                      f"| `{result['customerKey']}` "
                      f"| **{result['action']}** "
                      f"| **{result['verification']}** "
                      f"| {detail or '-'} |\n"
                  )

          for result in results:
              print(
                  f"{result['customerKey']}: "
                  f"{result['action']} / {result['verification']}"
              )
              if result["detail"]:
                  print(f"  {result['detail']}")

          if failed:
              sys.exit(1)
          PY


      - name: Validate SFMC secrets
        shell: bash
        env:
          AUTH: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CID: ${{ secrets.SFMC_CLIENT_ID }}
          SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${AUTH:-}" ] || { echo "::error::SFMC_AUTH_BASE_URI missing"; exit 1; }
          [ -n "${CID:-}" ] || { echo "::error::SFMC_CLIENT_ID missing"; exit 1; }
          [ -n "${SECRET:-}" ] || { echo "::error::SFMC_CLIENT_SECRET missing"; exit 1; }

      - name: Authenticate Production BU
        shell: bash
        env:
          AUTH: ${{ secrets.SFMC_AUTH_BASE_URI }}
          CID: ${{ secrets.SFMC_CLIENT_ID }}
          SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          MID: ${{ steps.config.outputs.production_mid }}
        run: |
          set -euo pipefail

          CODE=$(curl --silent --show-error \
            --output /tmp/token.json \
            --write-out "%{http_code}" \
            --request POST "${AUTH%/}/v2/token" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg id "$CID" \
              --arg secret "$SECRET" \
              --arg mid "$MID" \
              '{grant_type:"client_credentials",
                client_id:$id,
                client_secret:$secret,
                account_id:($mid|tonumber)}')")

          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            jq -r '.message // .error_description // .error // "Authentication failed"' /tmp/token.json
            exit 1
          fi

          TOKEN=$(jq -r '.access_token // empty' /tmp/token.json)
          SOAP=$(jq -r '.soap_instance_url // empty' /tmp/token.json)

          [ -n "$TOKEN" ] || { echo "::error::access_token missing"; exit 1; }
          [ -n "$SOAP" ] || { echo "::error::soap_instance_url missing"; exit 1; }

          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/sfmc-token
          printf '%s' "${SOAP%/}" > /tmp/sfmc-soap

          echo "Production authentication successful."
          echo "Production MID: $MID"

      - name: Deploy or compare SQL Query Automation structure
        shell: bash
        env:
          FILE: ${{ steps.config.outputs.definition }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import html
          import os
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          TOKEN = Path("/tmp/sfmc-token").read_text().strip()
          SOAP_URL = Path("/tmp/sfmc-soap").read_text().strip() + "/Service.asmx"
          definition = json.load(open(os.environ["FILE"], encoding="utf-8"))

          API = "http://exacttarget.com/wsdl/partnerAPI"
          SOAP_NS = "http://schemas.xmlsoap.org/soap/envelope/"
          XSI = "http://www.w3.org/2001/XMLSchema-instance"

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def lname(node):
              return node.tag.split("}")[-1]

          def child_text(node, name):
              for child in list(node):
                  if lname(child) == name:
                      return (child.text or "").strip()
              return ""

          def overall(root):
              for node in root.iter():
                  if lname(node) == "OverallStatus":
                      return (node.text or "").strip()
              return ""

          def result_nodes(root):
              return [n for n in root.iter() if lname(n) == "Results"]

          def soap_call(action, body):
              envelope = f"""<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope xmlns:soapenv="{SOAP_NS}" xmlns:xsi="{XSI}">
            <soapenv:Header>
              <fueloauth xmlns="http://exacttarget.com">{esc(TOKEN)}</fueloauth>
            </soapenv:Header>
            <soapenv:Body>{body}</soapenv:Body>
          </soapenv:Envelope>"""

              req = urllib.request.Request(
                  SOAP_URL,
                  data=envelope.encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "text/xml; charset=UTF-8",
                      "SOAPAction": f'"{action}"',
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = response.read()
              except urllib.error.HTTPError as exc:
                  payload = exc.read()
                  raise RuntimeError(
                      f"SOAP {action} HTTP {exc.code}: "
                      f"{payload.decode('utf-8', errors='replace')}"
                  ) from exc

              root = ET.fromstring(payload)
              fault = root.find(f".//{{{SOAP_NS}}}Fault")
              if fault is not None:
                  raise RuntimeError(
                      f"SOAP {action} fault: {''.join(fault.itertext())}"
                  )
              return root

          def retrieve(object_type, properties, filter_property, filter_value):
              properties_xml = "".join(
                  f"<Properties>{esc(p)}</Properties>" for p in properties
              )
              body = f"""
          <RetrieveRequestMsg xmlns="{API}">
            <RetrieveRequest>
              <ObjectType>{esc(object_type)}</ObjectType>
              {properties_xml}
              <Filter xsi:type="SimpleFilterPart">
                <Property>{esc(filter_property)}</Property>
                <SimpleOperator>equals</SimpleOperator>
                <Value>{esc(filter_value)}</Value>
              </Filter>
            </RetrieveRequest>
          </RetrieveRequestMsg>
          """
              root = soap_call("Retrieve", body)
              status = overall(root)
              if status not in ("OK", "Has More Rows", "MoreDataAvailable"):
                  raise RuntimeError(
                      f"{object_type} retrieve failed. OverallStatus={status!r}"
                  )
              return result_nodes(root)

          def create(object_type, inner_xml):
              body = f"""
          <CreateRequest xmlns="{API}">
            <Options />
            <Objects xsi:type="{object_type}">
              {inner_xml}
            </Objects>
          </CreateRequest>
          """
              root = soap_call("Create", body)
              status = overall(root)
              messages = []
              codes = []
              for result in result_nodes(root):
                  codes.append(child_text(result, "StatusCode"))
                  messages.append(child_text(result, "StatusMessage"))

              if status != "OK" or any(code and code != "OK" for code in codes):
                  raise RuntimeError(
                      f"{object_type} create failed: "
                      f"OverallStatus={status}; codes={codes}; messages={messages}"
                  )

              object_id = ""
              for node in root.iter():
                  if lname(node) == "NewObjectID":
                      value = (node.text or "").strip()
                      if value:
                          object_id = value
                          break

              if not object_id:
                  raise RuntimeError(
                      f"{object_type} create succeeded but NewObjectID was not returned."
                  )
              return object_id

          def direct_result_by_key(results, key):
              matches = [
                  r for r in results
                  if child_text(r, "CustomerKey") == key
              ]
              if len(matches) > 1:
                  raise RuntimeError(
                      f"Multiple results returned for CustomerKey {key}."
                  )
              return matches[0] if matches else None

          def get_de(customer_key):
              rs = retrieve(
                  "DataExtension",
                  ["ObjectID", "CustomerKey", "Name"],
                  "CustomerKey",
                  customer_key,
              )
              r = direct_result_by_key(rs, customer_key)
              if r is None:
                  return None
              return {
                  "objectId": child_text(r, "ObjectID"),
                  "customerKey": child_text(r, "CustomerKey"),
                  "name": child_text(r, "Name"),
              }

          def get_query(customer_key):
              rs = retrieve(
                  "QueryDefinition",
                  [
                      "ObjectID",
                      "CustomerKey",
                      "Name",
                      "Description",
                      "QueryText",
                      "TargetType",
                      "DataExtensionTarget.Name",
                      "DataExtensionTarget.CustomerKey",
                      "TargetUpdateType",
                  ],
                  "CustomerKey",
                  customer_key,
              )
              r = direct_result_by_key(rs, customer_key)
              if r is None:
                  return None

              target = {}
              for c in list(r):
                  if lname(c) == "DataExtensionTarget":
                      target = {
                          "name": child_text(c, "Name"),
                          "customerKey": child_text(c, "CustomerKey"),
                      }

              return {
                  "objectId": child_text(r, "ObjectID"),
                  "customerKey": child_text(r, "CustomerKey"),
                  "name": child_text(r, "Name"),
                  "queryText": child_text(r, "QueryText"),
                  "targetType": child_text(r, "TargetType"),
                  "targetUpdateType": child_text(r, "TargetUpdateType"),
                  "target": target,
              }

          def normalize_sql(value):
              return " ".join((value or "").split())

          automation = definition["automation"]
          tasks = definition["tasks"]

          # Retrieve by CustomerKey, but do not treat a blank SFMC Results
          # wrapper as an existing Automation. Production has been observed to
          # return one Results node with no usable identity values.
          automation_lookup_results = retrieve(
              "Automation",
              ["ObjectID", "CustomerKey", "Name", "Status"],
              "CustomerKey",
              automation["customerKey"],
          )

          existing_automation = [
              item for item in automation_lookup_results
              if (
                  child_text(item, "ObjectID")
                  or child_text(item, "CustomerKey")
                  or child_text(item, "Name")
              )
          ]

          blank_automation_results = (
              len(automation_lookup_results) - len(existing_automation)
          )

          print(
              "Automation lookup raw results:",
              len(automation_lookup_results),
          )
          print(
              "Automation lookup identifiable results:",
              len(existing_automation),
          )
          print(
              "Automation lookup blank/ghost results ignored:",
              blank_automation_results,
          )

          # Independent fail-safe existence check through Program. This route
          # is read-only. Any identifiable Program blocks CREATE and is handled
          # by the existing comparison path below.
          program_existence_results = retrieve(
              "Program",
              ["ObjectID", "CustomerKey", "Name", "Status"],
              "CustomerKey",
              automation["customerKey"],
          )
          identifiable_programs = [
              item for item in program_existence_results
              if (
                  child_text(item, "ObjectID")
                  or child_text(item, "CustomerKey")
                  or child_text(item, "Name")
              )
          ]

          print(
              "Program lookup identifiable results:",
              len(identifiable_programs),
          )

          if len(existing_automation) > 1:
              raise RuntimeError(
                  f"Multiple identifiable Production Automations found for "
                  f"{automation['customerKey']}; CREATE blocked."
              )

          if len(identifiable_programs) > 1:
              raise RuntimeError(
                  f"Multiple identifiable Production Programs found for "
                  f"{automation['customerKey']}; CREATE blocked."
              )

          # If Program resolves an object while Automation returns only a blank
          # wrapper, still treat the asset as existing and use the read-only
          # comparison path. Never CREATE over an identifiable Program.
          asset_exists = bool(existing_automation or identifiable_programs)

          if asset_exists:
              # Automation Retrieve is used only to detect existence.
              # Do not re-filter its returned Results by CustomerKey because
              # SFMC does not reliably populate that property on Automation
              # retrieve responses. Resolve identity through Program instead.
              differences = []

              programs = identifiable_programs

              if len(programs) != 1:
                  print("")
                  print("==========================================")
                  print("PRODUCTION AUTOMATION READ-ONLY DISCOVERY")
                  print("==========================================")
                  print("Automation CustomerKey:", automation["customerKey"])
                  print("Program results by CustomerKey:", len(programs))
                  print("")
                  print("Program relationship was not resolved.")
                  print("Running read-only Describe/Retrieve diagnostics only.")
                  print("No Create/Update/Delete/Perform operation will be called.")

                  # Describe Automation so the log shows exactly which
                  # properties this Production BU exposes as retrievable.
                  describe_body = f"""
              <DefinitionRequestMsg xmlns="{API}">
                <DescribeRequests>
                  <ObjectDefinitionRequest>
                    <ObjectType>Automation</ObjectType>
                  </ObjectDefinitionRequest>
                </DescribeRequests>
              </DefinitionRequestMsg>
              """
                  describe_root = soap_call("Describe", describe_body)

                  retrievable = []
                  for prop in describe_root.iter():
                      if lname(prop) != "Properties":
                          continue
                      name = child_text(prop, "Name")
                      is_retrievable = child_text(prop, "IsRetrievable")
                      if name and is_retrievable.lower() == "true":
                          retrievable.append(name)

                  print("")
                  print("Automation retrievable properties:")
                  for name in retrievable:
                      print("-", name)

                  # Retrieve only properties that Describe says are
                  # retrievable. CustomerKey is already known to be usable as
                  # the filter because the existence lookup succeeded.
                  preferred = [
                      "ObjectID",
                      "CustomerKey",
                      "Name",
                      "Description",
                      "Status",
                      "AutomationType",
                      "Schedule.ID",
                      "AutomationSource.AutomationSourceID",
                      "AutomationSource.AutomationSourceType",
                  ]
                  diagnostic_properties = [
                      name for name in preferred if name in retrievable
                  ]

                  # Keep the diagnostic useful even if Describe returns an
                  # unexpectedly small list.
                  if "Name" not in diagnostic_properties:
                      diagnostic_properties.append("Name")
                  if "CustomerKey" not in diagnostic_properties:
                      diagnostic_properties.append("CustomerKey")

                  diagnostic_results = retrieve(
                      "Automation",
                      diagnostic_properties,
                      "CustomerKey",
                      automation["customerKey"],
                  )

                  print("")
                  print(
                      "Automation results by CustomerKey:",
                      len(diagnostic_results),
                  )

                  for index, result in enumerate(
                      diagnostic_results, start=1
                  ):
                      print("")
                      print(f"Automation result #{index}")
                      for property_name in diagnostic_properties:
                          if "." in property_name:
                              # Nested values are printed by walking the
                              # returned XML path by local element names.
                              parts = property_name.split(".")
                              nodes = [result]
                              for part in parts:
                                  next_nodes = []
                                  for node in nodes:
                                      next_nodes.extend(
                                          child for child in list(node)
                                          if lname(child) == part
                                      )
                                  nodes = next_nodes
                              value = (
                                  (nodes[0].text or "").strip()
                                  if nodes else ""
                              )
                          else:
                              value = child_text(
                                  result, property_name
                              )
                          print(f"{property_name}: {value!r}")

                  # Also probe the preserved source Program ObjectID, if one
                  # exists in the approved definition. This is read-only and
                  # does not assume that Sandbox and Production IDs are equal;
                  # it only records whether Production resolves that ID.
                  source_program_id = (
                      (definition.get("program") or {})
                      .get("sourceObjectId", "")
                  )
                  if source_program_id:
                      program_by_object_id = retrieve(
                          "Program",
                          [
                              "ObjectID",
                              "CustomerKey",
                              "Name",
                              "Status",
                          ],
                          "ObjectID",
                          source_program_id,
                      )
                      print("")
                      print(
                          "Program results by source ObjectID:",
                          len(program_by_object_id),
                      )
                      for index, result in enumerate(
                          program_by_object_id, start=1
                      ):
                          print(f"Program result #{index}")
                          print(
                              "ObjectID:",
                              repr(child_text(result, "ObjectID")),
                          )
                          print(
                              "CustomerKey:",
                              repr(child_text(result, "CustomerKey")),
                          )
                          print(
                              "Name:",
                              repr(child_text(result, "Name")),
                          )

                  print("")
                  print("RESULT: RELATIONSHIP UNRESOLVED")
                  print("Create/Update/Delete performed: NO")
                  print("Schedule changed: NO")
                  print("Activated: NO")
                  print("Executed: NO")
                  print("==========================================")

                  raise RuntimeError(
                      "Production Program relationship is unresolved. "
                      "Read-only discovery completed; inspect this step's "
                      "diagnostic output. No Production changes were made."
                  )

              production_program_name = child_text(programs[0], "Name")
              if production_program_name != automation["name"]:
                  differences.append(
                      "Automation/Program name: "
                      f"source={automation['name']!r}, "
                      f"production={production_program_name!r}"
                  )

              program_id = child_text(programs[0], "ObjectID")
              if not program_id:
                  raise RuntimeError(
                      "Production Program ObjectID was not returned."
                  )

              production_tasks = retrieve(
                  "Task",
                  ["ObjectID", "Program.ObjectID", "Name", "Sequence"],
                  "Program.ObjectID",
                  program_id,
              )

              source_tasks = sorted(
                  tasks,
                  key=lambda item: int(item.get("sequence", 0)),
              )
              production_tasks = sorted(
                  production_tasks,
                  key=lambda item: int(child_text(item, "Sequence") or 0),
              )

              if len(production_tasks) != len(source_tasks):
                  differences.append(
                      "Task count: "
                      f"source={len(source_tasks)}, "
                      f"production={len(production_tasks)}"
                  )
              else:
                  for source_task, production_task in zip(
                      source_tasks, production_tasks
                  ):
                      source_task_sequence = int(
                          source_task.get("sequence", 0)
                      )
                      production_task_sequence = int(
                          child_text(production_task, "Sequence") or 0
                      )

                      if source_task_sequence != production_task_sequence:
                          differences.append(
                              "Task sequence: "
                              f"source={source_task_sequence}, "
                              f"production={production_task_sequence}"
                          )

                      source_task_name = source_task.get("name") or ""
                      production_task_name = child_text(
                          production_task, "Name"
                      )
                      if source_task_name != production_task_name:
                          differences.append(
                              "Task name at sequence "
                              f"{source_task_sequence}: "
                              f"source={source_task_name!r}, "
                              f"production={production_task_name!r}"
                          )

                      task_id = child_text(production_task, "ObjectID")
                      if not task_id:
                          differences.append(
                              f"Production Task at sequence "
                              f"{production_task_sequence} has no ObjectID."
                          )
                          continue

                      production_activities = retrieve(
                          "Activity",
                          [
                              "ObjectID",
                              "Task.ObjectID",
                              "Definition.ObjectID",
                              "CustomerKey",
                              "Name",
                              "Sequence",
                          ],
                          "Task.ObjectID",
                          task_id,
                      )

                      source_activities = sorted(
                          source_task.get("activities") or [],
                          key=lambda item: int(item.get("sequence", 0)),
                      )
                      production_activities = sorted(
                          production_activities,
                          key=lambda item: int(
                              child_text(item, "Sequence") or 0
                          ),
                      )

                      if len(production_activities) != len(source_activities):
                          differences.append(
                              "Activity count for task sequence "
                              f"{source_task_sequence}: "
                              f"source={len(source_activities)}, "
                              f"production={len(production_activities)}"
                          )
                          continue

                      for source_activity, production_activity in zip(
                          source_activities, production_activities
                      ):
                          source_activity_sequence = int(
                              source_activity.get("sequence", 0)
                          )
                          production_activity_sequence = int(
                              child_text(
                                  production_activity, "Sequence"
                              ) or 0
                          )

                          if (
                              source_activity_sequence
                              != production_activity_sequence
                          ):
                              differences.append(
                                  "Activity sequence: "
                                  f"source={source_activity_sequence}, "
                                  f"production="
                                  f"{production_activity_sequence}"
                              )

                          source_activity_name = (
                              source_activity.get("name") or ""
                          )
                          production_activity_name = child_text(
                              production_activity, "Name"
                          )
                          if (
                              source_activity_name
                              != production_activity_name
                          ):
                              differences.append(
                                  "Activity name at task/activity "
                                  f"{source_task_sequence}/"
                                  f"{source_activity_sequence}: "
                                  f"source={source_activity_name!r}, "
                                  f"production="
                                  f"{production_activity_name!r}"
                              )

                          source_activity_key = (
                              source_activity.get("customerKey") or ""
                          )
                          production_activity_key = child_text(
                              production_activity, "CustomerKey"
                          )
                          if (
                              source_activity_key
                              and source_activity_key
                              != production_activity_key
                          ):
                              differences.append(
                                  "Activity CustomerKey at task/activity "
                                  f"{source_task_sequence}/"
                                  f"{source_activity_sequence}: "
                                  f"source={source_activity_key!r}, "
                                  f"production="
                                  f"{production_activity_key!r}"
                              )

                          source_query = source_activity["definition"]
                          source_target = source_query[
                              "targetDataExtension"
                          ]
                          production_query = get_query(
                              source_query["customerKey"]
                          )

                          if production_query is None:
                              differences.append(
                                  "QueryDefinition missing in Production: "
                                  f"{source_query['customerKey']}"
                              )
                              continue

                          definition_object_id = child_text(
                              production_activity,
                              "Definition.ObjectID",
                          )
                          if (
                              definition_object_id
                              != production_query["objectId"]
                          ):
                              differences.append(
                                  "Activity -> QueryDefinition ObjectID "
                                  "relationship differs for "
                                  f"{source_query['customerKey']}: "
                                  f"activity={definition_object_id!r}, "
                                  f"query="
                                  f"{production_query['objectId']!r}"
                              )

                          if (
                              production_query["name"]
                              != source_query["name"]
                          ):
                              differences.append(
                                  "Query name: "
                                  f"source={source_query['name']!r}, "
                                  f"production="
                                  f"{production_query['name']!r}"
                              )

                          if (
                              normalize_sql(
                                  production_query["queryText"]
                              )
                              != normalize_sql(
                                  source_query["queryText"]
                              )
                          ):
                              differences.append(
                                  "QueryText differs for "
                                  f"{source_query['customerKey']}"
                              )

                          if (
                              production_query["targetType"]
                              != source_query["targetType"]
                          ):
                              differences.append(
                                  "Query TargetType for "
                                  f"{source_query['customerKey']}: "
                                  f"source={source_query['targetType']!r}, "
                                  f"production="
                                  f"{production_query['targetType']!r}"
                              )

                          if (
                              production_query["targetUpdateType"]
                              != source_query["targetUpdateType"]
                          ):
                              differences.append(
                                  "Query TargetUpdateType for "
                                  f"{source_query['customerKey']}: "
                                  f"source="
                                  f"{source_query['targetUpdateType']!r}, "
                                  f"production="
                                  f"{production_query['targetUpdateType']!r}"
                              )

                          if (
                              production_query["target"].get(
                                  "customerKey"
                              )
                              != source_target["customerKey"]
                          ):
                              differences.append(
                                  "Query target DE CustomerKey for "
                                  f"{source_query['customerKey']}: "
                                  f"source="
                                  f"{source_target['customerKey']!r}, "
                                  f"production="
                                  f"{production_query['target'].get('customerKey')!r}"
                              )

              print("")
              print("==========================================")
              print("PRODUCTION AUTOMATION READ-ONLY COMPARISON")
              print("==========================================")
              print("Automation:", automation["name"])
              print("CustomerKey:", automation["customerKey"])
              print("Program ObjectID:", program_id)
              print("Schedule changed: NO")
              print("Activated: NO")
              print("Executed: NO")
              print("Create/Update/Delete performed: NO")

              if differences:
                  print("")
                  print("RESULT: DIFFERENCES FOUND")
                  for index, difference in enumerate(differences, start=1):
                      print(f"{index}. {difference}")
                  print("==========================================")
                  raise RuntimeError(
                      "Existing Production Automation differs from the "
                      "approved Sandbox definition. Read-only comparison "
                      "completed; no Production changes were made."
                  )

              print("")
              print("RESULT: MATCH")
              print(
                  "Existing Production Automation matches the approved "
                  "Sandbox definition for the compared SQL structure."
              )
              print("==========================================")
              raise SystemExit(0)

          print("")
          print("No identifiable Production Automation or Program found.")
          print("CREATE path is permitted by existence guard.")
          print("Target DE and QueryDefinition safety checks still apply.")

          automation_tasks_xml = []

          sorted_tasks = sorted(
              tasks,
              key=lambda item: int(item.get("sequence", 0)),
          )

          for task_index, task in enumerate(sorted_tasks, start=1):
              activities_xml = []

              sorted_activities = sorted(
                  task["activities"],
                  key=lambda item: int(item.get("sequence", 0)),
              )

              for activity_index, activity in enumerate(
                  sorted_activities,
                  start=1,
              ):
                  query = activity["definition"]
                  target = query["targetDataExtension"]

                  production_de = get_de(target["customerKey"])
                  if production_de is None:
                      raise RuntimeError(
                          f"Target DE {target['customerKey']} does not exist "
                          "in Production. Automation deployment stopped."
                      )

                  production_query = get_query(query["customerKey"])

                  if production_query is None:
                      query_xml = (
                          f"<CustomerKey>{esc(query['customerKey'])}</CustomerKey>"
                          f"<Name>{esc(query['name'])}</Name>"
                          f"<Description>{esc(query.get('description', ''))}</Description>"
                          f"<QueryText>{esc(query['queryText'])}</QueryText>"
                          f"<TargetType>{esc(query['targetType'])}</TargetType>"
                          f"<TargetUpdateType>{esc(query['targetUpdateType'])}</TargetUpdateType>"
                          "<DataExtensionTarget>"
                          f"<ObjectID>{esc(production_de['objectId'])}</ObjectID>"
                          f"<CustomerKey>{esc(production_de['customerKey'])}</CustomerKey>"
                          f"<Name>{esc(production_de['name'])}</Name>"
                          "</DataExtensionTarget>"
                      )

                      new_query_id = create(
                          "QueryDefinition",
                          query_xml,
                      )

                      time.sleep(2)
                      production_query = get_query(query["customerKey"])

                      if (
                          production_query is None
                          or production_query["objectId"] != new_query_id
                      ):
                          raise RuntimeError(
                              f"{query['customerKey']}: "
                              "QueryDefinition verification failed."
                          )
                  else:
                      equivalent = (
                          production_query["name"] == query["name"]
                          and normalize_sql(production_query["queryText"])
                              == normalize_sql(query["queryText"])
                          and production_query["targetType"]
                              == query["targetType"]
                          and production_query["targetUpdateType"]
                              == query["targetUpdateType"]
                          and production_query["target"].get("customerKey")
                              == target["customerKey"]
                      )

                      if not equivalent:
                          raise RuntimeError(
                              f"{query['customerKey']}: existing Production "
                              "QueryDefinition differs. CREATE-only POC will "
                              "not modify it."
                          )

                  activity_name = activity.get("name") or query["name"]
                  activity_key = (
                      activity.get("customerKey")
                      or query["customerKey"]
                  )

                  activities_xml.append(
                      "<Activity>"
                      f"<Name>{esc(activity_name)}</Name>"
                      f"<CustomerKey>{esc(activity_key)}</CustomerKey>"
                      f"<Sequence>{activity_index}</Sequence>"
                      '<ActivityObject xsi:type="QueryDefinition">'
                      f"<ObjectID>{esc(production_query['objectId'])}</ObjectID>"
                      f"<CustomerKey>{esc(production_query['customerKey'])}</CustomerKey>"
                      f"<Name>{esc(production_query['name'])}</Name>"
                      "</ActivityObject>"
                      "</Activity>"
                  )

              task_name = task.get("name") or f"Step {task_index}"

              # Retrieval exposes Task ObjectID/name/sequence but not a reusable
              # source Task CustomerKey. This key is generated deterministically
              # from approved Automation CustomerKey + task sequence.
              task_key = (
                  f"{automation['customerKey']}_TASK_{task_index}"
              )

              automation_tasks_xml.append(
                  "<AutomationTask>"
                  f"<Name>{esc(task_name)}</Name>"
                  f"<CustomerKey>{esc(task_key)}</CustomerKey>"
                  f"<Sequence>{task_index}</Sequence>"
                  "<AutomationTaskType>Query</AutomationTaskType>"
                  "<Activities>"
                  + "".join(activities_xml)
                  + "</Activities>"
                  "</AutomationTask>"
              )

          automation_xml = (
              f"<CustomerKey>{esc(automation['customerKey'])}</CustomerKey>"
              f"<Name>{esc(automation['name'])}</Name>"
              f"<Description>{esc(automation.get('description', ''))}</Description>"
              "<AutomationTasks>"
              + "".join(automation_tasks_xml)
              + "</AutomationTasks>"
          )

          automation_object_id = create(
              "Automation",
              automation_xml,
          )

          print("Automation Create NewObjectID:", automation_object_id)

          # Verification uses the relationship chain already proven during
          # Sandbox retrieval: Automation CustomerKey -> Program -> Task -> Activity.
          time.sleep(2)

          programs = retrieve(
              "Program",
              ["ObjectID", "CustomerKey", "Name", "Status"],
              "CustomerKey",
              automation["customerKey"],
          )
          programs = [
              p for p in programs
              if child_text(p, "CustomerKey") == automation["customerKey"]
          ]

          if len(programs) != 1:
              raise RuntimeError(
                  f"Expected exactly one Production Program; got {len(programs)}."
              )

          program_id = child_text(programs[0], "ObjectID")

          if program_id != automation_object_id:
              raise RuntimeError(
                  "Production Program ObjectID does not match "
                  "Automation Create NewObjectID."
              )

          production_tasks = retrieve(
              "Task",
              ["ObjectID", "Program.ObjectID", "Name", "Sequence"],
              "Program.ObjectID",
              program_id,
          )

          if len(production_tasks) != len(sorted_tasks):
              raise RuntimeError(
                  f"Task count mismatch: expected {len(sorted_tasks)}, "
                  f"got {len(production_tasks)}."
              )

          activity_count = 0

          for production_task in production_tasks:
              task_id = child_text(production_task, "ObjectID")
              activities = retrieve(
                  "Activity",
                  [
                      "ObjectID",
                      "Task.ObjectID",
                      "Definition.ObjectID",
                      "CustomerKey",
                      "Name",
                      "Sequence",
                  ],
                  "Task.ObjectID",
                  task_id,
              )
              activity_count += len(activities)

          expected_activity_count = sum(
              len(task["activities"])
              for task in sorted_tasks
          )

          if activity_count != expected_activity_count:
              raise RuntimeError(
                  f"Activity count mismatch: expected "
                  f"{expected_activity_count}, got {activity_count}."
              )

          print("")
          print("==========================================")
          print("PRODUCTION AUTOMATION DEPLOYMENT VERIFIED")
          print("==========================================")
          print("Automation:", automation["name"])
          print("CustomerKey:", automation["customerKey"])
          print("Program ObjectID:", program_id)
          print("Tasks:", len(production_tasks))
          print("Activities:", activity_count)
          print("Schedule deployed: NO")
          print("Activated: NO")
          print("Executed: NO")
          print("==========================================")
          PY

      - name: Deployment complete
        run: |
          echo "Production Automation workflow completed safely."
          echo "No schedule was deployed."
          echo "Automation was not activated."
          echo "Automation was not executed."
